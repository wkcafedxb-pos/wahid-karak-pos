<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21180F">
<title>Wahid Karak POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wahid POS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.app.solo{grid-template-columns:1fr}.app.solo .rail{display:none}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}:root{padding:0}body{background:#fff!important}#printArea{display:block;white-space:pre;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:#000;margin:0}#printArea.receipt{font-size:10.5px;line-height:1.35}#printArea.a4{font-size:11px;line-height:1.45}}
/* Layout: counter-terminal app — nav rail (bottom bar on phones), working area, cart pane on Sell */
:root{
  --bg:#F1EEE9; --surface:#FFFFFF; --surface-2:#E9E4DC; --line:#D9D1C5;
  --fg:#21180F; --muted:#6B5E50;
  --karak:#A4561B; --karak-soft:#F3E3D2; --on-karak:#FFFFFF;
  --cardamom:#2E6A4E; --cardamom-soft:#DDEDE3;
  --saffron:#C98A12;
  --ok:#2E7A4C; --warn:#A86A0C; --bad:#B0281F;
  --ok-soft:#DCEFE2; --warn-soft:#F6E8C8; --bad-soft:#F6DAD6;
  --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 20px rgba(60,40,20,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110D; --surface:#1F1913; --surface-2:#2A221A; --line:#3B3026;
  --fg:#F2E9DE; --muted:#B0A08E;
  --karak:#E0893A; --karak-soft:#3A2717; --on-karak:#1A1007;
  --cardamom:#72B892; --cardamom-soft:#1E3328; --saffron:#EDB540;
  --ok:#6CC08D; --warn:#E6A93D; --bad:#F07B70;
  --ok-soft:#1C3325; --warn-soft:#3A2D12; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110D; --surface:#1F1913; --surface-2:#2A221A; --line:#3B3026;
  --fg:#F2E9DE; --muted:#B0A08E;
  --karak:#E0893A; --karak-soft:#3A2717; --on-karak:#1A1007;
  --cardamom:#72B892; --cardamom-soft:#1E3328; --saffron:#EDB540;
  --ok:#6CC08D; --warn:#E6A93D; --bad:#F07B70;
  --ok-soft:#1C3325; --warn-soft:#3A2D12; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--karak);outline-offset:2px}

.app{display:grid;grid-template-columns:88px 1fr;height:100%}
.rail{background:var(--fg);color:var(--bg);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:12px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:grid;place-items:center;padding:4px 0 12px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1;color:var(--saffron);text-align:center}
.brand span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:none;border-radius:10px;cursor:pointer;color:inherit;opacity:.72;font-size:.7rem;font-weight:600}
.nav svg{width:22px;height:22px}
.nav:hover{opacity:1;background:rgba(127,127,127,.15)}
.nav.on{opacity:1;background:var(--karak);color:var(--on-karak)}
.nav .lock{font-size:.6rem}
.rail .spacer{flex:1}
.rail .mob-more{display:none}
main{overflow-y:auto;min-width:0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.fill{overflow:hidden;padding-block:12px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mute{background:var(--surface-2);color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:.88rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--karak);color:var(--on-karak);border-color:var(--karak)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.grn{background:var(--cardamom);color:var(--bg);border-color:var(--cardamom)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.82rem}
.btn.big{min-height:56px;font-size:1.1rem;padding:10px 18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--karak)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:.78rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

/* Sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;height:100%}
.menu-side{display:flex;flex-direction:column;min-height:0;gap:10px}
.ordertype{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.cats .chip{flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;overflow-y:auto;padding:2px 2px 8px;align-content:start;min-height:0;flex:1}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 10px;cursor:pointer;min-height:92px;transition:transform .08s}
.tile:hover{border-color:var(--karak)}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:700;line-height:1.2}
.tile .p{margin-top:auto;font-family:var(--f-mono);font-weight:600;color:var(--karak)}
.tile .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.tile .inc{position:absolute;bottom:8px;right:10px;background:var(--karak);color:var(--on-karak);border-radius:999px;font-size:.75rem;font-weight:700;padding:1px 7px;font-family:var(--f-mono)}
.tile.low{opacity:.75}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cart-lines{flex:1;overflow-y:auto;padding:4px 0}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px dashed var(--line);cursor:pointer}
.cl:hover{background:var(--surface-2)}
.cl .nm{font-weight:600;line-height:1.25}
.cl .md{font-size:.78rem;color:var(--cardamom)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:30px;height:30px;cursor:pointer;font-weight:700;font-size:1rem}
.qty span{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:600}
.cart-f{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tl{display:flex;justify-content:space-between;font-size:.9rem}
.tl span:last-child{font-family:var(--f-mono)}
.tl.total{font-size:1.35rem;font-weight:800;font-family:var(--f-display);margin-top:2px}
.tl.total span:last-child{font-family:var(--f-display)}
.mbar{display:none}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tables button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:700}
.tables button.busy{background:var(--warn-soft);border-color:var(--warn)}
.tables button.on{background:var(--karak);color:var(--on-karak);border-color:var(--karak)}

/* Kitchen */
.kds{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;overflow-x:auto}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.kcol h3{display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kcard .tk{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.kcard ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.kcard.late{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,12,4,.5);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--bg);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dlg.wide{width:min(860px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:1}
.dlg-h h2{margin-right:auto}
.dlg-b{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.change{font-family:var(--f-display);font-weight:800;font-size:2rem}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:.78rem;white-space:pre;overflow-x:auto;line-height:1.5}
.token{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:1;color:var(--karak)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.denoms label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.bar-h{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:8px;align-items:center;font-size:.86rem;padding:3px 0}
.bar-h .b{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-h .b i{display:block;height:100%;background:var(--karak);border-radius:5px}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--karak)}
svg.chart .bar.hi{fill:var(--saffron)}
svg.chart .ln{fill:none;stroke:var(--cardamom);stroke-width:2.5}
svg.chart .ar2{fill:var(--cardamom-soft)}
svg.chart .pt{fill:var(--cardamom)}
.ai-out{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.92rem}
.morebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.morebox .nav{background:var(--surface);color:var(--fg);opacity:1;border:1px solid var(--line);padding:14px 4px;font-size:.82rem}

@media (max-width:1100px){.sell{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow:visible}
  .rail .brand,.rail .spacer,.rail .nav.x{display:none}
  .rail .mob-more{display:flex}
  .nav{flex:1;padding:6px 0}
  main.fill{overflow:hidden;padding-block:10px 0}
  .sell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:0}
  .cart{position:fixed;left:0;right:0;bottom:0;top:12%;z-index:40;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .mbar{display:flex;gap:10px;align-items:center;padding:8px 0}
  .mbar .btn{flex:1}
  .kds{grid-template-columns:repeat(3,minmax(230px,80vw))}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- phone & tablet tuning ---- */
.btn{color:var(--fg)}a.btn{text-decoration:none}
.btn.pri{color:var(--on-karak)}.btn.grn{color:var(--bg)}.btn.danger{color:var(--bad)}
.cart-bd{display:none}
.banner{cursor:pointer}
@media (max-width:820px){
  input,select,textarea{font-size:16px}
  .banner{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;padding:6px 10px;margin-bottom:8px}
  .banner.open{white-space:normal}
  .topbar{gap:8px;margin-bottom:10px}
  .topbar h1{flex:1 1 auto}
  .topbar>.row{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg{overflow-x:auto;max-width:100%;flex-wrap:nowrap;scrollbar-width:none}
  .seg button{white-space:nowrap;flex:none}
  .seg.otype{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  .seg.otype button{padding:9px 2px;font-size:.78rem}
  .menu-side{min-width:0}
  .menu-side>.row{gap:6px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tile{min-height:80px;padding:9px 9px 8px;border-radius:10px}
  .tile .n{font-size:.86rem}.tile .p{font-size:.86rem}
  .tile .dot{top:8px;right:8px;width:7px;height:7px}
  .qty button{width:38px;height:38px}
  .cl{padding:10px 14px}
  .cart-bd{display:block;position:fixed;inset:0;background:rgba(20,12,4,.45);z-index:39}
  .cart{top:auto;max-height:88%;height:88%}
  .cart-h::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
  .cart-h{position:relative;padding-top:16px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}.kpi .v{font-size:1.15rem}
  .kds{grid-template-columns:1fr;overflow:visible}
  .kcol{min-height:0}
  .ov{align-items:end;padding:0}
  .dlg,.dlg.wide{width:100%;max-height:92%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg-h{padding-top:18px}
  .dlg-h::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
  .dlg-f .btn{flex:1}
  .fgrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  .tbl-wrap tr.click:hover td:first-child{background:var(--surface-2)}
  .dlg .tbl-wrap th:first-child,.dlg .tbl-wrap td:first-child{background:var(--bg)}
  td{padding:9px 6px}
  .toast{bottom:calc(138px + env(safe-area-inset-bottom,0px))}
  .denoms{grid-template-columns:repeat(3,1fr)}
  .tables{grid-template-columns:repeat(6,1fr)}
  .tables button{padding:10px 2px}
  .tl.total{font-size:1.15rem}
  .receipt{font-size:.72rem;padding:10px}
  .token{font-size:3rem}
  .keys button{padding:13px 4px;font-size:1rem}
  .change{font-size:1.7rem}
  .panel{padding:14px}
  .nav span{font-size:.66rem}
}

main.fill{display:flex;flex-direction:column}main.fill>.sell{flex:1;min-height:0;height:auto}

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p)=> (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round(((+n)||0)*100+Number.EPSILON*100)/100;
const fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const aed=n=>'AED '+fmt(n);
const pad2=n=>String(n).padStart(2,'0');
const dkey=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const mkey=d=>dkey(d).slice(0,7);
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const tstr=ts=>{const d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const dstr=k=>{const d=new Date(k+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const daysUntil=k=>k?Math.round((new Date(k+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function deepMerge(a,b){for(const k in b){const bv=b[k],av=a[k];if(bv&&typeof bv==='object'&&!Array.isArray(bv)&&av&&typeof av==='object'&&!Array.isArray(av))deepMerge(av,bv);else a[k]=clone({x:bv}).x}return a}

/* ---------- device-local fallback store (same shape as the shared db) ---------- */
function LocalDB(){
  let store=lsGet('wk_localdb',{});const subs=new Set();
  const save=()=>lsSet('wk_localdb',store);
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const snap=p=>{const d=store[p];return{id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const cmp=(a,op,b)=>op==='=='?a===b:op==='!='?a!==b:op==='>='?a>=b:op==='<='?a<=b:op==='>'?a>b:op==='<'?a<b:op==='in'?b.includes(a):false;
  function doc(p){return{id:p.split('/').pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=clone(d);save();notify()},
    update:async d=>{if(!store[p])throw{code:'invalid_argument',message:'missing'};deepMerge(store[p],clone(d));save();notify()},
    delete:async()=>{delete store[p];save();notify()},
    onSnapshot:n=>{const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
    collection:c=>coll(p+'/'+c)}}
  function coll(p,filters){filters=filters||[];const depth=p.split('/').length+1;
    const run=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===depth).sort().map(snap).filter(s=>filters.every(([f,op,v])=>cmp(s.data()[f],op,v)));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    return{path:p,where:(f,op,v)=>coll(p,filters.concat([[f,op,v]])),orderBy:()=>coll(p,filters),limit:()=>coll(p,filters),
      get:async()=>run(),onSnapshot:n=>{const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
      doc:id=>doc(p+'/'+(id||uid())),add:async d=>{const r=doc(p+'/'+uid());await r.set(d);return r}}}
  return{doc,collection:p=>coll(p)};
}

  expCats:['Supplies','Rent','DEWA','Salaries','Gas cylinder','Internet & phone','Maintenance','Licence & fees','Other']};
const CAT_COLORS=['var(--karak)','var(--cardamom)','var(--saffron)','#8B5CF6','#0E7490','#BE185D','#65A30D','#B45309'];
const S={ready:false,mode:'connecting',settings:clone(DEF_SETTINGS),menu:{cats:[],items:{}},inv:{items:{}},staff:{items:{}},cust:{},tickets:{},orders:{},exp:{},closes:{},sup:{items:{}},pur:{},mov:{},po:{},
  loaded:{}};
let DB=null;
const DEV=lsGet('wk_dev',null)||(()=>{const d='d'+Math.random().toString(36).slice(2,8);lsSet('wk_dev',d);return d})();
const now=new Date();const WIN=dkey(new Date(now.getFullYear(),now.getMonth()-1,1));
let UI={view:'sell',cat:'all',q:'',kTab:'kitchen',hFilter:'',rRange:'today',rFrom:today(),rTo:today(),expMonth:mkey(new Date()),stockQ:'',menuQ:'',custQ:'',cartOpen:false,ai:'',aiBusy:false};
let cart=lsGet('wk_cart',null)||newCart();
let cashier=lsGet('wk_cashier','');
function newCart(){return{lines:[],type:'take',table:'',car:'',plat:'',cust:'',disc:null,note:'',ticket:null}}
function saveCart(){lsSet('wk_cart',cart)}

/* ---------- writes (one at a time per document) ---------- */
const wq={};
function queued(path,fn){const p=(wq[path]||Promise.resolve()).then(fn,fn);wq[path]=p.catch(()=>{});return p}
const RO=()=>Promise.reject({message:'you have view-only access'});
async function upsert(path,base,patch){if(S.mode==='readonly')return RO();return queued(path,async()=>{
  const ref=DB.doc(path);
  if(DB.fb){const b={};for(const k in base)if(base[k]==null||typeof base[k]!=='object')b[k]=base[k];return ref.update(deepMerge(b,patch))}
  try{await ref.update(patch)}catch(e){
    if(e&&e.code==='invalid_argument'){const s=await ref.get();if(!s.exists){await ref.set(deepMerge(clone(base),patch));return}}
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return ref.update(patch)}
    throw e}})}
function setDoc(path,data){if(S.mode==='readonly')return RO();return queued(path,()=>DB.doc(path).set(data))}
function delDoc(path){if(S.mode==='readonly')return RO();return queued(path,()=>DB.doc(path).delete())}
function fail(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full. Export a backup and remove old records.':'Could not save: '+((e&&e.message)||'try again'))}

/* ---------- subscriptions ---------- */
function subscribe(){
  const onErr=e=>{console.warn(e);if(e&&e.code==='revoked'){S.mode='readonly';paint()}};
  DB.doc('cfg/settings').onSnapshot(s=>{S.settings=Object.assign(clone(DEF_SETTINGS),s.data()||{});S.loaded.settings=1;changed()},onErr);
  DB.doc('cfg/menu').onSnapshot(s=>{const d=s.data()||{};S.menu={cats:d.cats||[],items:d.items||{}};S.loaded.menu=1;changed()},onErr);
  DB.doc('cfg/inv').onSnapshot(s=>{const d=s.data()||{};S.inv={items:d.items||{}};S.loaded.inv=1;changed()},onErr);
  DB.doc('cfg/staff').onSnapshot(s=>{const d=s.data()||{};S.staff={items:d.items||{}};changed()},onErr);
  DB.collection('cust').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.cust=m;changed()},onErr);
  DB.collection('tickets').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.tickets=m;changed()},onErr);
  DB.collection('orders').where('date','>=',WIN).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const b=d.data();const o=b.o||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});S.orders=m;S.loaded.orders=1;changed()},onErr);
  DB.collection('exp').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const o=(d.data().o)||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});S.exp=m;changed()},onErr);
  DB.doc('cfg/sup').onSnapshot(s=>{const d=s.data()||{};S.sup={items:d.items||{}};changed()},onErr);
  const flat=(q,f)=>{const m={};q.docs.forEach(d=>{const o=(d.data().o)||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});return m};
  DB.collection('pur').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{S.pur=flat(q);changed()},onErr);
  DB.collection('mov').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{S.mov=flat(q);changed()},onErr);
  DB.collection('po').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.po=m;changed()},onErr);
  DB.collection('close').where('date','>=',WIN).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.closes=m;changed()},onErr);
}
let paintPending=false;
function changed(){S.ready=true;if(paintPending)return;paintPending=true;requestAnimationFrame(()=>{paintPending=false;
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){
    if(['q','hf','custQ','stockQ','menuQ'].includes(a.id)){const id=a.id,pos=a.selectionStart;paint();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}return}
    deferred=true;return}
  paint()})}
let deferred=false;
document.addEventListener('focusout',()=>{if(deferred){deferred=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))paint();else deferred=true},50)}});

/* ---------- derived ---------- */
const menuItems=()=>Object.entries(S.menu.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del).sort((a,b)=>(a.sort||0)-(b.sort||0)||a.name.localeCompare(b.name));
const invItems=()=>Object.entries(S.inv.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del).sort((a,b)=>a.name.localeCompare(b.name));
const staffList=()=>Object.entries(S.staff.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del);
const custList=()=>Object.entries(S.cust).map(([id,v])=>Object.assign({id},v)).filter(c=>!c.del).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const ordersOn=k=>Object.values(S.orders).filter(o=>o.date===k).sort((a,b)=>a.ts-b.ts);
const live=o=>!o.void;
function itemCost(it){if(!it)return 0;const rc=it.recipe||{};const ks=Object.keys(rc);if(!ks.length)return +it.cost||0;let c=0;for(const k of ks){const v=S.inv.items[k];if(v)c+=(+rc[k]||0)*(+v.cost||0)}return r2(c+(+it.pack||0))}
function consumption(){const c={};const inv=S.inv.items;
  for(const o of Object.values(S.orders)){if(o.void)continue;for(const l of o.lines||[]){const it=S.menu.items[l.i];if(!it||!it.recipe)continue;
    for(const k in it.recipe){const v=inv[k];if(!v)continue;if(o.ts>(v.asOf||0))c[k]=(c[k]||0)+(+it.recipe[k]||0)*l.q}}}
  return c}
function stockNow(){const c=consumption();const m={};for(const it of invItems()){m[it.id]=r2((+it.qty||0)-(c[it.id]||0))}return m}
function stockState(it,q){if(q<=0)return'out';if(q<=(+it.min||0))return'low';return'ok'}
function custBal(c){let bal=0,st=0;for(const t of Object.values((c&&c.tx)||{})){if(t.t==='credit')bal+=+t.amt;else if(t.t==='pay')bal-=+t.amt;else if(t.t==='adj')bal+=+t.amt;else if(t.t==='stamp')st+=+t.n;else if(t.t==='redeem')st-=+t.n}return{bal:r2(bal),stamps:st}}
function calc(c){const sub=r2(c.lines.reduce((s,l)=>s+l.p*l.q,0));let disc=0;
  if(c.disc){disc=c.disc.type==='pct'?r2(sub*Math.min(100,+c.disc.v||0)/100):Math.min(sub,r2(+c.disc.v||0))}
  const after=r2(sub-disc);const rate=(+S.settings.vat||0)/100;let total,vat,net;
  if(S.settings.inclusive){total=after;vat=r2(total*rate/(1+rate));net=r2(total-vat)}else{net=after;vat=r2(net*rate);total=r2(net+vat)}
  return{sub,disc,net,vat,total}}
const TYPES={take:'Takeaway',dine:'Dine-in',car:'Car service',deliv:'Delivery'};
const PAYN={cash:'Cash',card:'Card',credit:'Credit (khata)',platform:'Platform'};
function staffName(id){const s=S.staff.items[id];return s?s.name:(id?'—':'Counter')}
function isManagerUnlocked(){if(S.role)return S.role==='owner'||S.role==='manager'||(!!S.settings.managerPin&&ssGet('wk_mgr')==='1');return !S.settings.managerPin||ssGet('wk_mgr')==='1'}
function devCode(){return lsGet('wk_devcode','')}
function nextToken(){const t=today();const mine=Object.values(S.orders).filter(o=>o.date===t&&o.dev===DEV).length;return devCode()+(mine+1)}

/* ---------- icons ---------- */
const IC={sell:'<path d="M3 4h2l2.4 11h10.8l2.3-8H6.1"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',
orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
today:'<path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/>',
customers:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.3 3.3 0 0 1 0 6.4M21.5 20c0-2.8-1.7-4.8-4-5.6"/>',
stock:'<path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="M3 7.5v9L12 21l9-4.5v-9M12 12v9"/>',
menu:'<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10.5h1.5a2.3 2.3 0 0 1 0 4.6H17M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/>',
expenses:'<path d="M5 3h14v18l-2.3-1.6L14.3 21 12 19.4 9.7 21l-2.4-1.6L5 21z"/><path d="M9 8h6M9 12h6"/>',
close:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/>',
reports:'<path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/>',
staff:'<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="11" r="2.4"/><path d="M8.5 17c.6-1.6 1.9-2.4 3.5-2.4s2.9.8 3.5 2.4M10 6h4"/>',
setup:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const VIEWS=[['sell','Sell'],['orders','Orders'],['today','Today'],['customers','Customers'],['stock','Materials'],['menu','Menu'],['expenses','Expenses'],['close','Day close'],['reports','Reports'],['staff','Staff'],['setup','Settings']];
const MOBILE_MAIN=['sell','orders','today','customers'];
const LOCKED=new Set(['menu','close','reports','staff','setup','expenses']);
const RO_OK=new Set(['reports','expenses','close','menu']);

/* ---------- shell ---------- */
function paintRail(){
  const kcount=kitchenQueue().filter(k=>k.status!=='ready').length;
  $('#rail').innerHTML=`<div class="brand"><b>Wahid<br>Karak</b><span>POS</span></div>`+
   VIEWS.map(([k,l])=>`<button class="nav ${UI.view===k?'on':''} ${MOBILE_MAIN.includes(k)?'':'x'}" data-a="go" data-v="${k}" aria-label="${l}">${icon(k)}<span>${l}${k==='orders'&&kcount?` (${kcount})`:''}</span></button>`).join('')+
   `<button class="nav mob-more" data-a="more" aria-label="More">${icon('more')}<span>More</span></button><div class="spacer"></div>${S.user?`<button class="nav x" data-a="signOut" title="${esc(S.user.email||'')}">${icon('staff')}<span>Sign out</span></button>`:''}`;
}
function paint(){
  paintRail();
  const v=$('#view');
  document.querySelector('.app').classList.toggle('solo',S.auth==='out'||S.auth==='pending');
  if(S.auth==='out'){v.className='';v.innerHTML=loginHtml();return}
  if(S.auth==='pending'){v.className='';v.innerHTML=pendingHtml();return}
  v.className=UI.view==='sell'?'fill':'';
  if(!S.ready){v.innerHTML=`<div class="empty" style="margin-top:20vh"><b>Opening the till…</b>Connecting to your cafe's records.</div>`;return}
  if(LOCKED.has(UI.view)&&!isManagerUnlocked()&&!(S.mode==='readonly'&&RO_OK.has(UI.view))){v.innerHTML=lockScreen();return}
  const fn=RENDER[UI.view]||RENDER.sell;v.innerHTML=modeBanner()+fn();
  if(UI.view==='sell')afterSell();
}
function modeBanner(){
  let b='';
  if(S.mode==='local')b+=`<div class="banner" data-a="bannerTog" title="Tap to read more"><b>Demo mode.</b> Firebase is not connected yet (fill in firebase-config.js), so everything is saved in this browser only.</div>`;
  if(S.mode==='readonly')b+=`<div class="banner" data-a="bannerTog" title="Tap to read more"><b>Accountant view.</b> You can see sales, VAT, purchases and reports, and print or export them. Nothing can be changed from this account.</div>`;
  if(S.offline)b+=`<div class="banner" data-a="bannerTog" title="Tap to read more" style="background:var(--bad-soft)"><b>No internet.</b> Keep selling: bills are saved on this device and sync when the connection returns.</div>`;
  if(b)return b;
  return'';
}
function loginHtml(){return `<div class="panel" style="max-width:400px;margin:8vh auto 0"><div class="lbl" style="color:var(--karak)">Wahid Karak POS</div><h1 style="margin:4px 0 6px">${UI.signup?'Create staff account':'Sign in'}</h1>
 <p class="small muted" style="margin:0 0 14px">${UI.signup?'After you sign up, the owner approves your account and gives you a role.':'Use the email and password the owner set up for you.'}</p>
 <form data-f="${UI.signup?'signup':'login'}" class="stack"><label class="field"><span class="lbl">Email</span><input id="lgE" type="email" autocomplete="username" required></label><label class="field"><span class="lbl">Password</span><input id="lgP" type="password" autocomplete="${UI.signup?'new-password':'current-password'}" minlength="6" required></label>
 <button class="btn pri big">${UI.signup?'Create account':'Sign in'}</button></form>
 <div class="row" style="justify-content:space-between;margin-top:10px">${UI.signup?'<button class="btn ghost" data-a="toLogin">I have an account</button>':'<button class="btn ghost" data-a="forgot">Forgot password</button><button class="btn ghost" data-a="toSignup">New staff? Create account</button>'}</div></div>`}
function pendingHtml(){return `<div class="panel" style="max-width:440px;margin:10vh auto 0"><h1>Waiting for approval</h1><p>You are signed in as <b>${esc(S.user&&S.user.email)}</b>. Ask the owner to open <b>Settings → Team</b> and give you a role. This page opens by itself once approved.</p><button class="btn" data-a="signOut">Sign out</button></div>`}
function lockScreen(){if(S.role)return `<div class="panel" style="max-width:420px;margin:10vh auto 0"><h2>For managers</h2><p class="muted">Your account (${esc(S.role)}) can't open this section. Ask the owner, or sign in with a manager account.</p>${S.settings.managerPin?`<form data-f="unlock" class="stack"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="Manager PIN (view only)"><button class="btn">Unlock to view</button></form>`:''}</div>`;return `<div class="panel" style="max-width:380px;margin:12vh auto 0" ><h2>Manager PIN</h2><p class="muted small">This section is for the manager. Enter the PIN set in Settings.</p>
 <form data-f="unlock" class="stack"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn pri">Unlock</button></form></div>`}
function go(v){if(!VIEWS.some(x=>x[0]===v))v='sell';UI.view=v;UI.cartOpen=false;if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}paint();$('#view').scrollTop=0}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==UI.view)go(h)});

/* ---------- SELL ---------- */
const RENDER={};
RENDER.sell=function(){
  const items=menuItems().filter(i=>i.active!==false);
  const stock=stockNow();
  const cats=S.menu.cats||[];
  const q=UI.q.trim().toLowerCase();
  if(!items.length)return `<div class="empty" style="margin-top:10vh"><b>No menu items yet</b>Add your karak, snacks and juices in <a href="#menu">Menu</a>, then come back to ring sales.</div>`;
  const inCart={};cart.lines.forEach(l=>inCart[l.i]=(inCart[l.i]||0)+l.q);
  const shown=items.filter(i=>(UI.cat==='all'||(UI.cat==='fav'?i.fav:i.cat===UI.cat))&&(!q||i.name.toLowerCase().includes(q)||(i.code||'').toLowerCase()===q));
  const lowSet=new Set(invItems().filter(v=>stockState(v,stock[v.id])!=='ok').map(v=>v.id));
  const tiles=shown.map(i=>{const ci=cats.findIndex(c=>c.id===i.cat);const low=Object.keys(i.recipe||{}).some(k=>lowSet.has(k));
    return `<button class="tile ${low?'low':''}" data-a="add" data-id="${i.id}" title="${low?'An ingredient is low in stock':''}"><span class="dot" style="background:${CAT_COLORS[(ci<0?0:ci)%CAT_COLORS.length]}"></span><span class="n">${esc(i.name)}</span><span class="p">${fmt(i.price)}</span>${inCart[i.id]?`<span class="inc">×${inCart[i.id]}</span>`:''}</button>`}).join('');
  const nT=Object.keys(S.tickets).length;
  return `<div class="sell">
   <section class="menu-side">
    <div class="row" style="justify-content:space-between">
      <div class="seg otype" role="tablist" aria-label="Order type">${Object.entries(TYPES).map(([k,l])=>`<button class="${cart.type===k?'on':''}" data-a="otype" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="row"><button class="chip" data-a="tickets">Open orders <b class="num">${nT}</b></button><button class="chip" data-a="pickCashier">${icon('staff').replace('<svg','<svg width="16" height="16"')} ${esc(cashier?staffName(cashier):'Choose cashier')}</button></div>
    </div>
    ${typeExtra()}
    <div class="row" style="flex-wrap:nowrap"><input id="q" type="search" placeholder="Search menu or item code" value="${esc(UI.q)}" autocomplete="off" style="flex:1"></div>
    <div class="cats"><button class="chip ${UI.cat==='all'?'on':''}" data-a="cat" data-v="all">All</button>${items.some(i=>i.fav)?`<button class="chip ${UI.cat==='fav'?'on':''}" data-a="cat" data-v="fav">★ Quick</button>`:''}${cats.map(c=>`<button class="chip ${UI.cat===c.id?'on':''}" data-a="cat" data-v="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    <div class="tiles" id="tiles">${tiles||'<div class="empty">Nothing matches that search.</div>'}</div>
    <div class="mbar"><button class="btn pri big" data-a="openCart">${cart.lines.reduce((s,l)=>s+l.q,0)} items · ${aed(calc(cart).total)}</button></div>
   </section>
   ${UI.cartOpen?'<div class="cart-bd" data-a="closeCart"></div>':''}<aside class="cart ${UI.cartOpen?'open':''}" id="cartPane">${cartHtml()}</aside>
  </div>`;
};
function typeExtra(){
  if(cart.type==='dine'){const busy={};Object.values(S.tickets).forEach(t=>{if(t.table)busy[t.table]=t});
    let b='';for(let i=1;i<=(+S.settings.tables||0);i++){const k='T'+i;b+=`<button class="${cart.table===k?'on':busy[k]?'busy':''}" data-a="table" data-v="${k}" title="${busy[k]?'Open bill '+aed(calc(busy[k]).total):'Free'}">${k}</button>`}
    return `<div class="tables">${b}</div>`}
  if(cart.type==='car')return `<div class="row"><input id="carIn" placeholder="Car plate or description, e.g. Dubai K 48213 white Patrol" value="${esc(cart.car)}" style="flex:1"></div>`;
  if(cart.type==='deliv')return `<div class="row">${(S.settings.platforms||[]).map(p=>`<button class="chip ${cart.plat===p.id?'on':''}" data-a="plat" data-v="${p.id}">${esc(p.name)}</button>`).join('')}<button class="chip ${cart.plat==='own'?'on':''}" data-a="plat" data-v="own">Own delivery</button></div>`;
  return'';
}
function cartHtml(){
  const t=calc(cart);const c=cart.cust&&S.cust[cart.cust];
  const lines=cart.lines.map((l,ix)=>`<div class="cl" data-a="editLine" data-ix="${ix}"><div><div class="nm">${esc(l.n)}</div>${(l.m&&l.m.length)||l.note?`<div class="md">${esc((l.m||[]).concat(l.note?[l.note]:[]).join(' · '))}</div>`:''}<div class="small muted num">${fmt(l.p)} each</div></div>
    <div class="qty"><button data-a="q-" data-ix="${ix}" aria-label="Less">−</button><span>${l.q}</span><button data-a="q+" data-ix="${ix}" aria-label="More">+</button></div>
    <div class="num" style="min-width:58px;text-align:right;font-weight:600">${fmt(l.p*l.q)}</div></div>`).join('');
  let st='';if(c){const b=custBal(c);const ev=+S.settings.stampEvery||0;st=`<span class="pill p-ok">${b.stamps} stamps</span>${b.bal>0?`<span class="pill p-warn">owes ${fmt(b.bal)}</span>`:''}${ev&&b.stamps>=ev?`<button class="btn sm grn" data-a="redeem">Give free karak</button>`:''}`}
  return `<div class="cart-h"><h2 style="margin-right:auto">${cart.ticket?'Open bill':'New order'} <span class="muted small num">#${esc(nextToken())}</span></h2>
     <button class="btn sm ghost" data-a="closeCart" aria-label="Close cart" style="${UI.cartOpen?'':'display:none'}">Close</button>
     <button class="chip" data-a="pickCust">${c?esc(c.name):'+ Customer'}</button>${st}</div>
   <div class="cart-lines">${lines||`<div class="empty" style="margin:14px">Tap an item to start the order.<br><span class="small">Tip: tap a line to add sugar level or a note.</span></div>`}</div>
   <div class="cart-f">
    <div class="tl"><span class="muted">Subtotal</span><span>${fmt(t.sub)}</span></div>
    ${t.disc?`<div class="tl"><span class="muted">Discount ${cart.disc.type==='pct'?cart.disc.v+'%':''}</span><span>−${fmt(t.disc)}</span></div>`:''}
    <div class="tl"><span class="muted">VAT ${S.settings.vat}% ${S.settings.inclusive?'(included)':''}</span><span>${fmt(t.vat)}</span></div>
    <div class="tl total"><span>Total</span><span>${aed(t.total)}</span></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-a="disc" ${cart.lines.length?'':'disabled'}>Discount</button><button class="btn sm" data-a="hold" ${cart.lines.length?'':'disabled'}>${cart.type==='dine'?'Save to table':'Hold'}</button><button class="btn sm" data-a="kitchenSend" ${cart.lines.length?'':'disabled'} title="Send to kitchen before payment">Kitchen</button><button class="btn sm ghost danger" data-a="clear" ${cart.lines.length||cart.ticket?'':'disabled'}>Clear</button></div>
    <button class="btn pri big" data-a="pay" ${cart.lines.length&&S.mode!=='readonly'?'':'disabled'}>Charge ${aed(t.total)}</button>
   </div>`;
}
function afterSell(){const q=$('#q');if(q){q.oninput=()=>{UI.q=q.value;const pos=q.selectionStart;paint();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  q.onkeydown=e=>{if(e.key==='Enter'){const f=$('#tiles .tile');if(f){f.click();UI.q='';paint();$('#q').focus()}}}}
  const ci=$('#carIn');if(ci)ci.onchange=()=>{cart.car=ci.value;saveCart()};}
function repaintCart(){const p=$('#cartPane');if(p&&UI.view==='sell'){paint()}}
function addItem(id,opts){const it=S.menu.items[id];if(!it)return;try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}opts=opts||{};
  const m=opts.m||[];const ex=cart.lines.find(l=>l.i===id&&!l.note&&JSON.stringify(l.m||[])===JSON.stringify(m)&&l.p===(opts.p!=null?opts.p:+it.price));
  if(ex)ex.q++;else cart.lines.push({k:uid('l'),i:id,n:it.name,p:opts.p!=null?opts.p:+it.price,q:1,m,note:'',c:itemCost(it),cat:it.cat||''});
  saveCart();repaintCart()}

/* ---------- payment ---------- */
function payDialog(){
  const t=calc(cart);const c=cart.cust&&S.cust[cart.cust];
  const plat=cart.type==='deliv'&&cart.plat&&cart.plat!=='own';
  const methods=plat?['platform','cash','card']:['cash','card','credit','split'];
  let method=plat?'platform':'cash';let tend='';
  const draw=()=>{
    const tendN=+tend||0;const change=r2(tendN-t.total);
    let body='';
    if(method==='cash')body=`<div class="field"><span class="lbl">Cash received</span><input id="tend" class="num" inputmode="decimal" value="${esc(tend)}" placeholder="${fmt(t.total)}" style="font-size:1.3rem"></div>
      <div class="keys">${['exact',5,10,20,50,100,200,500].map(v=>`<button data-k="${v}">${v==='exact'?'Exact':v}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="lbl">Change to give</span><span class="change num" style="color:${tend&&change<0?'var(--bad)':'var(--cardamom)'}">${tend?(change<0?'Short '+fmt(-change):fmt(change)):'0.00'}</span></div>`;
    if(method==='card')body=`<p class="muted">Take ${aed(t.total)} on the card machine, then confirm here.</p><div class="field"><span class="lbl">Card reference (optional)</span><input id="cardRef" placeholder="Last 4 digits or approval code"></div>`;
    if(method==='credit'){if(!c)body=`<p>Choose the customer whose account gets this bill.</p><button class="btn" data-k="pickCust">Choose customer</button>`;
      else{const b=custBal(c);const lim=+c.limit||0;const over=lim&&b.bal+t.total>lim;body=`<p><b>${esc(c.name)}</b> owes ${aed(b.bal)} now; after this bill ${aed(b.bal+t.total)}.${lim?` Limit ${aed(lim)}.`:''}</p>${over?`<div class="banner" style="background:var(--bad-soft)">This bill goes over the credit limit.</div>`:''}`}}
    if(method==='split')body=`<div class="fgrid"><label class="field"><span class="lbl">Cash</span><input id="spCash" class="num" inputmode="decimal" placeholder="0.00"></label><label class="field"><span class="lbl">Card</span><input id="spCard" class="num" inputmode="decimal" placeholder="0.00"></label></div><p class="small muted" id="spMsg">Amounts must add up to ${aed(t.total)}.</p>`;
    if(method==='platform'){const p=(S.settings.platforms||[]).find(x=>x.id===cart.plat);body=`<p>${esc(p?p.name:'Platform')} collects payment. Commission of ${p?p.comm:0}% is deducted in Reports.</p><div class="field"><span class="lbl">Platform order ID</span><input id="platRef" placeholder="e.g. 7741-2093"></div>`}
    openModal(`<div class="dlg-h"><h2>Charge ${aed(t.total)}</h2><button class="btn ghost" data-close>Cancel</button></div>
     <div class="dlg-b"><div class="seg">${methods.map(m=>`<button class="${m===method?'on':''}" data-m="${m}">${m==='split'?'Split':PAYN[m].split(' ')[0]}</button>`).join('')}</div>${body}</div>
     <div class="dlg-f"><button class="btn pri big" id="payGo" style="flex:1">Confirm payment</button></div>`,dlg=>{
      dlg.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{method=b.dataset.m;draw()});
      dlg.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='pickCust'){closeModal();pickCustomer(()=>payDialog());return}if(k==='exact')tend=String(t.total);else tend=String((+tend||0)+(+k));draw()});
      const ti=dlg.querySelector('#tend');if(ti){if(!COARSE)ti.focus();ti.oninput=()=>{tend=ti.value;const ch=r2((+tend||0)-t.total);const el=dlg.querySelector('.change');el.textContent=tend?(ch<0?'Short '+fmt(-ch):fmt(ch)):'0.00';el.style.color=tend&&ch<0?'var(--bad)':'var(--cardamom)'};ti.onkeydown=e=>{if(e.key==='Enter')dlg.querySelector('#payGo').click()}}
      dlg.querySelector('#payGo').onclick=async()=>{
        const pay={};let tendered=0,change=0,ref='';
        if(method==='cash'){tendered=tend===''?t.total:+tend;if(tendered<t.total-0.001){toast('Cash received is less than the total.');return}change=r2(tendered-t.total);pay.cash=t.total}
        if(method==='card'){pay.card=t.total;ref=(dlg.querySelector('#cardRef')||{}).value||''}
        if(method==='credit'){if(!c){toast('Choose a customer first.');return}const b=custBal(c);if(+c.limit&&b.bal+t.total>+c.limit&&!isManagerUnlocked()){toast('Over credit limit. Manager PIN needed.');return}pay.credit=t.total}
        if(method==='split'){const a=r2(+dlg.querySelector('#spCash').value||0),b=r2(+dlg.querySelector('#spCard').value||0);if(Math.abs(a+b-t.total)>0.009){dlg.querySelector('#spMsg').textContent=`Cash + card = ${fmt(a+b)}, needs ${fmt(t.total)}.`;dlg.querySelector('#spMsg').style.color='var(--bad)';return}if(a)pay.cash=a;if(b)pay.card=b;tendered=a}
        if(method==='platform'){pay.platform=t.total;ref=(dlg.querySelector('#platRef')||{}).value||''}
        dlg.querySelector('#payGo').disabled=true;
        try{const o=await finalize(pay,tendered,change,ref);closeModal();receiptDialog(o,true);if(S.settings.autoPrint)printText('receipt',receiptText(o),'receipt')}catch(e){fail(e);dlg.querySelector('#payGo').disabled=false}
      }})};
  draw();
}
async function finalize(pay,tendered,change,ref){
  const t=calc(cart);const ts=Date.now();const date=dkey(ts);const tk=cart.ticket&&S.tickets[cart.ticket];
  const o={id:uid('o'),no:nextToken(),ts,date,dev:DEV,type:cart.type,table:cart.table||'',car:cart.car||'',plat:cart.type==='deliv'?cart.plat:'',cust:cart.cust||'',
    lines:cart.lines.map(l=>({i:l.i,n:l.n,p:l.p,q:l.q,m:l.m||[],note:l.note||'',c:l.c||0,cat:l.cat||''})),
    sub:t.sub,disc:t.disc,net:t.net,vat:t.vat,total:t.total,pay,tendered,change,ref,by:cashier||'',status:tk&&tk.status?tk.status:'new',note:cart.note||''};
  const shard=Math.floor(new Date(ts).getHours()/6);
  const path=`orders/${date}_${DEV}_${shard}`;
  await upsert(path,{date,dev:DEV,o:{}},{o:{[o.id]:o}});
  if(o.cust){const patch={};
    if(pay.credit)patch[uid('t')]={t:'credit',amt:pay.credit,ts,ref:o.no,date};
    const stampCats=new Set((S.menu.cats||[]).filter(c=>c.stamps).map(c=>c.id));
    const n=o.lines.filter(l=>stampCats.has(l.cat)&&l.p>0).reduce((s,l)=>s+l.q,0);
    if(n)patch[uid('t')]={t:'stamp',n,ts,ref:o.no};
    const red=o.lines.filter(l=>l.free).length;
    if(Object.keys(patch).length)upsert('cust/'+o.cust,{tx:{}},{tx:patch}).catch(fail)}
  if(cart.ticket)delDoc('tickets/'+cart.ticket).catch(()=>{});
  cart=newCart();saveCart();UI.cartOpen=false;paint();
  return o;
}
function receiptText(o){
  const W=34;const st=S.settings;const L=[];const ctr=s=>{s=String(s);const p=Math.max(0,Math.floor((W-s.length)/2));return ' '.repeat(p)+s};
  const lr=(a,b)=>{a=String(a);b=String(b);const sp=W-a.length-b.length;return sp>=1?a+' '.repeat(sp)+b:a+'\n'+' '.repeat(Math.max(0,W-b.length))+b};
  L.push(ctr(st.name.toUpperCase()));
  st.addr.split(',').reduce((acc,p)=>{const last=acc[acc.length-1];if(last&&(last+','+p).length<=W)acc[acc.length-1]=last+','+p;else acc.push(p.trim());return acc},[]).forEach(x=>L.push(ctr(x.trim())));
  if(st.phone)L.push(ctr('Tel '+st.phone));if(st.trn)L.push(ctr('TRN '+st.trn));
  L.push('');L.push(ctr('TAX INVOICE'));L.push('-'.repeat(W));
  const d=new Date(o.ts);L.push(lr('Token '+o.no,d.toLocaleDateString('en-GB')+' '+tstr(o.ts)));
  L.push(lr(TYPES[o.type]+(o.table?' '+o.table:''),'By '+staffName(o.by)));
  if(o.car)L.push('Car: '+o.car);if(o.cust&&S.cust[o.cust])L.push('Customer: '+S.cust[o.cust].name);
  L.push('-'.repeat(W));
  for(const l of o.lines){L.push(lr(`${l.q} x ${l.n}`.slice(0,W-10),fmt(l.p*l.q)));if(l.m&&l.m.length||l.note)L.push('   '+(l.m||[]).concat(l.note?[l.note]:[]).join(', '))}
  L.push('-'.repeat(W));
  L.push(lr('Subtotal',fmt(o.sub)));if(o.disc)L.push(lr('Discount','-'+fmt(o.disc)));
  L.push(lr('Amount excl. VAT',fmt(o.net)));L.push(lr(`VAT ${st.vat}%`,fmt(o.vat)));
  L.push(lr('TOTAL AED',fmt(o.total)));L.push('');
  for(const k in o.pay)L.push(lr(PAYN[k]||k,fmt(o.pay[k])));
  if(o.pay.cash&&o.tendered>o.total)L.push(lr('Cash given',fmt(o.tendered)),lr('Change',fmt(o.change)));
  if(o.void)L.push('','*** VOID: '+(o.void.reason||'')+' ***');
  L.push('');L.push(ctr(st.footer||''));
  return L.join('\n');
}
function receiptDialog(o,fresh){const c=o.cust&&S.cust[o.cust];const txt=receiptText(o);
  openModal(`<div class="dlg-h"><h2>${fresh?'Paid':'Receipt'}</h2><button class="btn ghost" data-close>Close</button></div>
   <div class="dlg-b">${fresh?`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="lbl">Token number</div><div class="token">${esc(o.no)}</div></div>${o.change?`<div style="text-align:right"><div class="lbl">Change</div><div class="change num" style="color:var(--cardamom)">${fmt(o.change)}</div></div>`:''}</div>`:''}
   <div class="receipt">${esc(txt)}</div>
   <div class="row"><button class="btn pri" data-k="print">Print receipt</button><button class="btn" data-k="copy">Copy</button></div>
   <div class="row" style="flex-wrap:nowrap"><input id="waNo" inputmode="tel" placeholder="Customer mobile, e.g. 050 123 4567" value="${esc((c&&c.phone)||'')}" style="flex:1"><a class="btn grn" id="waGo" target="_blank" rel="noopener" href="${waHref(c&&c.phone,txt)}">WhatsApp</a></div></div>
   <div class="dlg-f">${fresh?'<button class="btn big" data-close style="flex:1">Next order</button>':''}</div>`,dlg=>{
    dlg.querySelector('[data-k=copy]').onclick=()=>copyText(txt);
    dlg.querySelector('[data-k=print]').onclick=()=>printText(`receipt-${o.date}-${o.no}.pdf`,txt,'receipt');
    const wn=dlg.querySelector('#waNo');wn.oninput=()=>{dlg.querySelector('#waGo').href=waHref(wn.value,txt)}});
}
function waHref(phone,text){return phone&&String(phone).replace(/\D/g,'').length>=7?waLink(phone,text):'https://wa.me/?text='+encodeURIComponent(text)}
function ownerWa(text){return waHref(S.settings.ownerWa,text)}
function printText(name,text,size){const pa=$('#printArea');pa.textContent=text;pa.className=size==='receipt'?'receipt':'a4';
  $('#pageStyle').textContent=size==='receipt'?'@page{size:80mm auto;margin:3mm 2mm}':'@page{size:A4;margin:14mm}';
  setTimeout(()=>{try{window.print()}catch(e){toast('Printing is not available on this device.')}},60)}
function waLink(phone,text){let p=String(phone).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='971'+p.slice(1);return 'https://wa.me/'+p+'?text='+encodeURIComponent(text)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){openModal(`<div class="dlg-h"><h2>Copy this text</h2><button class="btn ghost" data-close>Done</button></div><div class="dlg-b"><textarea id="cpy" style="min-height:240px" class="mono">${esc(t)}</textarea></div>`,d=>{const x=d.querySelector('#cpy');x.focus();x.select()})}}
function saveFile(name,data){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(name)?'text/csv':/\.json$/.test(name)?'application/json':'text/plain'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('Saved '+name)}catch(e){toast('Could not save the file.')}}

/* ---------- modal ---------- */
const COARSE=!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
function openModal(html,init,wide){const m=$('#modal');m.innerHTML=`<div class="ov" data-ov><div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const dlg=m.querySelector('.dlg');m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.querySelector('[data-ov]').addEventListener('mousedown',e=>{if(e.target.hasAttribute('data-ov'))closeModal()});
  if(init)init(dlg);const f=dlg.querySelector('input:not([type=checkbox]),textarea,select');if(f&&!COARSE&&!dlg.querySelector('#tend'))setTimeout(()=>f.focus(),30);}
function closeModal(){$('#modal').innerHTML='';if(deferred){deferred=false;paint()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal();
  if(e.key==='/'&&UI.view==='sell'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#modal').innerHTML){e.preventDefault();const q=$('#q');if(q)q.focus()}});
function confirmBox(title,msg,okLabel,fn,danger){openModal(`<div class="dlg-h"><h2>${esc(title)}</h2></div><div class="dlg-b"><p>${msg}</p></div><div class="dlg-f"><button class="btn" data-close>Keep it</button><button class="btn ${danger?'pri':'pri'}" id="okb">${esc(okLabel)}</button></div>`,d=>{d.querySelector('#okb').onclick=async()=>{d.querySelector('#okb').disabled=true;try{await fn();closeModal()}catch(e){fail(e);d.querySelector('#okb').disabled=false}}})}

/* ---------- line editor / pickers ---------- */
function editLine(ix){const l=cart.lines[ix];if(!l)return;let m=(l.m||[]).slice();

/* ---------- aggregation ---------- */
function agg(orders,exps,purs,movs){
  const a={n:0,gross:0,net:0,vat:0,disc:0,cogs:0,comm:0,pay:{},types:{},plats:{},items:{},hours:Array(24).fill(0),days:{},by:{},voids:0,voidAmt:0,expNet:0,expVat:0,expCats:{},cashExp:0,purch:0,purVat:0,waste:0};
  const plat={};(S.settings.platforms||[]).forEach(p=>plat[p.id]=p);
  for(const o of orders){if(o.void){a.voids++;a.voidAmt+=o.total;continue}
    a.n++;a.gross+=o.total;a.net+=o.net;a.vat+=o.vat;a.disc+=o.disc||0;
    for(const k in o.pay)a.pay[k]=(a.pay[k]||0)+o.pay[k];
    a.types[o.type]=(a.types[o.type]||0)+o.total;
    if(o.plat){a.plats[o.plat]=(a.plats[o.plat]||0)+o.total;if(plat[o.plat])a.comm+=o.total*(+plat[o.plat].comm||0)/100}
    a.hours[new Date(o.ts).getHours()]+=o.total;a.days[o.date]=(a.days[o.date]||0)+o.total;
    a.by[o.by||'']=(a.by[o.by||'']||0)+o.total;
    for(const l of o.lines){const k=l.i||l.n;const it=a.items[k]||(a.items[k]={n:l.n,q:0,rev:0,cost:0});it.q+=l.q;it.rev+=l.p*l.q;it.cost+=(l.c||0)*l.q;a.cogs+=(l.c||0)*l.q}}
  for(const e of exps){if(e.del)continue;const amt=+e.amt||0;const v=e.vat?r2(amt*5/105):0;a.expNet+=amt-v;a.expVat+=v;a.expCats[e.cat]=(a.expCats[e.cat]||0)+amt;if(e.drawer)a.cashExp+=amt}
  for(const p of purs||[]){if(p.del)continue;a.purch+=+p.total||0;a.purVat+=+p.vat||0}
  for(const m of movs||[]){if(m.del)continue;if(m.t==='waste')a.waste+=+m.val||0;else if(m.t==='count'&&m.val<0)a.waste+=-m.val}
  a.profit=a.net-a.cogs-a.waste-a.comm-a.expNet;a.avg=a.n?a.gross/a.n:0;return a}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(vals,labels,o){o=o||{};const H=o.h||170,W=640,L=46,R=8,T=10,B=24;const mx=niceMax(Math.max(...vals,0));const n=vals.length;const cw=(W-L-R)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let i=0;i<=2;i++){const v=mx*i/2;const y=T+(H-T-B)*(1-i/2);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt0(v)}</text>`}
  vals.forEach((v,i)=>{const h=(H-T-B)*(v/mx);const x=L+i*cw+cw*.15;s+=`<rect class="bar ${o.hi===i?'hi':''}" x="${x}" y="${T+(H-T-B)-h}" width="${cw*.7}" height="${Math.max(0,h)}" rx="2"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if(n<=14||i%Math.ceil(n/12)===0)s+=`<text x="${x+cw*.35}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return s+'</svg>'}
function hbars(rows,max){max=max||Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="bar-h"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[0])}</span><span class="b"><i style="width:${Math.max(1,r[1]/max*100)}%"></i></span><span class="num">${r[2]||fmt(r[1])}</span></div>`).join('')}

   <div class="kpi"><div class="lbl">Cash in drawer (est.)</div><div class="v">${fmt(drawerExpected(t).expected)}</div><div class="d">float + cash − payouts</div></div>

   <div class="panel"><h2>Best sellers today</h2>${top.length?`<div style="margin-top:10px">${hbars(top.map(i=>[i.n,i.q,fmt0(i.q)+' sold']))}</div>`:'<p class="muted">No sales yet today.</p>'}</div>

function custView(id){const c=S.cust[id];if(!c)return;const b=custBal(c);const tx=Object.values(c.tx||{}).filter(t=>t.t!=='stamp').sort((x,y)=>y.ts-x.ts);

  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Entry</th><th class="r">Amount</th></tr></thead><tbody>${tx.map(t=>`<tr><td class="num">${new Date(t.ts).toLocaleDateString('en-GB')}</td><td>${t.t==='credit'?'Bill '+esc(t.ref||''):t.t==='pay'?'Payment ('+esc(t.method||'cash')+')':t.t==='redeem'?'Free cup':esc(t.ref||'Adjustment')}</td><td class="r" style="color:${t.t==='pay'?'var(--ok)':'inherit'}">${t.t==='redeem'?'—':(t.t==='pay'?'−':'')+fmt(Math.abs(t.amt))}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No account entries yet.</td></tr>'}</tbody></table></div></div>`,d=>{

/* ---------- RAW MATERIALS ---------- */
const supList=()=>Object.entries(S.sup.items||{}).map(([id,v])=>Object.assign({id},v)).filter(s=>!s.del).sort((a,b)=>a.name.localeCompare(b.name));
const purList=()=>Object.values(S.pur).filter(p=>!p.del).sort((a,b)=>b.ts-a.ts);
const movList=()=>Object.values(S.mov).filter(m=>!m.del).sort((a,b)=>b.ts-a.ts);
const poList=()=>Object.values(S.po).filter(p=>!p.del).sort((a,b)=>b.ts-a.ts);
function supName(id){const s=(S.sup.items||{})[id];return s?s.name:'No supplier'}
function invName(id){const v=S.inv.items[id];return v?v.name:'(removed item)'}
function invUnit(id){const v=S.inv.items[id];return v?v.unit:''}
function usagePerDay(days){days=days||14;const from=addDays(today(),-days+1);const c={};let first=today();
  for(const o of Object.values(S.orders)){if(o.void)continue;if(o.date<first)first=o.date;if(o.date<from)continue;
    for(const l of o.lines||[]){const it=S.menu.items[l.i];if(!it||!it.recipe)continue;for(const k in it.recipe)c[k]=(c[k]||0)+(+it.recipe[k]||0)*l.q}}
  const start=first>from?first:from;const span=Math.max(1,Math.round((new Date(today()+'T12:00:00')-new Date(start+'T12:00:00'))/864e5)+1);
  for(const k in c)c[k]=c[k]/span;return c}
function reorderPlan(){const st=stockNow();const u=usagePerDay(14);const cover=+S.settings.cover||7;
  return invItems().map(v=>{const d=u[v.id]||0;const s=st[v.id];let need=d*cover+(+v.min||0)-s;if(stockState(v,s)!=='ok'&&need<=0)need=(+v.min||0)*2-s;return{v,stock:s,perDay:d,daysLeft:d>0?s/d:null,need:need>0?Math.ceil(need*10)/10:0}})}
function priceHistory(id){const h=[];purList().forEach(p=>(p.lines||[]).forEach(l=>{if(l.i===id&&+l.q>0)h.push({date:p.date,ts:p.ts,unit:Math.round(l.amt/l.q*1000)/1000,sup:p.sup,q:l.q,inv:p.inv})}));return h.sort((a,b)=>b.ts-a.ts)}
function priceRises(){const out=[];invItems().forEach(v=>{const h=priceHistory(v.id);if(h.length>=2&&h[1].unit>0){const ch=(h[0].unit-h[1].unit)/h[1].unit;if(ch>=0.1)out.push({v,ch,now:h[0].unit,before:h[1].unit})}});return out}
function expiringBatches(){const t=today();const out=[];purList().forEach(p=>{if(p.date<addDays(t,-60))return;(p.lines||[]).forEach(l=>{if(!l.exp)return;const d=daysUntil(l.exp);if(d!=null&&d<=2&&d>=-3&&stockNow()[l.i]>0)out.push({i:l.i,exp:l.exp,d,sup:p.sup})})});return out}
const payables=()=>purList().filter(p=>!p.paid);

RENDER.stock=function(){
  const tabs=[['levels','Stock levels'],['reorder','Reorder'],['purchases','Purchases'],['suppliers','Suppliers'],['moves','Movements']];
  const t=UI.rmTab||'levels';
  const head=`<div class="topbar"><h1>Raw materials</h1><div class="row"><button class="btn" data-a="fullCount">Stock count</button><button class="btn" data-a="waste">Record wastage</button><button class="btn pri" data-a="newPur">+ Purchase</button></div></div>
   <div class="seg" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${t===k?'on':''}" data-a="rmTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  return head+(RM[t]||RM.levels)();
};
const RM={};
RM.levels=function(){const st=stockNow();const u=usagePerDay(14);const q=UI.stockQ.toLowerCase();const list=invItems().filter(v=>!q||v.name.toLowerCase().includes(q));
  const value=invItems().reduce((s,v)=>s+Math.max(0,st[v.id])*(+v.cost||0),0);const low=invItems().filter(v=>stockState(v,st[v.id])!=='ok');
  const stale=invItems().filter(v=>v.asOf&&dkey(v.asOf)<WIN).length;const owe=payables().reduce((s,p)=>s+p.total,0);
  const wasteM=movList().filter(m=>m.date&&m.date.slice(0,7)===today().slice(0,7)).reduce((s,m)=>s+(m.t==='waste'?m.val:(m.t==='count'&&m.val<0?-m.val:0)),0);
  return `<p class="muted" style="margin:0 0 12px;max-width:72ch">Stock goes down by itself with every sale, using each menu item's recipe. Record supplier deliveries as <b>Purchases</b>, spoiled goods as <b>Wastage</b>, and do a <b>Stock count</b> weekly to keep numbers true.</p>
  ${stale?`<div class="banner">${stale} item(s) were last counted over a month ago. A stock count will correct them.</div>`:''}
  <div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="lbl">Stock value</div><div class="v">${aed(value)}</div><div class="d">at average cost</div></div><div class="kpi"><div class="lbl">Low or out</div><div class="v num" style="color:${low.length?'var(--warn)':'inherit'}">${low.length}</div><div class="d">of ${invItems().length} items</div></div><div class="kpi"><div class="lbl">Owed to suppliers</div><div class="v">${fmt(owe)}</div><div class="d">${payables().length} unpaid bills</div></div><div class="kpi"><div class="lbl">Wastage this month</div><div class="v" style="color:${wasteM?'var(--bad)':'inherit'}">${fmt(wasteM)}</div><div class="d">AED at cost</div></div></div>
  <div class="row" style="margin-bottom:10px"><input data-in="stockQ" id="stockQ" placeholder="Search materials" value="${esc(UI.stockQ)}" style="max-width:340px"><button class="btn" data-a="newInv">+ Material</button></div>
  ${list.length?`<div class="panel tbl-wrap" style="padding:4px 8px"><table><thead><tr><th>Material</th><th class="r">In stock</th><th>Unit</th><th>Status</th><th class="r">Used / day</th><th class="r">Days left</th><th class="r">Cost / unit</th><th class="r">Value</th><th></th></tr></thead><tbody>${list.map(v=>{const s=stockState(v,st[v.id]);const d=u[v.id]||0;const dl=d>0?st[v.id]/d:null;
   return `<tr class="click" data-a="stockCard" data-id="${v.id}"><td><b>${esc(v.name)}</b><div class="small muted">${esc(v.sup?supName(v.sup):(v.supplier||''))}</div></td><td class="r">${fmt(st[v.id])}</td><td>${esc(v.unit)}</td><td><span class="pill p-${s==='ok'?'ok':s==='low'?'warn':'bad'}">${s==='ok'?'OK':s==='low'?'Low':'Out'}</span></td><td class="r">${d?fmt(d):'—'}</td><td class="r" style="color:${dl!=null&&dl<3?'var(--bad)':'inherit'}">${dl==null?'—':dl>99?'99+':Math.floor(dl)}</td><td class="r">${(+v.cost||0).toFixed(3)}</td><td class="r">${fmt(Math.max(0,st[v.id])*(+v.cost||0))}</td><td style="white-space:nowrap"><button class="btn sm" data-a="recv" data-id="${v.id}">Receive</button> <button class="btn sm ghost" data-a="waste" data-id="${v.id}">Waste</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>No raw materials yet</b>Add milk, tea leaves, sugar, cups and the rest, then link them to menu recipes.</div>'}`};
RM.reorder=function(){const plan=reorderPlan().filter(p=>p.need>0);const cover=+S.settings.cover||7;
  const groups={};plan.forEach(p=>{const k=p.v.sup||'';(groups[k]=groups[k]||[]).push(p)});
  const open=poList().filter(p=>p.status==='open');
  return `<p class="muted" style="margin:0 0 12px;max-width:72ch">Suggested quantities cover the next ${cover} days of sales (based on the last 14 days) plus your reorder level. Turn a group into a purchase order and send it to the supplier on WhatsApp.</p>
  ${open.length?`<div class="panel" style="margin-bottom:12px"><h2>Open purchase orders</h2><div class="tbl-wrap"><table><tbody>${open.map(p=>`<tr><td><b>${esc(p.no)}</b></td><td>${esc(supName(p.sup))}</td><td class="small">${esc(p.lines.map(l=>l.q+' '+invUnit(l.i)+' '+invName(l.i)).join(', ')).slice(0,90)}</td><td class="num">${dstr(dkey(p.ts))}</td><td style="white-space:nowrap"><button class="btn sm" data-a="poView" data-id="${p.id}">Send / print</button> <button class="btn sm pri" data-a="poRecv" data-id="${p.id}">Receive</button></td></tr>`).join('')}</tbody></table></div></div>`:''}
  ${plan.length?Object.entries(groups).map(([sid,ps])=>`<div class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><h2>${esc(sid?supName(sid):'No supplier set')}</h2><button class="btn pri sm" data-a="poNew" data-sup="${sid}">Create purchase order</button></div>
   <div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">In stock</th><th class="r">Used / day</th><th class="r">Days left</th><th class="r">Order</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.v.name)}</td><td class="r">${fmt(p.stock)} ${esc(p.v.unit)}</td><td class="r">${p.perDay?fmt(p.perDay):'—'}</td><td class="r">${p.daysLeft==null?'—':Math.floor(p.daysLeft)}</td><td class="r"><b>${fmt(p.need)} ${esc(p.v.unit)}</b></td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="empty"><b>Nothing to reorder</b>Every material covers the next '+cover+' days.</div>'}`};
RM.purchases=function(){const m=today().slice(0,7);const list=purList();const mon=list.filter(p=>p.date.slice(0,7)===m);

  ${list.length?`<div class="panel tbl-wrap" style="padding:4px 8px"><table><thead><tr><th>Date</th><th>Supplier</th><th>Invoice</th><th>Items</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>${list.map(p=>`<tr class="click" data-a="purView" data-id="${p.id}"><td class="num">${new Date(p.ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</td><td>${esc(supName(p.sup))}</td><td class="num">${esc(p.inv||'—')}</td><td class="small">${esc((p.lines||[]).map(l=>invName(l.i)).join(', ')).slice(0,70)}</td><td class="r">${fmt(p.total)}</td><td>${p.paid?`<span class="pill p-ok">Paid ${esc(p.method||'')}</span>`:'<span class="pill p-warn">Unpaid</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No purchases yet</b>Record each supplier delivery here. Stock goes up and the cost per unit updates.</div>'}`};

   ${list.length?`<div class="panel tbl-wrap" style="padding:4px 8px"><table><thead><tr><th>Date</th><th>Material</th><th>What</th><th class="r">Qty</th><th class="r">AED</th></tr></thead><tbody>${list.map(r=>`<tr><td class="num">${new Date(r.ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} ${tstr(r.ts)}</td><td>${esc(invName(r.i))}</td><td class="small">${esc(r.what)}</td><td class="r" style="color:${r.q<0?'var(--bad)':'var(--ok)'}">${r.q>0?'+':''}${fmt(r.q)} ${esc(invUnit(r.i))}</td><td class="r">${fmt(r.val)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No movements yet.</div>'}`};

  <div class="dlg-f">${id?'<button class="btn danger" id="idel">Remove</button>':''}<button class="btn pri" id="isv">Save</button></div>`,d=>{

function stockCard(id){const v=S.inv.items[id];if(!v)return;const st=stockNow()[id];const d=usagePerDay(14)[id]||0;const h=priceHistory(id).slice(0,8);

  <div><h3>Used in</h3><p class="small" style="margin:4px 0 0">${used.length?used.map(i=>esc(i.name)+' ('+i.recipe[id]+' '+esc(v.unit)+')').join(', '):'<span class="muted">No menu recipe uses this yet.</span>'}</p></div>
  ${mv.length?`<div><h3>Recent wastage & counts</h3><table><tbody>${mv.map(m=>`<tr><td class="num">${dstr(m.date)}</td><td>${m.t==='waste'?'Wasted · '+esc(m.reason):'Count'}</td><td class="r">${m.t==='waste'?'−'+fmt(m.q):fmt(m.diff)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`,dd=>{
   dd.querySelector('[data-k=recv]').onclick=()=>purForm({lines:[{i:id}],sup:v.sup});dd.querySelector('[data-k=count]').onclick=()=>countForm(id);dd.querySelector('[data-k=waste]').onclick=()=>wasteForm(id);dd.querySelector('[data-k=edit]').onclick=()=>invForm(id)})}

function purForm(pre){pre=pre||{};let lines=(pre.lines||[{}]).map(l=>({i:l.i||'',q:l.q||'',amt:l.amt||'',exp:l.exp||''}));
  const sups=supList();let sup=pre.sup||'';
  const draw=()=>{const opts=invItems().map(v=>`<option value="${v.id}">${esc(v.name)} (${esc(v.unit)})</option>`).join('');
   openModal(`<div class="dlg-h"><h2>Record purchase</h2><button class="btn ghost" data-close>Cancel</button></div>
   <div class="dlg-b"><div class="fgrid"><label class="field"><span class="lbl">Supplier</span><select id="p_sup"><option value="">— choose —</option>${sups.map(s=>`<option value="${s.id}" ${s.id===sup?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Supplier invoice no.</span><input id="p_inv" value="${esc(pre.inv||'')}" placeholder="e.g. INV-4471"></label>
    <label class="field"><span class="lbl">Date</span><input id="p_date" type="date" value="${today()}"></label></div>
    <div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Qty</th><th>Amount excl. VAT</th><th>Use by</th><th></th></tr></thead><tbody>${lines.map((l,ix)=>`<tr><td style="min-width:160px"><select data-li="${ix}" data-f="i"><option value="">—</option>${opts.replace(`value="${l.i}"`,`value="${l.i}" selected`)}</select></td><td style="min-width:80px"><input data-li="${ix}" data-f="q" type="number" step="any" value="${esc(l.q)}"></td><td style="min-width:100px"><input data-li="${ix}" data-f="amt" type="number" step="0.01" value="${esc(l.amt)}"></td><td style="min-width:130px"><input data-li="${ix}" data-f="exp" type="date" value="${esc(l.exp)}"></td><td><button class="btn sm ghost" data-rmline="${ix}" aria-label="Remove line">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div><button class="btn sm" id="addl">+ Line</button></div>
    <label class="row small"><input type="checkbox" id="p_vat" ${pre.vat===false?'':'checked'}> Tax invoice with ${S.settings.vat}% VAT</label>
    <label class="field"><span class="lbl">Payment</span><select id="p_pay"><option value="credit">On credit — pay supplier later</option><option value="cash">Paid cash from the drawer</option><option value="cashout">Paid cash (owner, not from drawer)</option><option value="card">Paid by card</option><option value="bank">Bank transfer</option></select></label>
    <div class="tl total"><span>Total</span><span id="p_tot">AED 0.00</span></div></div>
   <div class="dlg-f"><button class="btn pri" id="pgo">Save & add to stock</button></div>`,d=>{
    const tot=()=>{const sub=lines.reduce((s,l)=>s+(+l.amt||0),0);const vat=d.querySelector('#p_vat').checked?r2(sub*(+S.settings.vat||0)/100):0;d.querySelector('#p_tot').textContent=aed(sub+vat);return{sub:r2(sub),vat}};
    d.querySelectorAll('[data-li]').forEach(x=>x.oninput=x.onchange=()=>{lines[+x.dataset.li][x.dataset.f]=x.value;tot()});
    d.querySelector('#p_vat').onchange=tot;tot();
    d.querySelector('#p_sup').onchange=e=>{sup=e.target.value};
    d.querySelector('#addl').onclick=()=>{sup=d.querySelector('#p_sup').value;pre.inv=d.querySelector('#p_inv').value;lines.push({i:'',q:'',amt:'',exp:''});draw()};
    d.querySelectorAll('[data-rmline]').forEach(b=>b.onclick=()=>{sup=d.querySelector('#p_sup').value;pre.inv=d.querySelector('#p_inv').value;lines.splice(+b.dataset.rmline,1);if(!lines.length)lines.push({});draw()});
    d.querySelector('#pgo').onclick=async()=>{const ls=lines.filter(l=>l.i&&+l.q>0).map(l=>({i:l.i,q:+l.q,amt:r2(+l.amt||0),exp:l.exp||''}));
      if(!ls.length){toast('Add at least one material with a quantity.');return}
      const {sub,vat}=tot();const pay=d.querySelector('#p_pay').value;const date=d.querySelector('#p_date').value||today();const ts=date===today()?Date.now():new Date(date+'T12:00:00').getTime();
      const rec={id:uid('p'),ts,date,sup:d.querySelector('#p_sup').value,inv:d.querySelector('#p_inv').value.trim(),lines:ls,sub,vat,total:r2(sub+vat),paid:pay!=='credit',method:pay==='credit'?'':pay==='cashout'?'cash':pay,drawer:pay==='cash',payDate:pay==='credit'?'':today(),po:pre.po||'',by:cashier};
      const st=stockNow();const patch={};const add={};ls.forEach(l=>{add[l.i]=add[l.i]||{q:0,amt:0};add[l.i].q+=l.q;add[l.i].amt+=l.amt});
      for(const k in add){const v=S.inv.items[k];const cur=Math.max(0,st[k]||0);const q=add[k].q;const p={qty:r2(cur+q),asOf:Date.now()};
        if(add[k].amt>0)p.cost=Math.round(((cur*(+v.cost||0))+add[k].amt)/(cur+q)*1000)/1000;patch[k]=p}
      d.querySelector('#pgo').disabled=true;
      try{const m=date.slice(0,7);await upsert('pur/'+m,{m,o:{}},{o:{[rec.id]:rec}});await upsert('cfg/inv',{items:{}},{items:patch});
        if(pre.po)await upsert('po/'+pre.po,{},{status:'received',recTs:Date.now()});closeModal();toast('Purchase saved, stock updated')}catch(e){fail(e);d.querySelector('#pgo').disabled=false}}})};
  draw()}

function wholeCount(ids){const st=stockNow();const list=invItems().filter(v=>!ids||ids.includes(v.id));
  openModal(`<div class="dlg-h"><h2>${ids?'Count '+esc(list[0].name):'Stock count'}</h2><button class="btn ghost" data-close>Cancel</button></div>
  <div class="dlg-b"><p class="small muted" style="margin:0">Enter what is actually on the shelf. Leave a box empty to skip that item.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">System</th><th>Counted</th></tr></thead><tbody>${list.map(v=>`<tr><td>${esc(v.name)} <span class="small muted">${esc(v.store||'')}</span></td><td class="r">${fmt(st[v.id])} ${esc(v.unit)}</td><td style="min-width:110px"><input data-cnt="${v.id}" type="number" step="any" ${ids?`value="${st[v.id]}"`:''}></td></tr>`).join('')}</tbody></table></div></div>
  <div class="dlg-f"><button class="btn pri" id="cg">Save count</button></div>`,d=>{d.querySelector('#cg').onclick=async()=>{const ts=Date.now();const m=mkey(ts);const movs={};const patch={};let lost=0;
   d.querySelectorAll('[data-cnt]').forEach(x=>{if(x.value==='')return;const i=x.dataset.cnt;const q=+x.value;const diff=r2(q-st[i]);patch[i]={qty:q,asOf:ts};
     if(Math.abs(diff)>0.0001){const v=S.inv.items[i];const val=r2(diff*(+v.cost||0));if(val<0)lost+=-val;const id=uid('c');movs[id]={id,t:'count',ts,date:dkey(ts),i,diff,val,reason:'Stock count',by:cashier}}});
   if(!Object.keys(patch).length){toast('Nothing entered.');return}
   try{if(Object.keys(movs).length)await upsert('mov/'+m,{m,o:{}},{o:movs});await upsert('cfg/inv',{items:{}},{items:patch});closeModal();toast(lost?`Count saved · shortage ${aed(lost)}`:'Count saved')}catch(e){fail(e)}}})}
