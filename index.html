@media print{body>*:not(#printArea){display:none!important}:root{padding:0}body{background:#fff!important}#printArea{display:block;white-space:pre;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:#000;margin:0}#printArea{border:0!important;border-radius:0!important;background:none!important;padding:0!important;overflow:visible!important;max-width:none!important}#printArea.receipt{font-size:10.5px;line-height:1.35}#printArea.r58{font-size:9px;line-height:1.3;white-space:pre-wrap;word-break:break-all}#printArea.a4{font-size:12.5px;line-height:1.55}#printArea.a4doc{white-space:normal;font-family:Figtree,Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.35}#printArea .sd-h{display:flex;justify-content:space-between;gap:20pt;border-bottom:1.5pt solid #000;padding-bottom:7pt;margin-bottom:10pt}#printArea .sd-n{font-size:16pt;font-weight:800}#printArea .sd-t{text-align:right}#printArea .sd-tt{font-size:12pt;font-weight:800;text-transform:uppercase;letter-spacing:.04em}#printArea .sd-c{margin-bottom:10pt}#printArea .sd-cn{font-size:13pt;font-weight:700}#printArea .lb{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#555}#printArea table{width:100%;border-collapse:collapse}#printArea thead{display:table-header-group}#printArea tr{break-inside:avoid}#printArea th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.05em;border-bottom:1pt solid #000;padding:4pt 5pt}#printArea td{padding:4.5pt 5pt;border-bottom:.5pt solid #bbb;vertical-align:top}#printArea .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}#printArea .tm{color:#666;font-size:8.5pt}#printArea .it{font-size:8.5pt;color:#444;margin-top:1pt}#printArea tr.ob td{font-style:italic;color:#333}#printArea .sd-sum{display:flex;justify-content:flex-end;gap:26pt;margin-top:12pt;text-align:right;break-inside:avoid}#printArea .sd-due{font-size:14pt;font-weight:800}#printArea .sd-f{margin-top:14pt;font-size:8.5pt;color:#444}}
/* Layout: counter-terminal app — nav rail (bottom bar on phones), working area, cart pane on Sell */
:root{
  --bg:#F1EEE9; --surface:#FFFFFF; --surface-2:#E9E4DC; --line:#D9D1C5;
  --fg:#21180F; --muted:#6B5E50;
  --karak:#A4561B; --karak-soft:#F3E3D2; --on-karak:#FFFFFF;
  --cardamom:#2E6A4E; --cardamom-soft:#DDEDE3;
  --saffron:#C98A12;
  --ok:#2E7A4C; --warn:#A86A0C; --bad:#B0281F;
  --ok-soft:#DCEFE2; --warn-soft:#F6E8C8; --bad-soft:#F6DAD6;
  --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 20px rgba(60,40,20,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110D; --surface:#1F1913; --surface-2:#2A221A; --line:#3B3026;
  --fg:#F2E9DE; --muted:#B0A08E;
  --karak:#E0893A; --karak-soft:#3A2717; --on-karak:#1A1007;
  --cardamom:#72B892; --cardamom-soft:#1E3328; --saffron:#EDB540;
  --ok:#6CC08D; --warn:#E6A93D; --bad:#F07B70;
  --ok-soft:#1C3325; --warn-soft:#3A2D12; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110D; --surface:#1F1913; --surface-2:#2A221A; --line:#3B3026;
  --fg:#F2E9DE; --muted:#B0A08E;
  --karak:#E0893A; --karak-soft:#3A2717; --on-karak:#1A1007;
  --cardamom:#72B892; --cardamom-soft:#1E3328; --saffron:#EDB540;
  --ok:#6CC08D; --warn:#E6A93D; --bad:#F07B70;
  --ok-soft:#1C3325; --warn-soft:#3A2D12; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--karak);outline-offset:2px}

.app{display:grid;grid-template-columns:88px 1fr;height:100%}
.rail{background:#21180F;color:#F1EEE9;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:12px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:grid;place-items:center;padding:4px 0 12px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1;color:var(--saffron);text-align:center}
.brand span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:none;border-radius:10px;cursor:pointer;color:inherit;opacity:.72;font-size:.7rem;font-weight:600}
.nav svg{width:22px;height:22px}
.nav:hover{opacity:1;background:rgba(127,127,127,.15)}
.nav.on{opacity:1;background:var(--karak);color:var(--on-karak)}
.nav .lock{font-size:.6rem}
.rail .spacer{flex:1}
.rail .mob-more{display:none}
main{overflow-y:auto;min-width:0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.fill{overflow:hidden;padding-block:12px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mute{background:var(--surface-2);color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:.88rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--karak);color:var(--on-karak);border-color:var(--karak)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.grn{background:var(--cardamom);color:var(--bg);border-color:var(--cardamom)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.82rem}
.btn.big{min-height:56px;font-size:1.1rem;padding:10px 18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--karak)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:.78rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

/* Sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;height:100%}
.menu-side{display:flex;flex-direction:column;min-height:0;gap:10px}
.ordertype{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.cats .chip{flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;overflow-y:auto;padding:2px 2px 8px;align-content:start;min-height:0;flex:1}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 10px;cursor:pointer;min-height:92px;transition:transform .08s}
.tile:hover{border-color:var(--karak)}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:700;line-height:1.2}
.tile .p{margin-top:auto;font-family:var(--f-mono);font-weight:600;color:var(--karak)}
.tile .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.tile .inc{position:absolute;bottom:8px;right:10px;background:var(--karak);color:var(--on-karak);border-radius:999px;font-size:.75rem;font-weight:700;padding:1px 7px;font-family:var(--f-mono)}
.tile .sbrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:2px}.tile .sbrow .sb{margin-top:0}
.tile .lim{font-size:.68rem;line-height:1.2;color:var(--muted)}
.tiles{grid-auto-rows:minmax(min-content,auto)}.tile{height:auto}
.tile .sb{position:static;align-self:flex-start;margin-top:3px;border-radius:999px;font-size:.68rem;font-weight:800;padding:1px 7px;font-family:var(--f-mono);letter-spacing:.02em}
.tile.st-low{border-color:var(--warn);background:linear-gradient(0deg,var(--warn-soft),var(--surface) 70%)}
.tile.st-low .sb{background:var(--warn);color:var(--surface)}
.tile.st-out{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.tile.st-out .n{color:var(--muted)}.tile.st-out .p{color:var(--muted);text-decoration:line-through}
.tile.st-out .sb{background:var(--bad);color:var(--surface)}
.tile.st-sold{border-color:var(--line);border-style:dashed;background:var(--surface-2)}
.tile.st-sold .n,.tile.st-sold .p{color:var(--muted)}.tile.st-sold .sb{background:var(--muted);color:var(--surface)}
.chip.warnchip{border-color:var(--warn);color:var(--warn);font-weight:700}
.chip.warnchip.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.cl .sw{font-size:.74rem;font-weight:700;color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cart-lines{flex:1;overflow-y:auto;padding:4px 0}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px dashed var(--line);cursor:pointer}
.cl:hover{background:var(--surface-2)}
.cl .nm{font-weight:600;line-height:1.25}
.cl .md{font-size:.78rem;color:var(--cardamom)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:30px;height:30px;cursor:pointer;font-weight:700;font-size:1rem}
.qty span{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:600}
.cart-f{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tl{display:flex;justify-content:space-between;font-size:.9rem}
.tl span:last-child{font-family:var(--f-mono)}
.tl.total{font-size:1.35rem;font-weight:800;font-family:var(--f-display);margin-top:2px}
.tl.total span:last-child{font-family:var(--f-display)}
.mbar{display:none}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tables button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:700}
.tables button.busy{background:var(--warn-soft);border-color:var(--warn)}
.tables button.on{background:var(--karak);color:var(--on-karak);border-color:var(--karak)}

/* Kitchen */
.kds{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;overflow-x:auto}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.kcol h3{display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kcard .tk{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.kcard ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.kcard.late{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,12,4,.5);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--bg);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dlg.wide{width:min(860px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:1}
.dlg-h h2{margin-right:auto}
.dlg-b{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.change{font-family:var(--f-display);font-weight:800;font-size:2rem}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:.78rem;white-space:pre;overflow-x:auto;line-height:1.5}
.token{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:1;color:var(--karak)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.denoms label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.bar-h{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:8px;align-items:center;font-size:.86rem;padding:3px 0}
.bar-h .b{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-h .b i{display:block;height:100%;background:var(--karak);border-radius:5px}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--karak)}
svg.chart .bar.hi{fill:var(--saffron)}
svg.chart .ln{fill:none;stroke:var(--cardamom);stroke-width:2.5}
svg.chart .ar2{fill:var(--cardamom-soft)}
svg.chart .pt{fill:var(--cardamom)}
.ai-out{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.92rem}
.morebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.morebox .nav{background:var(--surface);color:var(--fg);opacity:1;border:1px solid var(--line);padding:14px 4px;font-size:.82rem}

@media (max-width:1100px){.sell{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow:visible}
  .rail .brand,.rail .spacer,.rail .nav.x{display:none}
  .rail .mob-more{display:flex}
  .nav{flex:1;padding:6px 0}
  main.fill{overflow:hidden;padding-block:10px 0}
  .sell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:0}
  .cart{position:fixed;left:0;right:0;bottom:0;top:12%;z-index:40;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .mbar{display:flex;gap:10px;align-items:center;padding:8px 0}
  .mbar .btn{flex:1}
  .kds{grid-template-columns:repeat(3,minmax(230px,80vw))}
  h1{font-size:1.35rem}
}
.banner.webalert{background:var(--karak);color:var(--on-karak);white-space:normal;font-size:.9rem}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wcard.isnew{border-color:var(--karak);box-shadow:inset 4px 0 0 var(--karak)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- phone & tablet tuning ---- */
.btn{color:var(--fg)}a.btn{text-decoration:none}
.btn.pri{color:var(--on-karak)}.btn.grn{color:var(--bg)}.btn.danger{color:var(--bad)}

  .seg button{white-space:nowrap;flex:none}
  .seg.otype{display:grid;grid-template-columns:repeat(4,1fr);width:100%}

  .menu-side{min-width:0}
  .menu-side>.row{gap:6px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tile{min-height:80px;padding:9px 9px 8px;border-radius:10px}
  .tile .n{font-size:.86rem}.tile .p{font-size:.86rem}
  .tile .dot{top:8px;right:8px;width:7px;height:7px}
  .qty button{width:38px;height:38px}
  .cl{padding:10px 14px}
  .cart-bd{display:block;position:fixed;inset:0;background:rgba(20,12,4,.45);z-index:39}
  .cart{top:auto;max-height:88%;height:88%}
  .cart-h::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
  .cart-h{position:relative;padding-top:16px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}.kpi .v{font-size:1.15rem}

  .kcol{min-height:0}
  .ov{align-items:end;padding:0}
  .dlg,.dlg.wide{width:100%;max-height:92%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg-h{padding-top:18px}
  .dlg-h::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
  .dlg-f .btn{flex:1}
  .fgrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  .tbl-wrap tr.click:hover td:first-child{background:var(--surface-2)}
  .dlg .tbl-wrap th:first-child,.dlg .tbl-wrap td:first-child{background:var(--bg)}
  td{padding:9px 6px}
  .toast{bottom:calc(138px + env(safe-area-inset-bottom,0px))}
  .denoms{grid-template-columns:repeat(3,1fr)}
  table.bills .hb{display:none}table.bills td:first-child,table.bills th:first-child{position:static}
  .tables{grid-template-columns:repeat(6,1fr)}
  .tables button{padding:10px 2px}
  .tl.total{font-size:1.15rem}
  .receipt{font-size:.72rem;padding:10px}
  .token{font-size:3rem}
  .keys button{padding:13px 4px;font-size:1rem}
  .change{font-size:1.7rem}
  .panel{padding:14px}
  .nav span{font-size:.66rem}
}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.seg.otype button{font-size:.72rem}}
main.fill{display:flex;flex-direction:column}main.fill>.sell{flex:1;min-height:0;height:auto}

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p)=> (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round(((+n)||0)*100+Number.EPSILON*100)/100;
const fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const aed=n=>'AED '+fmt(n);
const pad2=n=>String(n).padStart(2,'0');
const dkey=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const mkey=d=>dkey(d).slice(0,7);
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const tstr=ts=>{const d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const dstr=k=>{const d=new Date(k+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const daysUntil=k=>k?Math.round((new Date(k+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function deepMerge(a,b){for(const k in b){const bv=b[k],av=a[k];if(bv&&typeof bv==='object'&&!Array.isArray(bv)&&av&&typeof av==='object'&&!Array.isArray(av))deepMerge(av,bv);else a[k]=clone({x:bv}).x}return a}

/* ---------- device-local fallback store (same shape as the shared db) ---------- */
function LocalDB(){
  let store=lsGet('wk_localdb',{});const subs=new Set();
  const save=()=>lsSet('wk_localdb',store);
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const snap=p=>{const d=store[p];return{id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const cmp=(a,op,b)=>op==='=='?a===b:op==='!='?a!==b:op==='>='?a>=b:op==='<='?a<=b:op==='>'?a>b:op==='<'?a<b:op==='in'?b.includes(a):false;
  function doc(p){return{id:p.split('/').pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=clone(d);save();notify()},
    update:async d=>{if(!store[p])throw{code:'invalid_argument',message:'missing'};deepMerge(store[p],clone(d));save();notify()},
    delete:async()=>{delete store[p];save();notify()},
    onSnapshot:n=>{const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
    collection:c=>coll(p+'/'+c)}}
  function coll(p,filters){filters=filters||[];const depth=p.split('/').length+1;
    const run=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===depth).sort().map(snap).filter(s=>filters.every(([f,op,v])=>cmp(s.data()[f],op,v)));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    return{path:p,where:(f,op,v)=>coll(p,filters.concat([[f,op,v]])),orderBy:()=>coll(p,filters),limit:()=>coll(p,filters),
      get:async()=>run(),onSnapshot:n=>{const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
      doc:id=>doc(p+'/'+(id||uid())),add:async d=>{const r=doc(p+'/'+uid());await r.set(d);return r}}}
  return{doc,collection:p=>coll(p)};
}

/* ---------- state ---------- */
const DEF_SETTINGS={name:'Wahid Karak Cafe LLC',addr:'Mina Bazar, Al Fahidi, Dubai, UAE',phone:'',trn:'',vat:5,inclusive:true,

  expCats:['Supplies','Rent','DEWA','Salaries','Gas cylinder','Internet & phone','Maintenance','Licence & fees','Other']};
const CAT_COLORS=['var(--karak)','var(--cardamom)','var(--saffron)','#8B5CF6','#0E7490','#BE185D','#65A30D','#B45309'];
const S={ready:false,mode:'connecting',settings:clone(DEF_SETTINGS),menu:{cats:[],items:{}},inv:{items:{}},staff:{items:{}},cust:{},tickets:{},orders:{},exp:{},closes:{},rsDocs:{},sup:{items:{}},pur:{},mov:{},po:{},
  loaded:{}};
let DB=null;
const DEV=lsGet('wk_dev',null)||(()=>{const d='d'+Math.random().toString(36).slice(2,8);lsSet('wk_dev',d);return d})();
const now=new Date();const WIN=dkey(new Date(now.getFullYear(),now.getMonth()-1,1));
let UI={view:'sell',cat:'all',q:'',kTab:'kitchen',hFilter:'',rRange:'today',rFrom:today(),rTo:today(),expMonth:mkey(new Date()),stockQ:'',menuQ:'',custQ:'',cartOpen:false,ai:'',aiBusy:false};
let cart=lsGet('wk_cart',null)||newCart();
let cashier=lsGet('wk_cashier','');
function newCart(){return{lines:[],type:'take',table:'',car:'',plat:'',cust:'',disc:null,note:'',ticket:null}}
function saveCart(){lsSet('wk_cart',cart)}

/* ---------- writes (one at a time per document) ---------- */
const wq={};
function queued(path,fn){const p=(wq[path]||Promise.resolve()).then(fn,fn);wq[path]=p.catch(()=>{});return p}
const RO=()=>Promise.reject({message:'you have view-only access'});
async function upsert(path,base,patch){if(S.mode==='readonly')return RO();return queued(path,async()=>{
  const ref=DB.doc(path);
  if(DB.fb){const b={};for(const k in base)if(base[k]==null||typeof base[k]!=='object')b[k]=base[k];return ref.mergeSet(deepMerge(b,patch))}
  try{await ref.update(patch)}catch(e){
    if(e&&e.code==='invalid_argument'){const s=await ref.get();if(!s.exists){await ref.set(deepMerge(clone(base),patch));return}}
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return ref.update(patch)}
    throw e}})}
function setDoc(path,data){if(S.mode==='readonly')return RO();return queued(path,()=>DB.doc(path).set(data))}
function delDoc(path){if(S.mode==='readonly')return RO();return queued(path,()=>DB.doc(path).delete())}
function fail(e){console.error(e);if(e&&(e.code==='permission-denied'||/insufficient permissions/i.test(e.message||''))){toast("Your account can't change this. Ask the owner or a manager.");return}toast(e&&e.code==='quota_exceeded'?'Storage is full. Export a backup and remove old records.':'Could not save: '+((e&&e.message)||'try again'))}

/* ---------- subscriptions ---------- */
function subscribe(){
  const onErr=e=>{console.warn(e);if(e&&e.code==='revoked'){S.mode='readonly';paint()}};
  DB.doc('cfg/settings').onSnapshot(s=>{S.settings=Object.assign(clone(DEF_SETTINGS),s.data()||{});S.loaded.settings=1;changed()},onErr);
  DB.doc('cfg/menu').onSnapshot(s=>{const d=s.data()||{};S.menu={cats:d.cats||[],items:d.items||{}};S.loaded.menu=1;changed()},onErr);
  if(DB.fb&&S.role){DB.collection('weborders').where('status','in',WEB_ACTIVE).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=Object.assign({id:d.id},d.data()));S.web=m;changed()},onErr);
    DB.doc('pub/ctl').onSnapshot(s=>{S.webPaused=!!(s.data()||{}).paused;changed()},()=>{})}
  DB.doc('cfg/inv').onSnapshot(s=>{const d=s.data()||{};S.inv={items:d.items||{},soldOut:d.soldOut||{}};S.loaded.inv=1;changed()},onErr);
  DB.doc('cfg/staff').onSnapshot(s=>{const d=s.data()||{};S.staff={items:d.items||{},riders:d.riders||[]};changed()},onErr);
  DB.collection('cust').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.cust=m;changed()},onErr);
  DB.collection('tickets').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.tickets=m;changed()},onErr);
  DB.collection('orders').where('date','>=',WIN).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const b=d.data();const o=b.o||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});S.orders=m;S.loaded.orders=1;changed()},onErr);
  DB.collection('exp').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const o=(d.data().o)||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});S.exp=m;changed()},onErr);
  DB.doc('cfg/sup').onSnapshot(s=>{const d=s.data()||{};S.sup={items:d.items||{}};changed()},onErr);
  const flat=(q,f)=>{const m={};q.docs.forEach(d=>{const o=(d.data().o)||{};for(const id in o)m[id]=Object.assign({},o[id],{_doc:d.id})});return m};
  DB.collection('pur').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{S.pur=flat(q);changed()},onErr);
  DB.collection('mov').where('m','>=',WIN.slice(0,7)).onSnapshot(q=>{S.mov=flat(q);changed()},onErr);
  DB.collection('po').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.po=m;changed()},onErr);
  DB.collection('close').where('date','>=',WIN).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.closes=m;changed()},onErr);
  DB.collection('close').where('rs','==',true).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.rsDocs=m;changed()},onErr);
}
let paintPending=false;
function changed(){S.ready=true;try{webTick();syncPub()}catch(e){console.warn(e)}if(paintPending)return;paintPending=true;requestAnimationFrame(()=>{paintPending=false;
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){
    if(['q','hf','custQ','stockQ','menuQ'].includes(a.id)){const id=a.id,pos=a.selectionStart;paint();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}return}
    deferred=true;return}
  paint()})}
let deferred=false;
document.addEventListener('focusout',()=>{if(deferred){deferred=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))paint();else deferred=true},50)}});

/* ---------- derived ---------- */
const menuItems=()=>Object.entries(S.menu.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del).sort((a,b)=>(a.sort||0)-(b.sort||0)||a.name.localeCompare(b.name));
const invItems=()=>Object.entries(S.inv.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del).sort((a,b)=>a.name.localeCompare(b.name));
const staffList=()=>Object.entries(S.staff.items).map(([id,v])=>Object.assign({id},v)).filter(i=>!i.del);
const custList=()=>Object.entries(S.cust).map(([id,v])=>Object.assign({id},v)).filter(c=>!c.del).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const ordersOn=k=>Object.values(S.orders).filter(o=>o.date===k).sort((a,b)=>a.ts-b.ts);
const live=o=>!o.void;
function itemCost(it){if(!it)return 0;const rc=it.recipe||{};const ks=Object.keys(rc);if(!ks.length)return +it.cost||0;let c=0;for(const k of ks){const v=S.inv.items[k];if(v)c+=(+rc[k]||0)*(+v.cost||0)}return r2(c+(+it.pack||0))}
function consumption(){const c={};const inv=S.inv.items;
  for(const o of Object.values(S.orders)){if(o.void)continue;for(const l of o.lines||[]){const it=S.menu.items[l.i];if(!it||!it.recipe)continue;
    for(const k in it.recipe){const v=inv[k];if(!v)continue;if(o.ts>(v.asOf||0))c[k]=(c[k]||0)+(+it.recipe[k]||0)*l.q}}}
  return c}
function stockNow(){const c=consumption();const m={};for(const it of invItems()){m[it.id]=r2((+it.qty||0)-(c[it.id]||0))}return m}
function stockState(it,q){if(q<=0)return'out';if(q<=(+it.min||0))return'low';return'ok'}
function custBal(c){let bal=0,st=0;for(const t of Object.values((c&&c.tx)||{})){if(t.t==='credit')bal+=+t.amt;else if(t.t==='pay')bal-=+t.amt;else if(t.t==='adj')bal+=+t.amt;else if(t.t==='stamp')st+=+t.n;else if(t.t==='redeem')st-=+t.n}return{bal:r2(bal),stamps:st}}
function calc(c){const sub=r2(c.lines.reduce((s,l)=>s+l.p*l.q,0));let disc=0;
  if(c.disc){disc=c.disc.type==='pct'?r2(sub*Math.min(100,+c.disc.v||0)/100):Math.min(sub,r2(+c.disc.v||0))}
  const after=r2(sub-disc);const rate=(+S.settings.vat||0)/100;let total,vat,net;
  if(S.settings.inclusive){total=after;vat=r2(total*rate/(1+rate));net=r2(total-vat)}else{net=after;vat=r2(net*rate);total=r2(net+vat)}
  return{sub,disc,net,vat,total}}
const TYPES={take:'Takeaway',dine:'Dine-in',car:'Car service',deliv:'Delivery'};
const PAYN={cash:'Cash',card:'Card',credit:'Credit (khata)',platform:'Platform'};
function staffName(id){const s=S.staff.items[id];return s?s.name:(id?'—':'Counter')}
function isManagerUnlocked(){if(S.role)return S.role==='owner'||S.role==='manager'||(!!S.settings.managerPin&&ssGet('wk_mgr')==='1');return !S.settings.managerPin||ssGet('wk_mgr')==='1'}
function devCode(){return lsGet('wk_devcode','')}
function nextToken(){const t=today();const dc=devCode();const todays=Object.values(S.orders).filter(o=>o.date===t);let m=0;
  // one running number for the whole shop each day; a till letter (A, B…) keeps its own series
  todays.forEach(o=>{const x=String(o.no||'');if(dc?x.startsWith(dc)&&/^\d+$/.test(x.slice(dc.length)):/^\d+$/.test(x)){const n=+(dc?x.slice(dc.length):x);if(n>m)m=n}});
  return dc+(m+1)}

/* ---------- icons ---------- */
const IC={sell:'<path d="M3 4h2l2.4 11h10.8l2.3-8H6.1"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',

const VIEWS=[['sell','Sell'],['orders','Orders'],['today','Today'],['customers','Customers'],['stock','Materials'],['menu','Menu'],['expenses','Expenses'],['close','Day close'],['reports','Reports'],['staff','Staff'],['setup','Settings']];

/* ---------- shell ---------- */
function paintRail(){

  $('#rail').innerHTML=`<div class="brand"><b>Wahid<br>Karak</b><span>POS</span></div>`+
   VIEWS.filter(([k])=>S.duty!=='delivery'||k==='orders').map(([k,l])=>`<button class="nav ${UI.view===k?'on':''} ${MOBILE_MAIN.includes(k)?'':'x'}" data-a="go" data-v="${k}" aria-label="${l}">${icon(k)}<span>${l}${k==='orders'&&kcount?` (${kcount})`:''}</span></button>`).join('')+
   (S.duty==='delivery'?'':`<button class="nav mob-more" data-a="more" aria-label="More">${icon('more')}<span>More</span></button>`)+`<div class="spacer"></div>${S.user?`<button class="nav ${S.duty==='delivery'?'':'x'}" data-a="signOut" title="${esc(S.user.email||'')}">${icon('staff')}<span>Sign out</span></button>`:''}`;
}
function paint(){
  paintRail();
  const v=$('#view');
  document.querySelector('.app').classList.toggle('solo',S.auth==='out'||S.auth==='pending');
  if(S.auth==='out'){v.className='';v.innerHTML=loginHtml();return}
  if(S.auth==='pending'){v.className='';v.innerHTML=pendingHtml();return}
  if(S.duty==='delivery'&&(UI.view!=='orders'||UI.kTab!=='web')){UI.view='orders';UI.kTab='web'}
  v.className=UI.view==='sell'?'fill':'';
  if(!S.ready){v.innerHTML=`<div class="empty" style="margin-top:20vh"><b>Opening the till…</b>Connecting to your cafe's records.</div>`;return}
  if(LOCKED.has(UI.view)&&!isManagerUnlocked()&&!(S.mode==='readonly'&&RO_OK.has(UI.view))&&!(S.role==='staff'&&STAFF_OK.has(UI.view))){v.innerHTML=lockScreen();return}
  const fn=RENDER[UI.view]||RENDER.sell;v.innerHTML=modeBanner()+fn();
  if(UI.view==='sell')afterSell();
}
function modeBanner(){
  let b='';const wn=S.role&&S.role!=='accountant'&&S.duty!=='delivery'?webNew().length:0;
  if(wn&&!(UI.view==='orders'&&UI.kTab==='web'))b+=`<div class="banner webalert" data-a="goWeb" role="button"><b>${wn===1?'New online order':wn+' new online orders'}.</b> Tap here to see and accept.</div>`;
  if(S.mode==='local')b+=`<div class="banner" data-a="bannerTog" title="Tap to read more"><b>Demo mode.</b> Firebase is not connected yet (fill in firebase-config.js), so everything is saved in this browser only.</div>`;
  if(S.mode==='readonly')b+=`<div class="banner" data-a="bannerTog" title="Tap to read more"><b>Accountant view.</b> You can see sales, VAT, purchases and reports, and print or export them. Nothing can be changed from this account.</div>`;
  if(S.offline)b+=`<div class="banner" data-a="bannerTog" title="Tap to read more" style="background:var(--bad-soft)"><b>No internet.</b> Keep selling: bills are saved on this device and sync when the connection returns.</div>`;

 <form data-f="unlock" class="stack"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn pri">Unlock</button></form></div>`}

/* ---------- SELL ---------- */
const RENDER={};
const LOW_SERV=10;
function itemStock(it,stock,inCartQ){const id=it.id;const so=(S.inv.soldOut||{})[id];if(so===today())return{state:'sold',left:0,lim:null};
  const rc=it.recipe||{};let left=null,lim=null;
  for(const k in rc){const q=+rc[k]||0;const v=S.inv.items[k];if(q<=0||!v||v.del)continue;const n=Math.floor(Math.max(0,stock[k]||0)/q+1e-9);if(left===null||n<left){left=n;lim=k}}
  if(left===null)return{state:'ok',left:null,lim:null};
  left=Math.max(0,left-(inCartQ||0));
  if(left<=0)return{state:'out',left:0,lim};
  const ingLow=Object.keys(rc).some(k=>+rc[k]>0&&S.inv.items[k]&&!S.inv.items[k].del&&stockState(S.inv.items[k],stock[k])!=='ok');
  if(left<=LOW_SERV||ingLow)return{state:'low',left,lim};
  return{state:'ok',left,lim}}
function setSoldOut(id,on){return upsert('cfg/inv',{items:{}},{soldOut:{[id]:on?today():''}}).then(()=>toast(on?'Marked sold out for today':'Back on sale'),fail)}
function stockWarn(id,proceed){const it=Object.assign({id},S.menu.items[id]);const st=stockNow();const inC=cart.lines.filter(l=>l.i===id).reduce((a,l)=>a+l.q,0);const x=itemStock(it,st,inC);
  if(x.state!=='out'&&x.state!=='sold'){proceed();const after=itemStock(it,st,inC+1);if(after.left!==null&&after.left<=3)toast(after.left?`Only ${after.left} more ${it.name} can be made`:`That was the last ${it.name}`);return}
  const v=x.lim&&S.inv.items[x.lim];
  openModal(`<div class="dlg-h"><h2>${x.state==='sold'?'Sold out today':'Out of stock'}</h2><button class="btn ghost" data-close>Cancel</button></div>
   <div class="dlg-b"><div class="banner" style="background:var(--${x.state==='sold'?'surface-2':'bad-soft'});cursor:default;white-space:normal"><b>${esc(it.name)}</b> ${x.state==='sold'?'was marked sold out for today.':`can't be made: ${esc(v?v.name:'an ingredient')} shows ${fmt(Math.max(0,st[x.lim]||0))} ${esc(v?v.unit:'')} left.`}</div>
   <p class="small muted" style="margin:0">${x.state==='sold'?'Put it back on sale if you have it again.':'If the stock is really there, a delivery was probably not recorded. You can still sell it.'}</p></div>
   <div class="dlg-f">${x.state==='sold'?'<button class="btn" id="swBack">Back on sale</button>':(v?'<button class="btn" id="swRecv">Record delivery</button>':'')}<button class="btn pri" id="swGo">Sell anyway</button></div>`,d=>{
    d.querySelector('#swGo').onclick=()=>{closeModal();proceed()};
    const bk=d.querySelector('#swBack');if(bk)bk.onclick=()=>{closeModal();setSoldOut(id,false)};
    const rv=d.querySelector('#swRecv');if(rv)rv.onclick=()=>{closeModal();purForm({lines:[{i:x.lim}],sup:v.sup})}})}
RENDER.sell=function(){
  const items=menuItems().filter(i=>i.active!==false);
  const stock=stockNow();
  const cats=S.menu.cats||[];
  const q=UI.q.trim().toLowerCase();
  if(!items.length)return `<div class="empty" style="margin-top:10vh"><b>No menu items yet</b>Add your karak, snacks and juices in <a href="#menu">Menu</a>, then come back to ring sales.</div>`;
  const inCart={};cart.lines.forEach(l=>inCart[l.i]=(inCart[l.i]||0)+l.q);
  const stx={};items.forEach(i=>stx[i.id]=itemStock(i,stock,inCart[i.id]||0));
  const nLow=items.filter(i=>stx[i.id].state==='low').length,nOut=items.filter(i=>stx[i.id].state==='out'||stx[i.id].state==='sold').length;
  if(UI.cat==='low'&&!nLow&&!nOut)UI.cat='all';
  const shown=items.filter(i=>(UI.cat==='all'||(UI.cat==='fav'?i.fav:UI.cat==='low'?stx[i.id].state!=='ok':i.cat===UI.cat))&&(!q||i.name.toLowerCase().includes(q)||(i.code||'').toLowerCase()===q));
  const tiles=shown.map(i=>{const ci=cats.findIndex(c=>c.id===i.cat);const x=stx[i.id];const lv=x.lim&&S.inv.items[x.lim];
    const badge=x.state==='low'?`<span class="sb">${x.left} left</span>`:x.state==='out'?'<span class="sb">Out</span>':x.state==='sold'?'<span class="sb">Sold out</span>':'';
    const tip=x.state==='low'?`About ${x.left} more can be made${lv?' ('+lv.name+' is low)':''}`:x.state==='out'?`${lv?lv.name:'An ingredient'} has run out`:x.state==='sold'?'Marked sold out for today':'';
    return `<button class="tile ${x.state!=='ok'?'st-'+x.state:''}" data-a="add" data-id="${i.id}" title="${esc(tip)}" aria-label="${esc(i.name+' '+fmt(i.price)+(tip?'. '+tip:''))}"><span class="dot" style="background:${CAT_COLORS[(ci<0?0:ci)%CAT_COLORS.length]}"></span><span class="n">${esc(i.name)}</span>${badge?`<span class="sbrow">${badge}${(x.state==='low'||x.state==='out')&&lv?`<span class="lim">${x.state==='out'?'No ':''}${esc(lv.name)}${x.state==='low'?' '+fmt(Math.max(0,stock[x.lim]||0))+' '+esc(lv.unit||''):''}</span>`:''}</span>`:''}<span class="p">${fmt(i.price)}</span>${inCart[i.id]?`<span class="inc">×${inCart[i.id]}</span>`:''}</button>`}).join('');
  const nT=Object.keys(S.tickets).length;
  return `<div class="sell">
   <section class="menu-side">
    <div class="row" style="justify-content:space-between">
      <div class="seg otype" role="tablist" aria-label="Order type">${Object.entries(TYPES).map(([k,l])=>`<button class="${cart.type===k?'on':''}" data-a="otype" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="row"><button class="chip" data-a="tickets">Open orders <b class="num">${nT}</b></button><button class="chip" data-a="pickCashier">${icon('staff').replace('<svg','<svg width="16" height="16"')} ${esc(cashier?staffName(cashier):'Choose cashier')}</button></div>
    </div>
    ${typeExtra()}
    <div class="row" style="flex-wrap:nowrap"><input id="q" type="search" placeholder="Search menu or item code" value="${esc(UI.q)}" autocomplete="off" style="flex:1"></div>
    <div class="cats"><button class="chip ${UI.cat==='all'?'on':''}" data-a="cat" data-v="all">All</button>${nLow||nOut?`<button class="chip warnchip ${UI.cat==='low'?'on':''}" data-a="cat" data-v="low" title="Items that are low or out of stock">⚠ ${[nOut?nOut+' out':'',nLow?nLow+' low':''].filter(Boolean).join(' · ')}</button>`:''}${items.some(i=>i.fav)?`<button class="chip ${UI.cat==='fav'?'on':''}" data-a="cat" data-v="fav">★ Quick</button>`:''}${cats.map(c=>`<button class="chip ${UI.cat===c.id?'on':''}" data-a="cat" data-v="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    ${UI.cat==='low'?`<div class="legend"><span><i style="background:var(--warn)"></i>Low: a few left</span><span><i style="background:var(--bad)"></i>Out of stock</span><span><i style="background:var(--muted)"></i>Sold out today</span><a href="#stock" style="margin-left:auto;color:var(--karak);font-weight:600">Open materials</a></div>`:''}
    <div class="tiles" id="tiles">${tiles||'<div class="empty">Nothing matches that search.</div>'}</div>
    <div class="mbar"><button class="btn pri big" data-a="openCart">${cart.lines.reduce((s,l)=>s+l.q,0)} items · ${aed(calc(cart).total)}</button></div>
   </section>
   ${UI.cartOpen?'<div class="cart-bd" data-a="closeCart"></div>':''}<aside class="cart ${UI.cartOpen?'open':''}" id="cartPane">${cartHtml()}</aside>
  </div>`;
};
function typeExtra(){
  if(cart.type==='dine'){const busy={};Object.values(S.tickets).forEach(t=>{if(t.table)busy[t.table]=t});
    let b='';for(let i=1;i<=(+S.settings.tables||0);i++){const k='T'+i;b+=`<button class="${cart.table===k?'on':busy[k]?'busy':''}" data-a="table" data-v="${k}" title="${busy[k]?'Open bill '+aed(calc(busy[k]).total):'Free'}">${k}</button>`}

    <div class="row" style="flex-wrap:nowrap"><input id="dAddr" placeholder="Delivery address" value="${esc(cart.addr!=null?cart.addr:((S.cust[cart.cust]||{}).address||''))}" style="flex:2;min-width:0"><input id="dPhone" inputmode="tel" placeholder="Customer phone" value="${esc(cart.phone!=null?cart.phone:((S.cust[cart.cust]||{}).phone||''))}" style="flex:1;min-width:0"></div>`:''}`;

}
function cartHtml(){
  const t=calc(cart);const c=cart.cust&&S.cust[cart.cust];
  const lines=cart.lines.map((l,ix)=>`<div class="cl" data-a="editLine" data-ix="${ix}"><div><div class="nm">${esc(l.n)}</div>${(()=>{const it=S.menu.items[l.i];if(!it||l.free)return'';const tot=cart.lines.filter(z=>z.i===l.i).reduce((a,z)=>a+z.q,0);const x=itemStock(Object.assign({id:l.i},it),stockNow(),0);return x.state==='sold'?'<div class="sw">⚠ Marked sold out today</div>':x.left!==null&&tot>x.left?`<div class="sw">⚠ ${x.left?`Stock is enough for only ${x.left}`:'Out of stock'}</div>`:''})()}${(l.m&&l.m.length)||l.note?`<div class="md">${esc((l.m||[]).concat(l.note?[l.note]:[]).join(' · '))}</div>`:''}<div class="small muted num">${fmt(l.p)} each</div></div>
    <div class="qty"><button data-a="q-" data-ix="${ix}" aria-label="Less">−</button><span>${l.q}</span><button data-a="q+" data-ix="${ix}" aria-label="More">+</button></div>
    <div class="num" style="min-width:58px;text-align:right;font-weight:600">${fmt(l.p*l.q)}</div></div>`).join('');
  let st='';if(c){const b=custBal(c);const ev=+S.settings.stampEvery||0;st=`<span class="pill p-ok">${b.stamps} stamps</span>${b.bal>0?`<span class="pill p-warn">owes ${fmt(b.bal)}</span>`:''}${ev&&b.stamps>=ev?`<button class="btn sm grn" data-a="redeem">Give free karak</button>`:''}`}
  return `<div class="cart-h"><h2 style="margin-right:auto">${cart.ticket?'Open bill':'New order'} <span class="muted small num">#${esc(nextToken())}</span></h2>
     <button class="btn sm ghost" data-a="closeCart" aria-label="Close cart" style="${UI.cartOpen?'':'display:none'}">Close</button>

   <div class="cart-lines">${lines||`<div class="empty" style="margin:14px">Tap an item to start the order.<br><span class="small">Tip: tap a line to add sugar level or a note.</span></div>`}</div>
   <div class="cart-f">
    <div class="tl"><span class="muted">Subtotal</span><span>${fmt(t.sub)}</span></div>
    ${t.disc?`<div class="tl"><span class="muted">Discount ${cart.disc.type==='pct'?cart.disc.v+'%':''}</span><span>−${fmt(t.disc)}</span></div>`:''}
    <div class="tl"><span class="muted">VAT ${S.settings.vat}% ${S.settings.inclusive?'(included)':''}</span><span>${fmt(t.vat)}</span></div>
    <div class="tl total"><span>Total</span><span>${aed(t.total)}</span></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-a="disc" ${cart.lines.length?'':'disabled'}>Discount</button><button class="btn sm" data-a="hold" ${cart.lines.length?'':'disabled'}>${cart.type==='dine'?'Save to table':'Hold'}</button><button class="btn sm" data-a="kitchenSend" ${cart.lines.length?'':'disabled'} title="Send to kitchen before payment">Kitchen</button><button class="btn sm ghost danger" data-a="clear" ${cart.lines.length||cart.ticket?'':'disabled'}>Clear</button></div>
    ${cart.type==='deliv'&&cart.plat==='own'&&DB&&DB.fb&&S.mode!=='readonly'?`<button class="btn grn big" data-a="codSend" ${cart.lines.length?'':'disabled'}>${cart.rider?'Send with '+esc(cart.rider):'Send out'} · collect on delivery</button>`:''}
    <button class="btn ${cart.type==='deliv'&&cart.plat==='own'&&DB&&DB.fb?'':'pri'} big" data-a="pay" ${cart.lines.length&&S.mode!=='readonly'?'':'disabled'}>${cart.type==='deliv'&&cart.plat==='own'&&DB&&DB.fb?'Already paid · charge now':'Charge'} ${aed(t.total)}</button>

function afterSell(){const q=$('#q');if(q){q.oninput=()=>{UI.q=q.value;const pos=q.selectionStart;paint();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  q.onkeydown=e=>{if(e.key==='Enter'){const f=$('#tiles .tile');if(f){f.click();UI.q='';paint();$('#q').focus()}}}}
  const da=$('#dAddr');if(da)da.onchange=()=>{cart.addr=da.value;saveCart()};const dp=$('#dPhone');if(dp)dp.onchange=()=>{cart.phone=dp.value;saveCart()};
  const ci=$('#carIn');if(ci)ci.onchange=()=>{cart.car=ci.value;saveCart()};}
function repaintCart(){const p=$('#cartPane');if(p&&UI.view==='sell'){paint()}}
function addItem(id,opts){const it=S.menu.items[id];if(!it)return;try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}opts=opts||{};
  const m=opts.m||[];const ex=cart.lines.find(l=>l.i===id&&!l.note&&JSON.stringify(l.m||[])===JSON.stringify(m)&&l.p===(opts.p!=null?opts.p:+it.price));

/* ---------- payment ---------- */
function payDialog(){
  const t=calc(cart);const c=cart.cust&&S.cust[cart.cust];
  const plat=cart.type==='deliv'&&cart.plat&&cart.plat!=='own';
  const methods=plat?['platform','cash','card']:['cash','card','credit','split'];
  const wtk=cart.ticket&&S.tickets[cart.ticket];let method=plat?'platform':(wtk&&wtk.webPay==='khata'&&cart.cust?'credit':wtk&&wtk.webPay==='card'?'card':'cash');let tend='';
  const draw=()=>{
    const tendN=+tend||0;const change=r2(tendN-t.total);
    let body='';
    if(method==='cash')body=`<div class="field"><span class="lbl">Cash received</span><input id="tend" class="num" inputmode="decimal" value="${esc(tend)}" placeholder="${fmt(t.total)}" style="font-size:1.3rem"></div>
      <div class="keys">${['exact',5,10,20,50,100,200,500].map(v=>`<button data-k="${v}">${v==='exact'?'Exact':v}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="lbl">Change to give</span><span class="change num" style="color:${tend&&change<0?'var(--bad)':'var(--cardamom)'}">${tend?(change<0?'Short '+fmt(-change):fmt(change)):'0.00'}</span></div>`;

function agg(orders,exps,purs,movs){
  const a={n:0,gross:0,net:0,vat:0,disc:0,cogs:0,comm:0,pay:{},types:{},plats:{},items:{},hours:Array(24).fill(0),days:{},by:{},voids:0,voidAmt:0,expNet:0,expVat:0,expCats:{},cashExp:0,purch:0,purVat:0,waste:0};
  const plat={};(S.settings.platforms||[]).forEach(p=>plat[p.id]=p);
  for(const o of orders){if(o.void){a.voids++;a.voidAmt+=o.total;continue}
    a.n++;a.gross+=o.total;a.net+=o.net;a.vat+=o.vat;a.disc+=o.disc||0;
    for(const k in o.pay)a.pay[k]=(a.pay[k]||0)+o.pay[k];
    a.types[o.type]=(a.types[o.type]||0)+o.total;
    if(o.plat){a.plats[o.plat]=(a.plats[o.plat]||0)+o.total;if(plat[o.plat])a.comm+=o.total*(+plat[o.plat].comm||0)/100}
    a.hours[new Date(o.ts).getHours()]+=o.total;a.days[o.date]=(a.days[o.date]||0)+o.total;
    a.by[o.by||'']=(a.by[o.by||'']||0)+o.total;
    for(const l of o.lines){const k=l.i||l.n;const it=a.items[k]||(a.items[k]={n:l.n,q:0,rev:0,cost:0});it.q+=l.q;it.rev+=l.p*l.q;it.cost+=(l.c||0)*l.q;a.cogs+=(l.c||0)*l.q}}
  for(const e of exps){if(e.del)continue;const amt=+e.amt||0;const v=e.vat?r2(amt*5/105):0;a.expNet+=amt-v;a.expVat+=v;a.expCats[e.cat]=(a.expCats[e.cat]||0)+amt;if(e.drawer)a.cashExp+=amt}
  for(const p of purs||[]){if(p.del)continue;a.purch+=+p.total||0;a.purVat+=+p.vat||0}
  for(const m of movs||[]){if(m.del)continue;if(m.t==='waste')a.waste+=+m.val||0;else if(m.t==='count'&&m.val<0)a.waste+=-m.val}
  a.profit=a.net-a.cogs-a.waste-a.comm-a.expNet;a.avg=a.n?a.gross/a.n:0;return a}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(vals,labels,o){o=o||{};const H=o.h||170,W=640,L=46,R=8,T=10,B=24;const mx=niceMax(Math.max(...vals,0));const n=vals.length;const cw=(W-L-R)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let i=0;i<=2;i++){const v=mx*i/2;const y=T+(H-T-B)*(1-i/2);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt0(v)}</text>`}
  vals.forEach((v,i)=>{const h=(H-T-B)*(v/mx);const x=L+i*cw+cw*.15;s+=`<rect class="bar ${o.hi===i?'hi':''}" x="${x}" y="${T+(H-T-B)-h}" width="${cw*.7}" height="${Math.max(0,h)}" rx="2"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if(n<=14||i%Math.ceil(n/12)===0)s+=`<text x="${x+cw*.35}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return s+'</svg>'}
function hbars(rows,max){max=max||Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="bar-h"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[0])}</span><span class="b"><i style="width:${Math.max(1,r[1]/max*100)}%"></i></span><span class="num">${r[2]||fmt(r[1])}</span></div>`).join('')}

function stmtRange(k){const t=today();const d=new Date(t+'T12:00:00');const first=(y,m)=>dkey(new Date(y,m,1));
  if(k==='month')return[first(d.getFullYear(),d.getMonth()),t];
  if(k==='last')return[first(d.getFullYear(),d.getMonth()-1),dkey(new Date(d.getFullYear(),d.getMonth(),0))];
  if(k==='3m')return[first(d.getFullYear(),d.getMonth()-2),t];
  return['0000-00-00',t]}
function statementData(id,k){const c=S.cust[id];const [from,to]=stmtRange(k);
  const ent=Object.values((c&&c.tx)||{}).filter(t=>t.t==='credit'||t.t==='pay'||t.t==='adj').sort((a,b)=>a.ts-b.ts);
  const sign=t=>t.t==='pay'?-(+t.amt||0):(+t.amt||0);
  let open=0;const rows=[];let bill=0,paid=0;
  for(const t of ent){const dk=dkey(t.ts);if(dk<from){open+=sign(t);continue}if(dk>to)continue;
    const v=sign(t);let det,items='';
    if(t.t==='credit'){det='Bill '+(t.ref||'');const o=Object.values(S.orders).find(o=>o.cust===id&&String(o.no)===String(t.ref)&&Math.abs(o.ts-t.ts)<10*60000);
      if(o)items=o.lines.map(l=>l.q+'× '+l.n).join(', ')+(o.void?' (voided)':'')}
    else if(t.t==='pay')det='Payment received'+(t.method?' · '+({cash:'cash',card:'card',transfer:'bank transfer'}[t.method]||t.method):'');
    else det=t.ref||'Adjustment';
    if(v>=0)bill+=v;else paid+=-v;rows.push({ts:t.ts,det,items,bill:v>=0?v:0,paid:v<0?-v:0})}
  let bal=open;rows.forEach(r=>{bal=r2(bal+r.bill-r.paid);r.bal=bal});
  return{c,id,k,from,to,open:r2(open),rows,bill:r2(bill),paid:r2(paid),close:r2(bal)}}
const STMT_K=[['month','This month'],['last','Last month'],['3m','Last 3 months'],['all','Everything']];
function stmtPeriodLabel(D){return D.k==='all'?'All entries up to '+dstr(D.to):dstr(D.from)+' to '+dstr(D.to)}
function statementRollText(D){const W=paperW();const st=S.settings,c=D.c;const ctr=x=>{x=String(x);return ' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x};
  const lr=(a,b)=>{a=String(a);b=String(b);const sp=W-a.length-b.length;return sp>=1?a+' '.repeat(sp)+b:a.slice(0,Math.max(1,W-b.length-1))+' '+b};
  const L=[ctr(st.name.toUpperCase()),...wrapW(st.addr,W).split('\n').map(ctr)];if(st.phone)L.push(ctr('Tel '+st.phone));if(st.trn)L.push(ctr('TRN '+st.trn));
  L.push('',ctr('STATEMENT OF ACCOUNT'),'-'.repeat(W),...wrapW('Customer: '+c.name,W).split('\n'));if(c.phone)L.push('Phone: '+c.phone);
  L.push(...wrapW('Period: '+stmtPeriodLabel(D),W).split('\n'),'Printed: '+new Date().toLocaleDateString('en-GB')+' '+tstr(Date.now()),'-'.repeat(W),lr('Opening balance',fmt(D.open)),'-'.repeat(W));
  D.rows.forEach(r=>{const d=new Date(r.ts);const dd=pad2(d.getDate())+'/'+pad2(d.getMonth()+1);const det=r.det.replace(/Payment received · /,'Paid ').replace('Payment received','Paid');
    L.push(lr(dd+' '+det,(r.bill?'+':'-')+fmt(r.bill||r.paid)));if(r.items)L.push('  '+(r.items.replace(/×/g,'x').length>W-2?r.items.replace(/×/g,'x').slice(0,W-5)+'...':r.items.replace(/×/g,'x')));L.push(lr('','Balance '+fmt(r.bal)))});
  if(!D.rows.length)L.push(ctr('No bills or payments'));
  L.push('-'.repeat(W),lr('Bills',fmt(D.bill)),lr('Paid',fmt(D.paid)),'='.repeat(W),lr('BALANCE DUE AED',fmt(D.close)),'=' .repeat(W),'',...wrapW('Please check and tell us within 7 days if anything is not right. Thank you!',W).split('\n'));
  return L.join('\n')}

async function webAccept(id){const w=S.web[id];if(!w)return;

  const note=[w.type==='delivery'&&w.address?'Deliver to: '+w.address:'',w.note?'Customer note: '+w.note:'','Pay: '+(WPAY[w.pay]||w.pay||'cash')].filter(Boolean).join(' · ').slice(0,400);

const supList=()=>Object.entries(S.sup.items||{}).map(([id,v])=>Object.assign({id},v)).filter(s=>!s.del).sort((a,b)=>a.name.localeCompare(b.name));
const purList=()=>Object.values(S.pur).filter(p=>!p.del).sort((a,b)=>b.ts-a.ts);
const movList=()=>Object.values(S.mov).filter(m=>!m.del).sort((a,b)=>b.ts-a.ts);

function supName(id){const s=(S.sup.items||{})[id];return s?s.name:'No supplier'}
function invName(id){const v=S.inv.items[id];return v?v.name:'(removed item)'}
function invUnit(id){const v=S.inv.items[id];return v?v.unit:''}
function usagePerDay(days){days=days||14;const from=addDays(today(),-days+1);const c={};let first=today();
  for(const o of Object.values(S.orders)){if(o.void)continue;if(o.date<first)first=o.date;if(o.date<from)continue;
    for(const l of o.lines||[]){const it=S.menu.items[l.i];if(!it||!it.recipe)continue;for(const k in it.recipe)c[k]=(c[k]||0)+(+it.recipe[k]||0)*l.q}}
  const start=first>from?first:from;const span=Math.max(1,Math.round((new Date(today()+'T12:00:00')-new Date(start+'T12:00:00'))/864e5)+1);
  for(const k in c)c[k]=c[k]/span;return c}
function reorderPlan(){const st=stockNow();const u=usagePerDay(14);const cover=+S.settings.cover||7;
  return invItems().map(v=>{const d=u[v.id]||0;const s=st[v.id];let need=d*cover+(+v.min||0)-s;if(stockState(v,s)!=='ok'&&need<=0)need=(+v.min||0)*2-s;return{v,stock:s,perDay:d,daysLeft:d>0?s/d:null,need:need>0?Math.ceil(need*10)/10:0}})}
function priceHistory(id){const h=[];purList().forEach(p=>(p.lines||[]).forEach(l=>{if(l.i===id&&+l.q>0)h.push({date:p.date,ts:p.ts,unit:Math.round(l.amt/l.q*1000)/1000,sup:p.sup,q:l.q,inv:p.inv})}));return h.sort((a,b)=>b.ts-a.ts)}
function priceRises(){const out=[];invItems().forEach(v=>{const h=priceHistory(v.id);if(h.length>=2&&h[1].unit>0){const ch=(h[0].unit-h[1].unit)/h[1].unit;if(ch>=0.1)out.push({v,ch,now:h[0].unit,before:h[1].unit})}});return out}
function expiringBatches(){const t=today();const out=[];purList().forEach(p=>{if(p.date<addDays(t,-60))return;(p.lines||[]).forEach(l=>{if(!l.exp)return;const d=daysUntil(l.exp);if(d!=null&&d<=2&&d>=-3&&stockNow()[l.i]>0)out.push({i:l.i,exp:l.exp,d,sup:p.sup})})});return out}

function lastPriceFor(id,q,amt){const v=id&&S.inv.items[id];if(!v)return{ph:'',html:''};const u=esc(v.unit||'');
  const h=priceHistory(id);const last=h[0];const qn=+q||0;
  let unit,html;
  if(last){unit=last.unit;html=`Last bought ${dstr(last.date)} from ${esc(supName(last.sup))}: <b class="num">AED ${fmt(unit)}</b> per ${u}`+(h[1]?` <span class="muted">(before: ${fmt(h[1].unit)})</span>`:'')}
  else if(+v.cost>0){unit=+v.cost;html=`<span class="muted">No purchase recorded yet. Average cost: AED ${fmt(unit)} per ${u}</span>`}
  else return{ph:'',html:'<span class="muted">No price history for this material yet.</span>'};
  const ph=qn>0?fmt(unit*qn).replace(/,/g,''):'';
  if(qn>0&&+amt>0&&unit>0){const now=+amt/qn;const ch=(now-unit)/unit;
    if(Math.abs(ch)>=0.005)html+=` · now <b class="num">${fmt(now)}</b> per ${u} <span class="pill ${ch>0?'p-bad':'p-ok'}">${ch>0?'▲ up':'▼ down'} ${Math.abs(Math.round(ch*100))}%</span>`;
    else html+=' · <span class="pill p-mute">same price</span>'}
  else if(qn>0)html+=` · expected about <b class="num">AED ${fmt(unit*qn)}</b> for ${fmt(qn)} ${u}`;
  return{ph,html}}

/* ---------- DAY CLOSE ---------- */
const DENOMS=[1000,500,200,100,50,20,10,5,1,0.5,0.25];
function drawerExpected(k){const cl=S.closes[k]||{};const os=ordersOn(k).filter(live);
  const cashSales=os.reduce((s,o)=>s+(o.pay.cash||0),0);
  let khata=0;custList().forEach(c=>Object.values(c.tx||{}).forEach(t=>{if(t.t==='pay'&&t.method==='cash'&&t.date===k)khata+=+t.amt}));
  const exp=Object.values(S.exp).filter(e=>!e.del&&e.date===k&&e.drawer).reduce((s,e)=>s+(+e.amt||0),0);
  const sup=purList().filter(p=>p.drawer&&p.payDate===k).reduce((s,p)=>s+(+p.total||0),0);
  let rshort=0;Object.values(cl.hand||{}).forEach(x=>{const kd=x.kind||'hand';if(kd==='hand')rshort+=+x.diff||0;else if(kd==='repay')rshort+=+x.got||0});
  const fl=+cl.float||0;return{float:fl,cashSales:r2(cashSales),khata:r2(khata),exp:r2(exp),sup:r2(sup),rshort:r2(rshort),expected:r2(fl+cashSales+khata-exp-sup+rshort)}}
RENDER.close=function(){const k=today();const cl=S.closes[k]||{};const e=drawerExpected(k);const a=agg(ordersOn(k),Object.values(S.exp).filter(x=>x.date===k));
  const past=Object.values(S.closes).filter(c=>c.closed).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,10);
  return `<div class="topbar"><h1>Day close</h1><span class="muted">${dstr(k)}</span></div>
  <div class="grid2"><div class="panel stack">
   <h2>Cash drawer</h2>
   <div class="row" style="flex-wrap:nowrap"><label class="field" style="flex:1"><span class="lbl">Opening float (AED)</span><input id="fl" type="number" step="0.25" value="${esc(cl.float!=null?cl.float:'')}" placeholder="Cash in the drawer at opening"></label><button class="btn" data-a="saveFloat" style="align-self:flex-end">Save float</button></div>
   <div class="tl"><span>Opening float</span><span>${fmt(e.float)}</span></div><div class="tl"><span>+ Cash sales</span><span>${fmt(e.cashSales)}</span></div><div class="tl"><span>+ Khata paid in cash</span><span>${fmt(e.khata)}</span></div><div class="tl"><span>− Expenses paid from drawer</span><span>${fmt(e.exp)}</span></div><div class="tl"><span>− Supplier bills paid from drawer</span><span>${fmt(e.sup)}</span></div>${Math.abs(e.rshort)>=0.005?`<div class="tl"><span>${e.rshort<0?'− Delivery cash short (on their balance)':'+ Delivery shortage paid back / extra'}</span><span>${fmt(Math.abs(e.rshort))}</span></div>`:''}
   ${(()=>{const h=Object.entries(ridersHolding());const hs=Object.values((S.closes[k]||{}).hand||{});return (h.length?`<div class="banner" style="cursor:default;white-space:normal;display:block">Delivery cash is counted above but is still with the delivery staff: ${h.map(([n,v])=>`<b>${esc(n)}</b> ${aed(v)} <button class="btn sm" data-a="riderCash" data-v="${esc(n)}">Receive</button>`).join(' ')}</div>`:'')+(hs.length?`<div class="small muted">Delivery cash today: ${hs.map(x=>(x.kind||'hand')==='hand'?`${esc(x.rider)} handed ${fmt(x.got)}${Math.abs(x.diff)>=0.005?` (${x.diff<0?'short':'extra'} ${fmt(Math.abs(x.diff))})`:''} at ${tstr(x.ts)}`:`${esc(x.rider)} ${(RSK[x.kind]||x.kind).toLowerCase()} ${fmt(x.got)} at ${tstr(x.ts)}`).join(' · ')}</div>`:'')+rsBanner()})()}
   <div class="tl total"><span>Should be in drawer</span><span>${aed(e.expected)}</span></div>
   <h3>Count the notes and coins</h3><div class="denoms">${DENOMS.map(d=>`<label>AED ${d<1?d.toFixed(2):d}<input data-den="${d}" type="number" min="0" inputmode="numeric" placeholder="0" value="${cl.den&&cl.den[String(d).replace('.','_')]||''}"></label>`).join('')}</div>
   <div class="tl total"><span>Counted</span><span id="cnt">${aed(cl.counted||0)}</span></div><div class="tl"><span>Difference</span><span id="dif">${cl.counted!=null?fmt(cl.counted-e.expected):'—'}</span></div>
   <label class="field"><span class="lbl">Note</span><input id="clNote" value="${esc(cl.note||'')}" placeholder="Explain any short or extra cash"></label>
   <button class="btn pri big" data-a="closeDay">${cl.closed?'Update day close':'Close the day'}</button>
   <p class="small muted" style="margin:0">Closing also rolls the stock counts forward so the next day starts clean.</p>
  </div>
  <div class="stack"><div class="panel"><h2>Z report · ${dstr(k)}</h2><div class="stack" style="gap:4px;margin-top:10px">
   <div class="tl"><span>Bills</span><span>${a.n}</span></div><div class="tl"><span>Gross sales (incl. VAT)</span><span>${fmt(a.gross)}</span></div><div class="tl"><span>Discounts given</span><span>${fmt(a.disc)}</span></div><div class="tl"><span>Net sales (excl. VAT)</span><span>${fmt(a.net)}</span></div><div class="tl"><span>VAT collected</span><span>${fmt(a.vat)}</span></div>
   ${Object.entries(a.pay).map(([p,v])=>`<div class="tl"><span class="muted">${PAYN[p]}</span><span>${fmt(v)}</span></div>`).join('')}
   <div class="tl"><span>Voided bills</span><span>${a.voids} · ${fmt(a.voidAmt)}</span></div></div>
   <div class="row" style="margin-top:10px"><button class="btn" data-a="zfile">Print Z report</button><a class="btn grn" target="_blank" rel="noopener" href="${ownerWa(daySummary(k))}">Send to owner on WhatsApp</a></div></div>
   <div class="panel"><h2>Recent closes</h2>${past.length?`<table><tbody>${past.map(c=>`<tr><td>${dstr(c.date)}</td><td class="r">${fmt(c.counted)}</td><td class="r" style="color:${Math.abs(c.diff)<1?'var(--ok)':'var(--bad)'}">${c.diff>0?'+':''}${fmt(c.diff)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No days closed yet.</p>'}</div></div></div>`};

let repCache={key:'',d:null};
function rangeDates(){const t=today();switch(UI.rRange){case'today':return[t,t];case'yday':return[addDays(t,-1),addDays(t,-1)];case'7d':return[addDays(t,-6),t];case'month':return[t.slice(0,8)+'01',t];case'last':{const d=new Date(now.getFullYear(),now.getMonth()-1,1);const e=new Date(now.getFullYear(),now.getMonth(),0);return[dkey(d),dkey(e)]}default:return[UI.rFrom,UI.rTo]}}
function reportData(){const [f,t]=rangeDates();const inR=x=>x.date>=f&&x.date<=t;
  if(f>=WIN)return{orders:Object.values(S.orders).filter(inR),exps:Object.values(S.exp).filter(inR),purs:Object.values(S.pur).filter(inR),movs:Object.values(S.mov).filter(inR),f,t};
  const key=f+t;if(repCache.key===key&&repCache.d)return repCache.d;
  if(repCache.key!==key){repCache={key,d:null};const mf=f.slice(0,7),mt=t.slice(0,7);const mq=c=>DB.collection(c).where('m','>=',mf).where('m','<=',mt).get();
    Promise.all([DB.collection('orders').where('date','>=',f).where('date','<=',t).get(),mq('exp'),mq('pur'),mq('mov')]).then(([qo,qe,qp,qm])=>{
      const fl=q=>{const out=[];q.docs.forEach(d=>{const o=d.data().o||{};for(const id in o)out.push(Object.assign({},o[id],{_doc:d.id}))});return out};
      repCache={key,d:{orders:fl(qo),exps:fl(qe).filter(inR),purs:fl(qp).filter(inR),movs:fl(qm).filter(inR),f,t}};paint()}).catch(fail)}
  return null}
function padL(a,b,W){W=W||60;a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b}
function reportText(d,W){W=W||60;const SH={'Raw material purchases (incl. VAT)':'Material purchases','- Ingredient cost (recipes)':'- Ingredient cost','- Wastage & stock shortage':'- Wastage/shortage','- Delivery app commission':'- App commission','- Expenses (excl. VAT)':'- Expenses','Gross sales (incl. VAT)':'Gross sales','Net sales (excl. VAT)':'Net sales excl VAT','Input VAT on purchases':'Input VAT purchases','Input VAT on expenses':'Input VAT expenses'};
  const P=(x,y)=>{x=String(x);y=String(y);if(W<50&&SH[x.trim()])x=x.replace(x.trim(),SH[x.trim()]);if(x.length+y.length+1>W)x=x.slice(0,Math.max(1,W-y.length-1));return padL(x,y,W)};const a=agg(d.orders,d.exps,d.purs,d.movs);const st=S.settings;const items=Object.values(a.items).sort((x,y)=>y.rev-x.rev).slice(0,30);
  const L=[st.name,...(W<50?wrapW(st.addr,W).split('\n'):[st.addr]),st.trn?'TRN '+st.trn:'','',`SALES REPORT  ${dstr(d.f)}${d.f!==d.t?' to '+dstr(d.t):''}`,'='.repeat(W),
   P('Bills',a.n),P('Gross sales (incl. VAT)',fmt(a.gross)),P('Discounts',fmt(a.disc)),P('Net sales (excl. VAT)',fmt(a.net)),P('Average bill',fmt(a.avg)),'',
   'PAYMENTS',...Object.entries(a.pay).map(([k,v])=>P('  '+(PAYN[k]||k),fmt(v))),'',
   'PROFIT & LOSS',P('Net sales',fmt(a.net)),P('- Ingredient cost (recipes)',fmt(a.cogs)),P('- Wastage & stock shortage',fmt(a.waste)),P('- Delivery app commission',fmt(a.comm)),P('- Expenses (excl. VAT)',fmt(a.expNet)),P('= Net profit',fmt(a.profit)),'',
   'VAT',P('Output VAT on sales',fmt(a.vat)),P('Input VAT on purchases',fmt(a.purVat)),P('Input VAT on expenses',fmt(a.expVat)),P('Net VAT '+(a.vat-a.purVat-a.expVat>=0?'payable':'refundable'),fmt(Math.abs(a.vat-a.purVat-a.expVat))),'',
   P('Raw material purchases (incl. VAT)',fmt(a.purch)),P('Voided bills',a.voids+' / '+fmt(a.voidAmt)),'',
   ...(()=>{const rs=Object.entries(riderStats(d.orders));return rs.length?['DELIVERIES',...rs.map(([n,x])=>P('  '+n+' ('+x.n+')',fmt(x.amt))),'']:[]})(),
   'EXPENSES BY CATEGORY',...Object.entries(a.expCats).map(([k,v])=>P('  '+k,fmt(v))),'',
   W<50?'TOP ITEMS':'TOP ITEMS'+' '.repeat(W-27)+'QTY      SALES',...items.map(i=>W<50?P(i.n.slice(0,W-16),fmt0(i.q).padStart(3)+' '+fmt(i.rev).padStart(9)):P('  '+i.n.slice(0,W-24),fmt0(i.q).padStart(5)+'  '+fmt(i.rev).padStart(10))),'',
   `Printed ${new Date().toLocaleString('en-GB')}`];
  return L.join('\n')}
function daySummary(k){const a=agg(ordersOn(k),Object.values(S.exp).filter(e=>e.date===k),Object.values(S.pur).filter(p=>p.date===k),Object.values(S.mov).filter(m=>m.date===k));const e=drawerExpected(k);const cl=S.closes[k]||{};const top=Object.values(a.items).sort((x,y)=>y.q-x.q).slice(0,5);

function teamPanel(){if(!S.role)return '';const canEdit=S.role==='owner';const me=S.user&&S.user.uid;

  if(f==='unlock'){if($('#pinIn').value===String(S.settings.managerPin)){ssSet('wk_mgr','1');paint()}else{toast('Wrong PIN');$('#pinIn').value=''}}
  if(f==='settings'){const g=id=>document.getElementById(id).value;const pl=(S.settings.platforms||[]).map((p,i)=>({id:p.id,name:document.querySelector(`[data-pn="${i}"]`).value.trim()||p.name,comm:+document.querySelector(`[data-pc="${i}"]`).value||0}));
    const s={name:g('st_name').trim(),ownerWa:g('st_owa').trim(),cover:+g('st_cover')||7,addr:g('st_addr').trim(),phone:g('st_phone').trim(),trn:g('st_trn').trim(),vat:+g('st_vat')||0,footer:g('st_footer'),licenseExp:g('st_lic'),tables:+g('st_tables')||0,stampEvery:+g('st_stamp')||0,managerPin:g('st_pin').trim(),
      inclusive:document.getElementById('st_incl').checked,paper:document.getElementById('st_paper').value,webOn:document.getElementById('st_won').checked,webOpen:g('st_wopen'),webClose:g('st_wclose'),webFee:+g('st_wfee')||0,webMin:+g('st_wmin')||0,webMax:+g('st_wmax')||300,webArea:g('st_warea').trim(),docPaper:document.getElementById('st_docp').value,autoPrint:document.getElementById('st_ap').checked,mods:g('st_mods').split(',').map(x=>x.trim()).filter(Boolean),expCats:g('st_exp').split(',').map(x=>x.trim()).filter(Boolean),platforms:pl};
    if(s.trn&&!/^\d{15}$/.test(s.trn)){toast('A UAE TRN has 15 digits.');return}
    try{await setDoc('cfg/settings',Object.assign({},S.settings,s));if(s.managerPin)ssSet('wk_mgr','1');document.activeElement.blur();toast('Settings saved')}catch(x){fail(x)}}});
document.addEventListener('change',e=>{const ru=e.target.dataset&&e.target.dataset.role;if(ru){const v=e.target.value;FS.doc('users/'+ru).set(v==='delivery'?{role:'staff',duty:'delivery'}:{role:v,duty:''},{merge:true}).then(()=>toast('Role updated'),x=>toast('Only the owner can change roles.'));return}
  const un=e.target.dataset&&e.target.dataset.uname;if(un){FS.doc('users/'+un).set({name:e.target.value.trim().slice(0,40)},{merge:true}).then(()=>toast('Name saved'),x=>toast('Only the owner can change names.'));return}
  if(e.target.id!=='restoreF')return;const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{let data;try{data=JSON.parse(r.result)}catch(x){toast('That file is not a backup.');return}
  if(data.app!=='wahid-karak-pos'){toast('That file is not a Wahid Karak backup.');return}
  confirmBox('Restore backup?',`Backup from ${esc(data.at)}. Menu, stock, staff, settings and customers are replaced; bills and expenses are added back.`,'Restore',async()=>{
    await setDoc('cfg/settings',data.settings);await setDoc('cfg/menu',data.menu);await setDoc('cfg/inv',data.inv);await setDoc('cfg/staff',data.staff);
    for(const id in data.cust)await setDoc('cust/'+id,data.cust[id]);
    const groups={};for(const id in data.orders){const o=Object.assign({},data.orders[id]);const doc=o._doc;delete o._doc;(groups[doc]=groups[doc]||{date:o.date,dev:o.dev,o:{}}).o[id]=o}
    for(const doc in groups)await upsert('orders/'+doc,{date:groups[doc].date,dev:groups[doc].dev,o:{}},{o:groups[doc].o});
    const eg={};for(const id in data.exp){const x=Object.assign({},data.exp[id]);const doc=x._doc;delete x._doc;(eg[doc]=eg[doc]||{m:doc,o:{}}).o[id]=x}
    for(const doc in eg)await upsert('exp/'+doc,{m:doc,o:{}},{o:eg[doc].o});
    if(data.sup)await setDoc('cfg/sup',data.sup);for(const id in (data.po||{}))await setDoc('po/'+id,data.po[id]);
    for(const col of ['pur','mov']){const g={};for(const id in (data[col]||{})){const x=Object.assign({},data[col][id]);const doc=x._doc;delete x._doc;(g[doc]=g[doc]||{m:doc,o:{}}).o[id]=x}for(const doc in g)await upsert(col+'/'+doc,{m:doc,o:{}},{o:g[doc].o})}
    for(const k in data.closes)await setDoc('close/'+k,data.closes[k]);toast('Backup restored')})};r.readAsText(file);e.target.value=''});

let wakeLock=null;async function wake(){if(!lsGet('wk_wake',false)||!('wakeLock' in navigator)||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('pointerdown',()=>{if(!wakeLock)wake()});
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(UI.view==='setup')paint()});
document.addEventListener('change',e=>{if(e.target.id==='wakeT'){lsSet('wk_wake',e.target.checked);if(e.target.checked)wake();else if(wakeLock){wakeLock.release();wakeLock=null}toast(e.target.checked?'Screen stays on while the app is open':'Screen can sleep again')}});
const INSTALL_HTML=()=>{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const inApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(inApp)return '<p class="small muted" style="margin:0">Running as an installed app.</p>';
  if(installEvt)return '<div><button class="btn pri" data-a="install">Install as app on this device</button></div>';
  return `<p class="small muted" style="margin:0">Install on the home screen: ${ios?'in Safari tap <b>Share</b> then <b>Add to Home Screen</b>.':'in Chrome open the <b>⋮</b> menu then <b>Install app</b> / <b>Add to Home screen</b>.'}</p>`};
function applyTheme(){const t=lsGet('wk_theme','system');if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- boot ---------- */
function FirebaseDB(fs){
  // offline: writes are queued on the device, so don't block the till; a rejection that arrives later is still shown
  const soon=p=>{let late=false;p.catch(e=>{if(late)fail(e)});return Promise.race([p,new Promise(r=>setTimeout(()=>{late=true;r()},2500))])};
  const wd=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>soon(r.set(d)),update:d=>soon(r.update(d)),mergeSet:d=>soon(r.set(d,{merge:true})),delete:()=>soon(r.delete()),onSnapshot:(n,e)=>r.onSnapshot(n,e),collection:c=>wq(r.collection(c))});
  const wq=q=>({where:(f,o,v)=>wq(q.where(f,o,v)),orderBy:(f,d)=>wq(q.orderBy(f,d)),limit:n=>wq(q.limit(n)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e),doc:id=>wd(id?q.doc(id):q.doc()),add:d=>q.add(d)});
  return{fb:true,doc:p=>wd(fs.doc(p)),collection:p=>wq(fs.collection(p))}}
let AUTH=null,FS=null,started=false;
function authMsg(e){const c=(e&&e.code)||'';return c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?'Email or password is not right.':c.includes('email-already-in-use')?'That email already has an account. Sign in instead.':c.includes('weak-password')?'Use at least 6 characters for the password.':c.includes('too-many-requests')?'Too many tries. Wait a few minutes.':c.includes('network')?'No internet connection.':c.includes('operation-not-allowed')?'Email sign-in is not turned on in Firebase (Authentication → Sign-in method).':(e&&e.message)||'Something went wrong.'}
setInterval(()=>{const d=new Date();const key=dkey(d);if(d.getHours()===4&&BOOT_DAY!==key&&!cart.lines.length&&!$('#modal').innerHTML&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))location.reload()},5*60000);
const BOOT_DAY=dkey(new Date());
async function boot(){applyTheme();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))UI.view=h;paint();
  setInterval(()=>{if(UI.view==='orders'&&UI.kTab==='kitchen'&&!$('#modal').innerHTML)paint()},30000);
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/YOUR_|PASTE/i.test(cfg.apiKey)){DB=LocalDB();S.mode='local';subscribe();setTimeout(()=>{if(!S.ready){S.ready=true;paint()}},800);return}
  firebase.initializeApp(cfg);FS=firebase.firestore();
  try{FS.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){console.warn('offline cache off',e.code)}
  const net=()=>{S.offline=!navigator.onLine;if(S.ready||S.auth)paint()};window.addEventListener('online',net);window.addEventListener('offline',net);S.offline=!navigator.onLine;
  AUTH=firebase.auth();
  AUTH.onAuthStateChanged(async u=>{
    if(u&&u.isAnonymous){AUTH.signOut();return}
    if(!u){if(started){location.reload();return}S.user=null;S.auth='out';paint();return}
    S.user=u;const ref=FS.doc('users/'+u.uid);const owners=(window.OWNER_EMAILS||[]).map(x=>String(x).toLowerCase());const isOwnerEmail=owners.includes((u.email||'').toLowerCase());
    try{const snap=await ref.get();if(!snap.exists)await ref.set({email:u.email,role:isOwnerEmail?'owner':'pending',ts:Date.now()});else if(isOwnerEmail&&snap.data().role!=='owner')await ref.set({role:'owner'},{merge:true})}catch(e){console.warn(e)}
    ref.onSnapshot(s=>{const ud=s.data()||{};const r=ud.role||'pending';const duty=ud.duty||'';
      if(started&&(r!==S.role||duty!==S.duty)){location.reload();return}
      S.myName=ud.name||(u.email||'').split('@')[0];
      if(started){paint();return}
      S.duty=duty;if(duty==='delivery'){UI.view='orders';UI.kTab='web'}
      S.role=r;
      if(r==='pending'||r==='disabled'||!['owner','manager','staff','accountant'].includes(r)){S.auth='pending';paint();return}
      S.auth='in';started=true;S.mode=r==='accountant'?'readonly':'cloud';
      if(r==='accountant'&&!VIEWS.some(v=>v[0]===location.hash.slice(1)))UI.view='reports';
      DB=FirebaseDB(FS);subscribe();
      if(r==='owner'||r==='manager')FS.collection('users').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.users=m;
        // share delivery people's names with the other tills (they can't read the team list)
        const rd=Object.values(m).filter(x=>x.role==='staff'&&x.duty==='delivery').map(x=>x.name||(x.email||'').split('@')[0]).sort();
        if(S.loaded.settings&&JSON.stringify(rd)!==JSON.stringify((S.staff&&S.staff.riders)||[]))upsert('cfg/staff',{items:{}},{riders:rd}).catch(()=>{});
        changed()},()=>{});
      setTimeout(()=>{if(!S.ready){S.ready=true;paint()}},6000)},
      e=>{toast('Could not read your account. Check the Firestore rules.');console.error(e)})});
}
boot();
})();
