RENDER.menu=function(){const cats=S.menu.cats||[];const q=UI.menuQ.toLowerCase();const list=menuItems().filter(i=>!q||i.name.toLowerCase().includes(q));
  return `<div class="topbar"><h1>Menu</h1><button class="btn" data-a="cats">Categories (${cats.length})</button><button class="btn pri" data-a="newItem">+ Menu item</button></div>
  <p class="muted" style="margin:-6px 0 12px;max-width:70ch">Prices include ${S.settings.vat}% VAT${S.settings.inclusive?'':' (currently set to add VAT on top)'}. Add a recipe to each item so stock and profit work out on their own.</p>
  <input data-in="menuQ" id="menuQ" placeholder="Search menu" value="${esc(UI.menuQ)}" style="max-width:340px;margin-bottom:10px">

const DENOMS=[1000,500,200,100,50,20,10,5,1,0.5,0.25];
function drawerExpected(k){const cl=S.closes[k]||{};const os=ordersOn(k).filter(live);
  const cashSales=os.reduce((s,o)=>s+(o.pay.cash||0),0);
  let khata=0;custList().forEach(c=>Object.values(c.tx||{}).forEach(t=>{if(t.t==='pay'&&t.method==='cash'&&t.date===k)khata+=+t.amt}));
  const exp=Object.values(S.exp).filter(e=>!e.del&&e.date===k&&e.drawer).reduce((s,e)=>s+(+e.amt||0),0);
  const sup=purList().filter(p=>p.drawer&&p.payDate===k).reduce((s,p)=>s+(+p.total||0),0);
  const fl=+cl.float||0;return{float:fl,cashSales:r2(cashSales),khata:r2(khata),exp:r2(exp),sup:r2(sup),expected:r2(fl+cashSales+khata-exp-sup)}}
RENDER.close=function(){const k=today();const cl=S.closes[k]||{};const e=drawerExpected(k);const a=agg(ordersOn(k),Object.values(S.exp).filter(x=>x.date===k));

function zText(k){const a=agg(ordersOn(k),[]);const e=drawerExpected(k);const cl=S.closes[k]||{};return [`${S.settings.name}`,`Z REPORT  ${dstr(k)}`,S.settings.trn?'TRN '+S.settings.trn:'','',`Bills: ${a.n}`,`Gross sales: ${fmt(a.gross)}`,`Discounts: ${fmt(a.disc)}`,`Net excl. VAT: ${fmt(a.net)}`,`VAT ${S.settings.vat}%: ${fmt(a.vat)}`,''].concat(Object.entries(a.pay).map(([p,v])=>`${PAYN[p]}: ${fmt(v)}`)).concat(['',`Voids: ${a.voids} (${fmt(a.voidAmt)})`,`Expected cash: ${fmt(e.expected)}`,`Counted cash: ${cl.counted!=null?fmt(cl.counted):'-'}`,`Difference: ${cl.diff!=null?fmt(cl.diff):'-'}`,cl.note?'Note: '+cl.note:'']).join('\n')}

/* ---------- REPORTS ---------- */
let repCache={key:'',d:null};
function rangeDates(){const t=today();switch(UI.rRange){case'today':return[t,t];case'yday':return[addDays(t,-1),addDays(t,-1)];case'7d':return[addDays(t,-6),t];case'month':return[t.slice(0,8)+'01',t];case'last':{const d=new Date(now.getFullYear(),now.getMonth()-1,1);const e=new Date(now.getFullYear(),now.getMonth(),0);return[dkey(d),dkey(e)]}default:return[UI.rFrom,UI.rTo]}}
function reportData(){const [f,t]=rangeDates();const inR=x=>x.date>=f&&x.date<=t;
  if(f>=WIN)return{orders:Object.values(S.orders).filter(inR),exps:Object.values(S.exp).filter(inR),purs:Object.values(S.pur).filter(inR),movs:Object.values(S.mov).filter(inR),f,t};
  const key=f+t;if(repCache.key===key&&repCache.d)return repCache.d;
  if(repCache.key!==key){repCache={key,d:null};const mf=f.slice(0,7),mt=t.slice(0,7);const mq=c=>DB.collection(c).where('m','>=',mf).where('m','<=',mt).get();
    Promise.all([DB.collection('orders').where('date','>=',f).where('date','<=',t).get(),mq('exp'),mq('pur'),mq('mov')]).then(([qo,qe,qp,qm])=>{
      const fl=q=>{const out=[];q.docs.forEach(d=>{const o=d.data().o||{};for(const id in o)out.push(Object.assign({},o[id],{_doc:d.id}))});return out};
      repCache={key,d:{orders:fl(qo),exps:fl(qe).filter(inR),purs:fl(qp).filter(inR),movs:fl(qm).filter(inR),f,t}};paint()}).catch(fail)}
  return null}
function padL(a,b,W){W=W||60;a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b}
function reportText(d){const a=agg(d.orders,d.exps,d.purs,d.movs);const st=S.settings;const items=Object.values(a.items).sort((x,y)=>y.rev-x.rev).slice(0,30);
  const L=[st.name,st.addr,st.trn?'TRN '+st.trn:'','',`SALES REPORT  ${dstr(d.f)}${d.f!==d.t?' to '+dstr(d.t):''}`,'='.repeat(60),
   padL('Bills',a.n),padL('Gross sales (incl. VAT)',fmt(a.gross)),padL('Discounts',fmt(a.disc)),padL('Net sales (excl. VAT)',fmt(a.net)),padL('Average bill',fmt(a.avg)),'',
   'PAYMENTS',...Object.entries(a.pay).map(([k,v])=>padL('  '+(PAYN[k]||k),fmt(v))),'',
   'PROFIT & LOSS',padL('Net sales',fmt(a.net)),padL('- Ingredient cost (recipes)',fmt(a.cogs)),padL('- Wastage & stock shortage',fmt(a.waste)),padL('- Delivery app commission',fmt(a.comm)),padL('- Expenses (excl. VAT)',fmt(a.expNet)),padL('= Net profit',fmt(a.profit)),'',
   'VAT',padL('Output VAT on sales',fmt(a.vat)),padL('Input VAT on purchases',fmt(a.purVat)),padL('Input VAT on expenses',fmt(a.expVat)),padL('Net VAT '+(a.vat-a.purVat-a.expVat>=0?'payable':'refundable'),fmt(Math.abs(a.vat-a.purVat-a.expVat))),'',
   padL('Raw material purchases (incl. VAT)',fmt(a.purch)),padL('Voided bills',a.voids+' / '+fmt(a.voidAmt)),'',
   'EXPENSES BY CATEGORY',...Object.entries(a.expCats).map(([k,v])=>padL('  '+k,fmt(v))),'',
   'TOP ITEMS'+' '.repeat(33)+'QTY      SALES',...items.map(i=>padL('  '+i.n.slice(0,36),fmt0(i.q).padStart(5)+'  '+fmt(i.rev).padStart(10))),'',
   `Printed ${new Date().toLocaleString('en-GB')}`];
  return L.join('\n')}
function daySummary(k){const a=agg(ordersOn(k),Object.values(S.exp).filter(e=>e.date===k),Object.values(S.pur).filter(p=>p.date===k),Object.values(S.mov).filter(m=>m.date===k));const e=drawerExpected(k);const cl=S.closes[k]||{};const top=Object.values(a.items).sort((x,y)=>y.q-x.q).slice(0,5);
  return [`*${S.settings.name}* — ${dstr(k)}`,`Sales: AED ${fmt(a.gross)} (${a.n} bills, avg ${fmt(a.avg)})`].concat(Object.entries(a.pay).map(([p,v])=>`• ${PAYN[p]}: ${fmt(v)}`)).concat([`VAT collected: ${fmt(a.vat)}`,`Expenses: ${fmt(a.expNet+a.expVat)} · Purchases: ${fmt(a.purch)}`,a.waste?`Wastage: ${fmt(a.waste)}`:'',`Cash in drawer should be: ${fmt(e.expected)}`+(cl.counted!=null?` · counted ${fmt(cl.counted)} (${cl.diff>=0?'+':''}${fmt(cl.diff)})`:''),top.length?`Best sellers: ${top.map(i=>i.n+' '+fmt0(i.q)).join(', ')}`:'']).filter(Boolean).join('\n')}
RENDER.reports=function(){
  const ranges=[['today','Today'],['yday','Yesterday'],['7d','7 days'],['month','This month'],['last','Last month'],['custom','Custom']];
  const head=`<div class="topbar"><h1>Reports</h1><div class="row">${ranges.map(([k,l])=>`<button class="chip ${UI.rRange===k?'on':''}" data-a="rRange" data-v="${k}">${l}</button>`).join('')}</div></div>

  </div>

  <div class="grid2">
   <div class="panel"><h2>Sales by hour</h2><p class="small muted">When the rush comes, AED</p>${barChart(a.hours.slice(5),a.hours.slice(5).map((_,i)=>String(i+5)),{label:'Sales by hour'})}</div>

   <div class="panel"><h2>VAT summary</h2><p class="small muted">For the FTA return (figures to check with your accountant)</p><div class="stack" style="gap:4px;margin-top:6px">

   <div class="panel"><h2>Payments & channels</h2><div style="margin-top:10px">${a.n?hbars(Object.entries(a.pay).map(([k,v])=>[PAYN[k]||k,v])):'<p class="muted">No sales in this period.</p>'}</div>${Object.keys(a.plats).length?`<h3 style="margin-top:12px">Delivery apps</h3><div style="margin-top:6px">${hbars(Object.entries(a.plats).map(([k,v])=>[plat[k]||k,v]))}</div>`:''}</div>

function csv(rows){return rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}

  ask:async()=>{const d=reportData();if(!d)return;UI.aiQ=($('#aiQ')||{}).value||'';const a=agg(d.orders,d.exps);let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
    if(!sample){toast('Asking Claude is not available in this view.');return}
    const summary={cafe:'Small karak tea cafeteria in Al Fahidi / Meena Bazaar, Dubai',period:[d.f,d.t],bills:a.n,grossAED:r2(a.gross),netAED:r2(a.net),avgBill:r2(a.avg),ingredientCost:r2(a.cogs),commission:r2(a.comm),expenses:r2(a.expNet),profit:r2(a.profit),payments:a.pay,orderTypes:a.types,salesByHour:a.hours.map(r2),
      topItems:Object.values(a.items).sort((x,y)=>y.rev-x.rev).slice(0,20).map(i=>({item:i.n,qty:i.q,sales:r2(i.rev),cost:r2(i.cost)})),expensesByCategory:a.expCats};
    UI.aiBusy=true;UI.ai='';paint();
    try{const r=await sample(`You advise the owner of a small cafeteria in Dubai. Answer in plain, practical English, at most 8 short bullet points, using AED. Base everything on these numbers; say when data is too thin.\n\nQuestion: ${UI.aiQ||'What stands out and what should I do next week?'}\n\nData:\n${JSON.stringify(summary)}`,{onText:({text})=>{UI.ai=text;const o=$('#aiOut');if(o)o.textContent=text;else paint()}});UI.ai=r.text}catch(e){UI.ai=e&&e.code==='not_granted'?'Permission to ask Claude was not given.':'Could not get an answer: '+((e&&e.message)||'try again later')}

};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('submit',async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  if(f==='login'||f==='signup'){const em=$('#lgE').value.trim(),pw=$('#lgP').value;const btn=e.target.querySelector('button.pri');btn.disabled=true;
    try{if(f==='login')await AUTH.signInWithEmailAndPassword(em,pw);else await AUTH.createUserWithEmailAndPassword(em,pw)}catch(x){toast(authMsg(x));btn.disabled=false}return}
  if(f==='unlock'){if($('#pinIn').value===String(S.settings.managerPin)){ssSet('wk_mgr','1');paint()}else{toast('Wrong PIN');$('#pinIn').value=''}}
  if(f==='settings'){const g=id=>document.getElementById(id).value;const pl=(S.settings.platforms||[]).map((p,i)=>({id:p.id,name:document.querySelector(`[data-pn="${i}"]`).value.trim()||p.name,comm:+document.querySelector(`[data-pc="${i}"]`).value||0}));
    const s={name:g('st_name').trim(),ownerWa:g('st_owa').trim(),cover:+g('st_cover')||7,addr:g('st_addr').trim(),phone:g('st_phone').trim(),trn:g('st_trn').trim(),vat:+g('st_vat')||0,footer:g('st_footer'),licenseExp:g('st_lic'),tables:+g('st_tables')||0,stampEvery:+g('st_stamp')||0,managerPin:g('st_pin').trim(),
      inclusive:document.getElementById('st_incl').checked,autoPrint:document.getElementById('st_ap').checked,mods:g('st_mods').split(',').map(x=>x.trim()).filter(Boolean),expCats:g('st_exp').split(',').map(x=>x.trim()).filter(Boolean),platforms:pl};
    if(s.trn&&!/^\d{15}$/.test(s.trn)){toast('A UAE TRN has 15 digits.');return}
    try{await setDoc('cfg/settings',Object.assign({},S.settings,s));if(s.managerPin)ssSet('wk_mgr','1');document.activeElement.blur();toast('Settings saved')}catch(x){fail(x)}}});
document.addEventListener('change',e=>{const ru=e.target.dataset&&e.target.dataset.role;if(ru){FS.doc('users/'+ru).set({role:e.target.value},{merge:true}).then(()=>toast('Role updated'),x=>toast('Only the owner can change roles.'));return}
  if(e.target.id!=='restoreF')return;const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{let data;try{data=JSON.parse(r.result)}catch(x){toast('That file is not a backup.');return}
  if(data.app!=='wahid-karak-pos'){toast('That file is not a Wahid Karak backup.');return}
  confirmBox('Restore backup?',`Backup from ${esc(data.at)}. Menu, stock, staff, settings and customers are replaced; bills and expenses are added back.`,'Restore',async()=>{
    await setDoc('cfg/settings',data.settings);await setDoc('cfg/menu',data.menu);await setDoc('cfg/inv',data.inv);await setDoc('cfg/staff',data.staff);
    for(const id in data.cust)await setDoc('cust/'+id,data.cust[id]);
    const groups={};for(const id in data.orders){const o=Object.assign({},data.orders[id]);const doc=o._doc;delete o._doc;(groups[doc]=groups[doc]||{date:o.date,dev:o.dev,o:{}}).o[id]=o}
    for(const doc in groups)await upsert('orders/'+doc,{date:groups[doc].date,dev:groups[doc].dev,o:{}},{o:groups[doc].o});
    const eg={};for(const id in data.exp){const x=Object.assign({},data.exp[id]);const doc=x._doc;delete x._doc;(eg[doc]=eg[doc]||{m:doc,o:{}}).o[id]=x}
    for(const doc in eg)await upsert('exp/'+doc,{m:doc,o:{}},{o:eg[doc].o});
    if(data.sup)await setDoc('cfg/sup',data.sup);for(const id in (data.po||{}))await setDoc('po/'+id,data.po[id]);
    for(const col of ['pur','mov']){const g={};for(const id in (data[col]||{})){const x=Object.assign({},data[col][id]);const doc=x._doc;delete x._doc;(g[doc]=g[doc]||{m:doc,o:{}}).o[id]=x}for(const doc in g)await upsert(col+'/'+doc,{m:doc,o:{}},{o:g[doc].o})}
    for(const k in data.closes)await setDoc('close/'+k,data.closes[k]);toast('Backup restored')})};r.readAsText(file);e.target.value=''});

let wakeLock=null;async function wake(){if(!lsGet('wk_wake',false)||!('wakeLock' in navigator)||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('pointerdown',()=>{if(!wakeLock)wake()});
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(UI.view==='setup')paint()});
document.addEventListener('change',e=>{if(e.target.id==='wakeT'){lsSet('wk_wake',e.target.checked);if(e.target.checked)wake();else if(wakeLock){wakeLock.release();wakeLock=null}toast(e.target.checked?'Screen stays on while the app is open':'Screen can sleep again')}});

  if(inApp)return '<p class="small muted" style="margin:0">Running as an installed app.</p>';
  if(installEvt)return '<div><button class="btn pri" data-a="install">Install as app on this device</button></div>';
  return `<p class="small muted" style="margin:0">Install on the home screen: ${ios?'in Safari tap <b>Share</b> then <b>Add to Home Screen</b>.':'in Chrome open the <b>⋮</b> menu then <b>Install app</b> / <b>Add to Home screen</b>.'}</p>`};
function applyTheme(){const t=lsGet('wk_theme','system');if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- boot ---------- */
function FirebaseDB(fs){
  const soon=p=>Promise.race([p,new Promise(r=>setTimeout(r,2500))]); // offline: writes are queued locally, don't block the till
  const wd=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>soon(r.set(d)),update:d=>soon(r.set(d,{merge:true})),delete:()=>soon(r.delete()),onSnapshot:(n,e)=>r.onSnapshot(n,e),collection:c=>wq(r.collection(c))});
  const wq=q=>({where:(f,o,v)=>wq(q.where(f,o,v)),orderBy:(f,d)=>wq(q.orderBy(f,d)),limit:n=>wq(q.limit(n)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e),doc:id=>wd(id?q.doc(id):q.doc()),add:d=>q.add(d)});
  return{fb:true,doc:p=>wd(fs.doc(p)),collection:p=>wq(fs.collection(p))}}
let AUTH=null,FS=null,started=false;
function authMsg(e){const c=(e&&e.code)||'';return c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?'Email or password is not right.':c.includes('email-already-in-use')?'That email already has an account. Sign in instead.':c.includes('weak-password')?'Use at least 6 characters for the password.':c.includes('too-many-requests')?'Too many tries. Wait a few minutes.':c.includes('network')?'No internet connection.':c.includes('operation-not-allowed')?'Email sign-in is not turned on in Firebase (Authentication → Sign-in method).':(e&&e.message)||'Something went wrong.'}
async function boot(){applyTheme();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))UI.view=h;paint();
  setInterval(()=>{if(UI.view==='orders'&&UI.kTab==='kitchen'&&!$('#modal').innerHTML)paint()},30000);
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/YOUR_|PASTE/i.test(cfg.apiKey)){DB=LocalDB();S.mode='local';subscribe();setTimeout(()=>{if(!S.ready){S.ready=true;paint()}},800);return}
  firebase.initializeApp(cfg);FS=firebase.firestore();
  try{FS.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){console.warn('offline cache off',e.code)}
  const net=()=>{S.offline=!navigator.onLine;if(S.ready||S.auth)paint()};window.addEventListener('online',net);window.addEventListener('offline',net);S.offline=!navigator.onLine;
  AUTH=firebase.auth();
  AUTH.onAuthStateChanged(async u=>{
    if(!u){if(started){location.reload();return}S.user=null;S.auth='out';paint();return}
    S.user=u;const ref=FS.doc('users/'+u.uid);const owners=(window.OWNER_EMAILS||[]).map(x=>String(x).toLowerCase());const isOwnerEmail=owners.includes((u.email||'').toLowerCase());
    try{const snap=await ref.get();if(!snap.exists)await ref.set({email:u.email,role:isOwnerEmail?'owner':'pending',ts:Date.now()});else if(isOwnerEmail&&snap.data().role!=='owner')await ref.set({role:'owner'},{merge:true})}catch(e){console.warn(e)}
    ref.onSnapshot(s=>{const r=(s.data()||{}).role||'pending';
      if(started&&r!==S.role){location.reload();return}
      S.role=r;
      if(r==='pending'||r==='disabled'||!['owner','manager','staff','accountant'].includes(r)){S.auth='pending';paint();return}
      S.auth='in';started=true;S.mode=r==='accountant'?'readonly':'cloud';
      if(r==='accountant'&&!VIEWS.some(v=>v[0]===location.hash.slice(1)))UI.view='reports';
      DB=FirebaseDB(FS);subscribe();
      if(r==='owner'||r==='manager')FS.collection('users').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.users=m;changed()},()=>{});
      setTimeout(()=>{if(!S.ready){S.ready=true;paint()}},6000)},
      e=>{toast('Could not read your account. Check the Firestore rules.');console.error(e)})});
}
boot();
})();
