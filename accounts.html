<!doctype html>
<html lang="en">
<head>

<title>Wahid Karak Accounts</title>
<meta name="description" content="Books of account for Wahid Karak Cafe LLC: ledger, VAT, Corporate Tax and financial statements linked to the POS.">

<style>
:root{
  --bg:#F6F3F8;--surface:#FFFFFF;--surface-2:#EFEAF3;--line:#DDD4E5;--fg:#1F1529;--muted:#6B5F78;
  --plum:#3A1E5C;--plum-2:#4E2A78;--on-plum:#FFFFFF;--gold:#A87B2C;--gold-soft:#F4EAD4;--goldtxt:#7A5716;
  --ok:#16794A;--ok-soft:#DFF3E8;--warn:#9A5B00;--warn-soft:#FBEFD9;--bad:#B4232A;--bad-soft:#FBE3E4;
  --rail:#211431;--rail-fg:#E9DFF3;--shadow:0 1px 2px rgba(33,20,49,.06),0 6px 18px rgba(33,20,49,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130C1B;--surface:#1D1428;--surface-2:#271B35;--line:#3A2B4B;--fg:#F1EAF7;--muted:#A797B8;
  --plum:#B994E6;--plum-2:#C9AAF0;--on-plum:#1B1027;--gold:#D9B26A;--gold-soft:#3A2E17;--goldtxt:#E8C98A;
  --ok:#5BD08F;--ok-soft:#14301F;--warn:#F0B451;--warn-soft:#3A2A10;--bad:#FF7A80;--bad-soft:#3D1518;
  --rail:#0D0813;--rail-fg:#E9DFF3;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130C1B;--surface:#1D1428;--surface-2:#271B35;--line:#3A2B4B;--fg:#F1EAF7;--muted:#A797B8;
  --plum:#B994E6;--plum-2:#C9AAF0;--on-plum:#1B1027;--gold:#D9B26A;--gold-soft:#3A2E17;--goldtxt:#E8C98A;
  --ok:#5BD08F;--ok-soft:#14301F;--warn:#F0B451;--warn-soft:#3A2A10;--bad:#FF7A80;--bad-soft:#3D1518;
  --rail:#0D0813;--rail-fg:#E9DFF3;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;letter-spacing:.01em}
h1{font-size:1.65rem}h2{font-size:1.2rem}h3{font-size:1rem;font-family:Figtree,sans-serif;font-weight:700}
.num,.r,td.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.app.solo{grid-template-columns:1fr}.app.solo #rail{display:none}
#rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:2px;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.brand img{width:46px;height:46px;border-radius:10px;display:block}
.brand b{font-family:Marcellus,serif;font-weight:400;font-size:1.05rem;line-height:1.1;color:#E6C887}
.brand span{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#B9A6CF}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;font-size:.92rem;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;width:100%}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:#E6C887;color:#211431;font-weight:700}.nav.on svg{opacity:1}
.nav .cnt{margin-left:auto;background:#C9545B;color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.navsep{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#8E7AA6;padding:12px 10px 4px}
.spacer{flex:1}
#view{padding:22px 26px 60px;max-width:1280px;width:100%;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{margin-right:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel>h2{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:"JetBrains Mono",monospace;font-size:1.25rem;font-weight:600;margin-top:2px}
.kpi .d{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:38px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--plum-2)}
.btn.pri{background:var(--plum);border-color:var(--plum);color:var(--on-plum)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1027}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.row>.seg,.row>.row{min-width:0;max-width:100%}
.seg button{border:0;background:none;font:inherit;font-size:.86rem;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--plum-2);outline-offset:0;border-color:transparent}
input[type=checkbox]{width:auto;min-height:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.sub td{font-weight:700;border-top:1px solid var(--fg)}
tr.tot td{font-weight:800;border-top:2px solid var(--fg);border-bottom:3px double var(--fg)}
tr.hd td{font-weight:700;color:var(--plum);padding-top:14px;border-bottom:0;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
tr.void td{color:var(--muted);text-decoration:line-through}
td.ind{padding-left:22px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mute{background:var(--surface-2);color:var(--muted)}.p-gold{background:var(--gold-soft);color:var(--goldtxt)}
.small{font-size:.84rem}.muted{color:var(--muted)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}.empty b{display:block;color:var(--fg);margin-bottom:4px}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.9rem}
.alert.bad{border-left-color:var(--bad)}.alert.ok{border-left-color:var(--ok)}.alert.info{border-left-color:var(--plum-2)}
.alert .grow{flex:1;min-width:0}
.tl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tl span:last-child{font-family:"JetBrains Mono",monospace}
.tl.total{font-weight:800;border-top:1px solid var(--line);padding-top:8px;font-size:1.05rem}
#modal:empty{display:none}
#modal{position:fixed;inset:0;background:rgba(19,10,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.dlg{background:var(--surface);border-radius:16px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin-bottom:6vh}
.dlg.wide{width:min(1040px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
.jl td{padding:4px}.jl input,.jl select{min-height:34px;padding:5px 8px}
.chart{width:100%;height:auto;display:block}
.bal{font-family:"JetBrains Mono",monospace}
.neg{color:var(--bad)}
.deadline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.deadline:last-child{border-bottom:0}
.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
#printArea{display:none}
.mob{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  #rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;overflow-x:auto;gap:2px}
  #rail .brand,#rail .navsep,#rail .spacer,#rail .x{display:none}
  .nav{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 8px;min-width:62px;align-items:center;text-align:center}
  .nav .cnt{position:absolute;margin:0 0 0 22px;font-size:.6rem}
  .mob{display:inline-flex}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)!important}
  .topbar .btn{flex:1 1 auto}
  #txQ,#auditQ{width:100%!important}
  .panel{padding:12px}
  #view{padding:14px 16px 96px}
  h1{font-size:1.35rem}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:1.05rem}
}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff!important;color:#000}
  #printArea{display:block;font-family:Figtree,Arial,sans-serif;font-size:10pt;line-height:1.35;color:#000}
  #printArea .ph{display:flex;align-items:center;gap:12pt;border-bottom:1.5pt solid #000;padding-bottom:8pt;margin-bottom:10pt}
  #printArea .ph img{width:54pt;height:54pt}
  #printArea .ph .co{font-family:Marcellus,Georgia,serif;font-size:15pt}
  #printArea .ph .tt{margin-left:auto;text-align:right}
  #printArea .ph .tt b{display:block;font-size:12pt;text-transform:uppercase;letter-spacing:.04em}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printArea thead{display:table-header-group}
  #printArea tr{break-inside:avoid}
  #printArea th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;border-bottom:1pt solid #000;padding:3pt 4pt;color:#000}
  #printArea td{padding:3pt 4pt;border-bottom:.4pt solid #bbb;color:#000}
  #printArea .r{text-align:right;font-family:"JetBrains Mono",monospace;white-space:nowrap}
  #printArea tr.sub td{font-weight:700;border-top:.8pt solid #000}
  #printArea tr.tot td{font-weight:800;border-top:1pt solid #000;border-bottom:2.2pt double #000}
  #printArea tr.hd td{font-weight:700;border-bottom:0;padding-top:8pt;text-transform:uppercase;font-size:8pt;letter-spacing:.05em}
  #printArea td.ind{padding-left:14pt}
  #printArea .pf{margin-top:14pt;font-size:8pt;color:#444;display:flex;justify-content:space-between;gap:20pt}
  #printArea .sig{margin-top:30pt;display:flex;gap:40pt}#printArea .sig div{flex:1;border-top:.6pt solid #000;padding-top:3pt;font-size:8.5pt}
}
</style>

<body>
<div class="app"><nav id="rail" aria-label="Sections"></nav><main id="view"></main></div>
<div id="modal"></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="printArea"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){'use strict';
/* =========================================================
   Wahid Karak Accounts — double-entry books linked to the POS
   Reads POS data (read-only) and posts each POS day as one
   balanced journal. Manual journals, VAT, CT, assets, payroll.
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100+Number.EPSILON*Math.sign(+n||0))/100;
const fmt=n=>{n=r2(n);return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtS=n=>{n=r2(n);if(Math.abs(n)<0.005)return '–';return n<0?'('+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+')':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const aed=n=>'AED '+fmt(n);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const addMonths=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return dkey(d)};
const monthEnd=k=>{const [y,m]=k.split('-').map(Number);return dkey(new Date(y,m,0))};
const dstr=k=>k?new Date(k+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const mname=k=>new Date(k.slice(0,7)+'-15T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const tstr=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dtstr=ts=>ts?new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function deepMerge(a,b){for(const k in b){const bv=b[k],av=a[k];if(bv&&typeof bv==='object'&&!Array.isArray(bv)&&av&&typeof av==='object'&&!Array.isArray(av))deepMerge(av,bv);else a[k]=bv}return a}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}
function csv(rows){return rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function saveFile(name,data){try{const blob=new Blob([data],{type:/\.csv$/.test(name)?'text/csv':/\.json$/.test(name)?'application/json':'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('Saved '+name)}catch(e){toast('Could not save the file.')}}
function openModal(html,bind,wide){const m=$('#modal');m.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);m.onclick=e=>{if(e.target===m)closeModal()};if(bind)bind(m.querySelector('.dlg'));
  const f=m.querySelector('input:not([type=checkbox]),select');if(f&&matchMedia('(pointer:fine)').matches)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal').innerHTML='';if(A.ready)schedule()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
function confirmBox(title,msg,ok,fn,danger){openModal(`<div class="dlg-h"><h2>${esc(title)}</h2></div><div class="dlg-b"><p style="margin:0">${msg}</p></div><div class="dlg-f"><button class="btn" data-close>Cancel</button><button class="btn ${danger?'danger':'pri'}" id="okb">${esc(ok)}</button></div>`,d=>{d.querySelector('#okb').onclick=async()=>{d.querySelector('#okb').disabled=true;try{await fn();closeModal()}catch(e){fail(e);d.querySelector('#okb').disabled=false}}})}
function fail(e){console.error(e);if(e&&(e.code==='permission-denied'||/insufficient permissions/i.test(e.message||''))){toast("Your account can't change this. Only the owner can.");return}toast('Could not save: '+((e&&e.message)||'try again'))}

/* ---------- storage: same database as the POS ---------- */
function LocalDB(){
  let store=lsGet('wk_localdb',{});const subs=new Set();
  window.addEventListener('storage',e=>{if(e.key==='wk_localdb'){store=lsGet('wk_localdb',{});subs.forEach(f=>f())}});
  const save=()=>lsSet('wk_localdb',store);const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const snap=p=>{const d=store[p];return{id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined}};
  const cmp=(a,op,b)=>op==='=='?a===b:op==='>='?a>=b:op==='<='?a<=b:op==='>'?a>b:op==='<'?a<b:op==='in'?b.includes(a):false;
  function doc(p){return{id:p.split('/').pop(),path:p,get:async()=>snap(p),set:async d=>{store[p]=clone(d);save();notify()},
    mergeSet:async d=>{store[p]=deepMerge(store[p]||{},clone(d));save();notify()},
    update:async d=>{if(!store[p])throw{code:'not-found',message:'missing'};deepMerge(store[p],clone(d));save();notify()},
    delete:async()=>{delete store[p];save();notify()},onSnapshot:(n)=>{const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
  function coll(p,filters){filters=filters||[];const depth=p.split('/').length+1;
    const run=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===depth).sort().map(snap).filter(s=>filters.every(([f,op,v])=>cmp(s.data()[f],op,v)));return{docs,size:docs.length,empty:!docs.length}};
    return{where:(f,op,v)=>coll(p,filters.concat([[f,op,v]])),get:async()=>run(),onSnapshot:n=>{const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
  return{local:true,doc,collection:p=>coll(p)}}
function FirebaseDB(fs){
  const soon=p=>{let late=false;p.catch(e=>{if(late)fail(e)});return Promise.race([p,new Promise(r=>setTimeout(()=>{late=true;r()},4000))])};
  const wd=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>soon(r.set(d)),mergeSet:d=>soon(r.set(d,{merge:true})),update:d=>soon(r.update(d)),delete:()=>soon(r.delete()),onSnapshot:(n,e)=>r.onSnapshot(n,e)});
  const wq=q=>({where:(f,o,v)=>wq(q.where(f,o,v)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e)});

function ageing(a,to,sign){const by={};for(const e of entries()){if(e.date>to)break;for(const l of e.lines)if(l.a===a){const p=l.p||'(no name)';(by[p]=by[p]||[]).push({date:e.date,amt:r2(lineAmt(l)*sign),no:e.no})}}
  const out=[];for(const p in by){const inv=[];let credit=0;for(const x of by[p]){if(x.amt>0)inv.push(Object.assign({},x));else credit+=-x.amt}
    for(const i of inv){const u=Math.min(i.amt,credit);i.amt=r2(i.amt-u);credit=r2(credit-u)}
    const bk=[0,0,0,0,0];inv.forEach(i=>{if(i.amt<=0.004)return;const d=daysBetween(i.date,to);bk[d<=30?0:d<=60?1:d<=90?2:d<=180?3:4]+=i.amt});

async function saveEntry(e){if(!canWrite())throw{code:'permission-denied'};
  e.lines=e.lines.map(l=>{const o={a:l.a,dr:r2(l.dr),cr:r2(l.cr)};if(l.p)o.p=l.p;if(l.vb)o.vb=l.vb;if(l.d)o.d=String(l.d).slice(0,120);return o}).filter(l=>l.dr||l.cr);
  const c=checkLines(e.lines);if(!c.ok)throw{message:`Debits ${fmt(c.dr)} and credits ${fmt(c.cr)} must be equal and more than zero.`};
  if(isLocked(e.date))throw{message:`${dstr(e.date)} is in a locked period (locked up to ${dstr(A.set.lock)}).`};
  if(!vatOn(e.date)&&!['vat','vatp'].includes(e.src)&&e.lines.some(l=>l.a==='1300'||l.vb==='P'||l.vb==='R'))e.lines=foldVat(e.lines);
  const isNew=!e.id;if(isNew){e.id=uid('j');e.ts=Date.now();e.by=who();e.no=e.no||nextNo(e.date,SRC_PREFIX[e.src]||'JV')}

function expAcct(cat){return (A.set.expMap||{})[cat]||EXP_MAP_DEF[cat]||'6900'}
function buildPosDay(d,R){
  const L={};const add=(a,amt,p,vb,dd)=>{amt=r2(amt);if(!amt)return;const k=[a,p||'',vb||''].join('|');const x=L[k]||(L[k]={a,p:p||'',vb:vb||'',v:0});x.v=r2(x.v+amt)};
  const docs=[];let n=0,sales=0,vat=0;const rate=+(A.posSet.vat||A.set.vatRate||5);
  for(const o of R.orders){if(o.date!==d||o.void)continue;n++;
    sales+=+o.total||0;vat+=+o.vat||0;
    add(o.plat?'4010':'4000',-(+o.net||0),'','S');add('2100',-(+o.vat||0),'','S');
    let paid=0;for(const k in (o.pay||{})){const v=+o.pay[k]||0;paid+=v;
      if(k==='cash')add(o.collector?'1030':'1000',v,o.collector?'e:'+o.collector:'');else if(k==='card')add('1020',v);
      else if(k==='credit')add('1100',v,'c:'+(o.cust||''));else if(k==='platform')add('1110',v,'x:'+(o.plat||'other'));else add('1000',v)}
    const diff=r2((+o.total||0)-paid);if(Math.abs(diff)>0.004)add('1000',diff);
    const cogs=r2((o.lines||[]).reduce((s,l)=>s+(+l.c||0)*(+l.q||0),0));if(cogs){add('5000',cogs);add('1200',-cogs)}}
  for(const id in R.cust){const c=R.cust[id];for(const tid in (c.tx||{})){const t=c.tx[tid];const td=t.date||dkey(t.ts||0);if(td!==d)continue;const amt=+t.amt||0;
    if(t.t==='pay'){add(({cash:'1000',card:'1020',transfer:'1010'})[t.method]||'1000',amt);add('1100',-amt,'c:'+id)}
    else if(t.t==='adj'&&!String(t.ref||'').startsWith('Void')){add('1100',amt,'c:'+id);add(amt>=0?'4900':'6930',-amt)}}}
  const von=vatOn(d);
  for(const e of R.exps){if(e.del||e.date!==d)continue;const amt=+e.amt||0;const v=e.vat&&von?r2(amt*rate/(100+rate)):0;const a=expAcct(e.cat);
    add(a,amt-v,'',v?'P':'');if(v)add('1300',v,'','P');add(e.drawer?'1000':(A.set.nonDrawer||'1010'),-amt);
    docs.push({k:'exp',cat:e.cat,note:e.note||'',net:r2(amt-v),vat:v,acct:a,drawer:!!e.drawer})}
  for(const p of R.purs){if(p.del)continue;const sup='s:'+(p.sup||'');
    if(p.date===d){if(von){add('1200',+p.sub||0,'',+p.vat?'P':'');if(+p.vat)add('1300',+p.vat,'','P')}else add('1200',+p.total||0);add('2000',-(+p.total||0),sup);
      const s=A.sup[p.sup]||{};docs.push({k:'pur',sup:s.name||p.sup,trn:s.trn||'',inv:p.inv||'',net:r2(+p.sub||0),vat:r2(+p.vat||0)})}
    if(p.paid&&p.payDate===d){add('2000',+p.total||0,sup);const k=p.method==='cash'?(p.drawer?'cash':'cashout'):(p.method||'cash');add(PM_ACCT[k]||'1010',-(+p.total||0))}}
  for(const m of R.movs){if(m.del||m.date!==d)continue;const v=+m.val||0;if(m.t==='waste'){add('5020',v);add('1200',-v)}else if(m.t==='count'){add('1200',v);add('5020',-v)}}
  const cl=R.close||{};let closed=!!cl.closed;
  for(const h of Object.values(cl.hand||{})){const kd=h.kind||'hand';const got=+h.got||0;const who='e:'+(h.rider||'');
    if(kd==='hand'){add('1000',got);add('1030',-(+h.expected||0),who);add('1120',r2((+h.expected||0)-got),who)}
    else if(kd==='repay'){add('1000',got);add('1120',-got,who)}else if(kd==='salary'){add('2020',got,who);add('1120',-got,who)}else if(kd==='forgive'){add('6950',got);add('1120',-got,who)}}
  if(closed&&cl.counted!=null&&cl.expected!=null){const df=r2(+cl.counted-(+cl.expected));if(df){add('1000',df);add('6950',-df)}
    const nx=R.next||{};if(nx.float!=null&&nx.float!==''){const out=r2(+cl.counted-(+nx.float));if(out)add('1040',out),add('1000',-out)}}

function costTable(p){const rows=[['Cost of sales',p.cos],['Staff costs',p.opx.staff],['Rent and utilities',p.opx.occ],['Selling and delivery',p.opx.sell],['General and admin',p.opx.admin],['Depreciation',p.opx.dep],['Finance costs',p.fin]].filter(x=>Math.abs(x[1])>0.004);

   <polyline fill="none" stroke="var(--ok)" stroke-width="1.5" points="${mo.map((x,i)=>`${P+i*bw+bw*.12+bw*.36},${y(x.np)}`).join(' ')}"/></svg>`}

RENDER.bank=function(){const t=today();const acs=moneyAccts().concat([acct('1020'),acct('1030'),acct('1040')]);const a=acct(UI.bankA);const rec=A.rec[a.code]||{};const st=rec.st||{date:t,bal:''};const cl=rec.c||{};

  const unIn=r2(open.filter(x=>lineAmt(x.l)>0).reduce((s,x)=>s+lineAmt(x.l),0)),unOut=r2(open.filter(x=>lineAmt(x.l)<0).reduce((s,x)=>s-lineAmt(x.l),0));const diff=st.bal===''?null:r2(+st.bal-cleared);
  return `<div class="topbar"><h1>Bank & cash</h1>${canWrite()?'<button class="btn" data-a="newXfer">Transfer / deposit</button><button class="btn" data-a="newCard">Card settlement</button>':''}</div>

   <div class="fgrid"><label class="field"><span class="lbl">Statement date</span><input type="date" id="stD" value="${esc(st.date)}"></label><label class="field"><span class="lbl">Statement closing balance</span><input type="number" step="0.01" id="stB" value="${esc(st.bal)}" placeholder="from the bank statement"></label><div class="field" style="justify-content:flex-end">${canWrite()?'<button class="btn" data-a="saveSt">Save statement</button>':''}</div></div>

function vatReturn(from,to){const b={};const add=(k,amt,vat)=>{const x=b[k]||(b[k]={amt:0,vat:0});x.amt=r2(x.amt+amt);x.vat=r2(x.vat+vat)};const eb=EMIRATES[A.set.emirate]||'1b';
  for(const e of entries()){if(e.date<from||e.date>to||e.src==='vat'||e.src==='vatp')continue;
    for(const l of e.lines){const isV=l.a==='2100'||l.a==='1300';const cr=r2((+l.cr||0)-(+l.dr||0));
      switch(l.vb||''){case 'S':isV?add(eb,0,cr):add(eb,cr,0);break;case 'Z':if(!isV)add('4',cr,0);break;case 'E':if(!isV)add('5',cr,0);break;
        case 'P':isV?add('9',0,-cr):add('9',-cr,0);break;
        case 'R':if(l.a==='2100')add('3',0,cr);else if(l.a==='1300')add('10',0,-cr);else{add('3',-cr,0);add('10',-cr,0)}break;
        default:if(l.a==='2100')add(eb,0,cr);else if(l.a==='1300')add('9',0,-cr)}}}
  const g=k=>b[k]||{amt:0,vat:0};const s8=['1a','1b','1c','1d','1e','1f','1g','2','3','4','5','6','7'];
  const b8={amt:r2(s8.reduce((s,k)=>s+g(k).amt,0)),vat:r2(s8.reduce((s,k)=>s+g(k).vat,0))};const b11={amt:r2(g('9').amt+g('10').amt),vat:r2(g('9').vat+g('10').vat)};
  return{g,b8,b11,b12:b8.vat,b13:b11.vat,b14:r2(b8.vat-b11.vat),eb}}

 ['2','Tax refunds provided to tourists'],['3','Supplies subject to the reverse charge provisions'],['4','Zero rated supplies'],['5','Exempt supplies'],['6','Goods imported into the UAE'],['7','Adjustments to goods imported into the UAE']];

function vatAudit(p){const rows=[['Section','Date','Document','Name','TRN','Net (AED)','VAT (AED)','Gross (AED)','Account']];
  for(const e of entries()){if(e.date<p.from||e.date>p.to||e.src==='vat'||e.src==='vatp')continue;
    if(e.src==='pos'){const s=e.lines.filter(l=>l.vb==='S');const net=r2(s.filter(l=>l.a!=='2100').reduce((x,l)=>x+l.cr-l.dr,0)),vat=r2(s.filter(l=>l.a==='2100').reduce((x,l)=>x+l.cr-l.dr,0));
      if(net||vat)rows.push(['Sales (simplified tax invoices)',e.date,e.no,'Counter, delivery and platform sales','',net,vat,r2(net+vat),'4000/4010']);
      (e.docs||[]).filter(d=>d.vat>0).forEach(d=>rows.push(['Purchases',e.date,d.inv||'',d.sup||d.cat||'',d.trn||'',d.net,d.vat,r2(d.net+d.vat),d.k==='pur'?'1200':d.acct||'']));continue}
    const pv=e.lines.filter(l=>l.vb==='P'||l.vb==='R');if(pv.length){const net=r2(pv.filter(l=>l.a!=='1300'&&l.a!=='2100').reduce((x,l)=>x+l.dr-l.cr,0)),vat=r2(pv.filter(l=>l.a==='1300').reduce((x,l)=>x+l.dr-l.cr,0));rows.push([pv[0].vb==='R'?'Reverse charge':'Purchases',e.date,e.ref||e.no,e.payee||partyName((e.lines.find(l=>l.p)||{}).p),e.trn||'',net,vat,r2(net+vat),pv.filter(l=>l.a!=='1300'&&l.a!=='2100').map(l=>l.a).join(' ')])}
    const sv=e.lines.filter(l=>l.vb==='S'||l.vb==='Z'||l.vb==='E');if(sv.length){const net=r2(sv.filter(l=>l.a!=='2100').reduce((x,l)=>x+l.cr-l.dr,0)),vat=r2(sv.filter(l=>l.a==='2100').reduce((x,l)=>x+l.cr-l.dr,0));rows.push([sv[0].vb==='S'?'Other sales':sv[0].vb==='Z'?'Zero-rated sales':'Exempt sales',e.date,e.ref||e.no,e.payee||'','',net,vat,r2(net+vat),''])}}
  return rows}

  const lossUse=taxable>0?Math.min(+c.loss||0,r2(taxable*0.75)):0;taxable=r2(taxable-lossUse);

const ym=k=>k.slice(0,7);const prevYM=m=>addMonths(m+'-01',-1).slice(0,7);
function monthsIncl(a,b){const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)+1}
function faList(){return Object.entries(A.fa.items||{}).map(([id,v])=>Object.assign({id},v)).filter(a=>!a.del).sort((a,b)=>a.date.localeCompare(b.date))}
function depTo(a,M){const s=ym(a.date);const end=a.disp?ym(a.disp.date):null;const last=end&&end<M?end:M;if(last<s)return 0;const base=r2((+a.cost||0)-(+a.resid||0));const mth=base/((+a.life||1)*12);return r2(Math.min(base,mth*monthsIncl(s,last)))}
const depAll=M=>r2(faList().reduce((s,a)=>s+depTo(a,M),0));
function depPosted(M){return r2(manualEntries().filter(e=>e.src==='dep'&&e.ref<=M).reduce((s,e)=>s+e.lines.filter(l=>l.a==='6800').reduce((x,l)=>x+l.dr-l.cr,0),0))}
function depMonthsDue(){const fa=faList();if(!fa.length||!A.set.start)return [];const last=prevYM(today().slice(0,7));const startM=ym(A.set.start);let m=fa.map(a=>ym(a.date)).sort()[0];if(m<startM)m=startM;const out=[];const base=depAll(prevYM(startM));
  while(m<=last){const has=manualEntries().some(e=>e.src==='dep'&&e.ref===m);if(!has&&r2(depAll(m)-base-depPosted(m))>0.004)out.push(m+'-01');m=addMonths(m+'-01',1).slice(0,7)}return out}

function faDispose(a){openModal(`<div class="dlg-h"><h2>Dispose of ${esc(a.name)}</h2><button class="btn ghost" data-close>Cancel</button></div><div class="dlg-b"><div class="fgrid"><label class="field"><span class="lbl">Date</span><input id="dx_d" type="date" value="${today()}"></label><label class="field"><span class="lbl">Sold for (0 if scrapped)</span><input id="dx_p" type="number" step="0.01" value="0"></label><label class="field"><span class="lbl">Money received into</span><select id="dx_a">${payFromOpts('1010',true)}</select></label></div><p class="small muted" style="margin:0">Depreciation runs to the end of the disposal month. The gain or loss goes to account 4910.</p></div><div class="dlg-f"><button class="btn pri" id="dx_go">Dispose</button></div>`,d=>{
  d.querySelector('#dx_go').onclick=async()=>{const dt=d.querySelector('#dx_d').value,pr=r2(+d.querySelector('#dx_p').value||0);const ad=depTo(Object.assign({},a,{disp:{date:dt}}),ym(dt));const gain=r2(pr-(a.cost-ad));
   try{await saveEntry({src:'disp',date:dt,memo:'Disposal: '+a.name,lines:[pr?{a:d.querySelector('#dx_a').value,dr:pr,cr:0}:null,{a:'1590',dr:ad,cr:0},{a:a.acct,dr:0,cr:+a.cost},{a:'4910',dr:gain<0?-gain:0,cr:gain>0?gain:0}].filter(Boolean)});
    await DB.doc('acc/fa').mergeSet({items:{[a.id]:{disp:{date:dt,proceeds:pr}}}});closeModal();toast('Asset disposed')}catch(e){fail(e)}}})}
async function postDep(){const months=depMonthsDue();const startM=ym(A.set.start);const base=depAll(prevYM(startM));let done=0;
  for(const m0 of months){const m=ym(m0);const amt=r2(depAll(m)-base-depPosted(m));if(amt<=0.004)continue;await saveEntry({src:'dep',ref:m,date:monthEnd(m0),memo:'Depreciation '+mname(m0),lines:[{a:'6800',dr:amt,cr:0},{a:'1590',dr:0,cr:amt}]});done++;
    A.jm['tmp'+m]={id:'tmp'+m,src:'dep',ref:m,date:monthEnd(m0),lines:[{a:'6800',dr:amt,cr:0},{a:'1590',dr:0,cr:amt}]};bump()}
  Object.keys(A.jm).filter(k=>k.startsWith('tmp')).forEach(k=>delete A.jm[k]);bump();toast(`Depreciation posted for ${done} month${done===1?'':'s'}`)}

/* ---------- PAYROLL (UAE Labour Law gratuity, WPS list) ---------- */
function empList(all){return Object.entries(A.emp.items||{}).map(([id,v])=>Object.assign({id},v)).filter(e=>!e.del&&(all||e.active!==false)).sort((a,b)=>(a.name||'').localeCompare(b.name||''))}
function gratuity(e,asOf){if(!e.join||!(+e.basic))return{years:0,days:0,amt:0};const yrs=Math.max(0,daysBetween(e.join,asOf)/365);
  const days=Math.min(yrs,5)*21+Math.max(0,yrs-5)*30;const amt=Math.min(r2(+e.basic/30*days),r2(+e.basic*24));return{years:yrs,days,amt:r2(amt)}}
const ep=e=>'e:'+e.name;
RENDER.payroll=function(){const t=today();const emps=empList(true);const M=UI.payM||addMonths(firstOfMonth(),-1).slice(0,7);const run=manualEntries().find(e=>e.src==='pay'&&e.ref===M);
  const prov=partyBalances('2500',t);const pay=partyBalances('2020',t);const gTot=empList().reduce((s,e)=>s+gratuity(e,t).amt,0);const pTot=-Object.values(prov).reduce((s,v)=>s+v,0);
  return `<div class="topbar"><h1>Payroll</h1>${canWrite()?'<button class="btn" data-a="empNew">+ Employee</button><button class="btn" data-a="empImport">Import from POS staff</button>':''}</div>
  <div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="lbl">Monthly payroll</div><div class="v">${fmt(empList().reduce((s,e)=>s+(+e.basic||0)+(+e.allow||0),0))}</div><div class="d">${empList().length} active</div></div>
   <div class="kpi"><div class="lbl">Salaries still to pay</div><div class="v">${fmt(-Object.values(pay).reduce((s,v)=>s+v,0))}</div></div>
   <div class="kpi"><div class="lbl">Gratuity earned to date</div><div class="v">${fmt(gTot)}</div><div class="d">in the books ${fmt(pTot)}</div></div></div>
  <div class="grid2"><div class="panel stack"><div class="row" style="justify-content:space-between"><h2>Month</h2><input type="month" data-in="payM" value="${esc(M)}" style="width:auto"></div>
   ${run?`<div class="alert ok"><div class="grow">Payroll for ${mname(M+'-01')} is posted (${esc(run.no)}): gross ${fmt(run.lines.filter(l=>l.a==='6000').reduce((s,l)=>s+l.dr,0))}.</div><button class="btn sm" data-a="viewEntry" data-id="${esc(run.id)}">View</button></div>`:`<p class="small muted" style="margin:0">Not posted yet for ${mname(M+'-01')}.</p>`}
   ${canWrite()?`<div class="row">${run?'':'<button class="btn pri" data-a="payRun">Run payroll</button>'}<button class="btn" data-a="payPay">Pay salaries</button><button class="btn" data-a="eosbPost">Update gratuity provision</button><button class="btn" data-a="wpsCsv">WPS salary list (CSV)</button></div>`:''}
   <p class="small muted" style="margin:0">Running payroll books gross salaries as an expense and as owed to each person. Paying salaries clears what is owed from the bank (WPS) or cash. Cash shortages that the POS cut from a delivery person's salary are already deducted.</p></div>
  <div class="panel"><h2>Employees</h2>${emps.length?`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th class="r">Basic</th><th class="r">Allowances</th><th>Joined</th><th class="r">Gratuity</th><th class="r">Unpaid</th></tr></thead><tbody>${emps.map(e=>{const g=gratuity(e,t);return `<tr class="click ${e.active===false?'void':''}" data-a="empEdit" data-id="${e.id}"><td>${esc(e.name)}${e.mol?`<div class="small muted">MOL ${esc(e.mol)}</div>`:''}</td><td class="r">${fmt(e.basic||0)}</td><td class="r">${fmt(e.allow||0)}</td><td class="num small">${e.join?dstr(e.join):'<span class="pill p-warn">add</span>'}</td><td class="r">${fmt(g.amt)}<div class="small muted">${g.years.toFixed(1)} yrs</div></td><td class="r">${fmt(-(pay[ep(e)]||0))}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>No employees</b>Import them from the POS staff list, then add basic salary, allowances and joining date.</div>'}
  <p class="small muted">Gratuity follows the UAE Labour Law: 21 days of basic salary for each of the first 5 years and 30 days for each year after, capped at 2 years' basic. It is built up from the first day as a provision, although it is only payable after 1 year of service.</p></div></div>`};
function empForm(e){e=e||{name:'',basic:'',allow:'',join:'',iban:'',mol:'',active:true};const isNew=!e.id;
  openModal(`<div class="dlg-h"><h2>${isNew?'New employee':esc(e.name)}</h2><button class="btn ghost" data-close>Cancel</button></div><div class="dlg-b">
   <div class="fgrid"><label class="field"><span class="lbl">Name</span><input id="em_n" value="${esc(e.name)}" ${isNew?'':'disabled'}></label><label class="field"><span class="lbl">Basic salary / month</span><input id="em_b" type="number" step="0.01" value="${esc(e.basic)}"></label><label class="field"><span class="lbl">Allowances / month</span><input id="em_a" type="number" step="0.01" value="${esc(e.allow)}"><span class="small muted">housing, transport, food</span></label>

function payRunForm(){const M=UI.payM||addMonths(firstOfMonth(),-1).slice(0,7);const emps=empList();if(!emps.length){toast('Add employees first.');return}
  const adv=partyBalances('1120',monthEnd(M+'-01'));
  openModal(`<div class="dlg-h"><h2>Payroll · ${mname(M+'-01')}</h2><button class="btn ghost" data-close>Cancel</button></div><div class="dlg-b"><div class="tbl-wrap"><table class="jl"><thead><tr><th>Employee</th><th class="r">Basic</th><th class="r">Allowances</th><th class="r">Overtime / bonus</th><th class="r">Recover advance</th><th class="r">Net</th></tr></thead><tbody>

   <tr class="sub"><td>Total</td><td colspan="4"></td><td class="r num" id="prTot"></td></tr></tbody></table></div><p class="small muted" style="margin:0">Recover advance takes money back from a staff advance or cash shortage (account 1120). Shortages that the till already cut from salary are not shown here.</p></div>
   <div class="dlg-f"><button class="btn pri" id="pr_go">Post payroll</button></div>`,d=>{

     if(v('d'))lines.push({a:'1120',dr:0,cr:v('d'),p:'e:'+e.name,d:'Advance recovered'});if(g-v('d'))lines.push({a:'2020',dr:0,cr:r2(g-v('d')),p:'e:'+e.name})});
    lines.unshift({a:'6000',dr:r2(gross),cr:0,d:'Gross salaries '+mname(M+'-01')});
    try{await saveEntry({src:'pay',ref:M,date:monthEnd(M+'-01'),memo:'Payroll '+mname(M+'-01'),lines});closeModal();toast('Payroll posted')}catch(e){fail(e)}}},true)}
function payPayForm(){const pay=partyBalances('2020',monthEnd(today()));const due=Object.entries(pay).filter(([,v])=>v<-0.004);if(!due.length){toast('No salaries are owed right now.');return}
  openModal(`<div class="dlg-h"><h2>Pay salaries</h2><button class="btn ghost" data-close>Cancel</button></div><div class="dlg-b"><div class="fgrid"><label class="field"><span class="lbl">Date paid</span><input id="pp_d" type="date" value="${today()}"></label><label class="field"><span class="lbl">Paid from</span><select id="pp_a">${payFromOpts('1010',true)}</select></label><label class="field"><span class="lbl">WPS / bank reference</span><input id="pp_r"></label></div>
   <table><tbody>${due.map(([p,v])=>`<tr><td><label class="row"><input type="checkbox" data-pp="${esc(p)}" checked> ${esc(partyName(p))}</label></td><td class="r"><input type="number" step="0.01" data-ppa="${esc(p)}" value="${-v}" style="width:120px"></td></tr>`).join('')}</tbody></table></div><div class="dlg-f"><button class="btn pri" id="pp_go">Record payment</button></div>`,d=>{
   d.querySelector('#pp_go').onclick=async()=>{const lines=[];let T=0;d.querySelectorAll('[data-pp]').forEach(c=>{if(!c.checked)return;const a=r2(+d.querySelector(`[data-ppa="${CSS.escape(c.dataset.pp)}"]`).value||0);if(a>0){lines.push({a:'2020',dr:a,cr:0,p:c.dataset.pp});T+=a}});

    try{await saveEntry({src:'payp',date:d.querySelector('#pp_d').value,ref:d.querySelector('#pp_r').value.trim(),memo:'Salaries paid',lines});closeModal();toast('Salaries paid')}catch(e){fail(e)}}})}
async function eosbPost(){const asOf=monthEnd(addMonths(firstOfMonth(),-1));const prov=partyBalances('2500',asOf);const lines=[];let T=0;
  empList(true).forEach(e=>{const need=e.active===false?-(prov[ep(e)]||0):gratuity(e,asOf).amt;const have=-(prov[ep(e)]||0);const diff=r2(need-have);if(Math.abs(diff)>0.004){lines.push({a:'2500',dr:diff<0?-diff:0,cr:diff>0?diff:0,p:ep(e)});T+=diff}});
  if(!lines.length){toast('Gratuity provision is already up to date.');return}lines.push({a:'6020',dr:T>0?r2(T):0,cr:T<0?r2(-T):0});
  confirmBox('Update gratuity provision',`Brings the end-of-service provision to the amount earned at ${dstr(asOf)}: ${T>=0?'add':'release'} ${aed(Math.abs(T))}.`,'Post',()=>saveEntry({src:'eosb',date:asOf,memo:'End-of-service gratuity provision to '+dstr(asOf),lines}).then(()=>toast('Provision updated')))}

RENDER.audit=function(){const ev=[];manualEntries(true).forEach(e=>{ev.push({ts:e.ts,by:e.by,what:'Created',e});Object.values(e.hist||{}).forEach(h=>ev.push({ts:h.ts,by:h.by,what:h.what,e}));if(e.void)ev.push({ts:e.voidTs,by:e.voidBy,what:'Voided'+(e.voidWhy?': '+e.voidWhy:''),e})});
  Object.values(A.pos).forEach(p=>ev.push({ts:p.ts,by:p.by,what:'Posted from POS',e:{id:'pos_'+p.date,no:'POS-'+p.date.replace(/-/g,''),date:p.date,memo:`${p.n||0} bills`}}));

/* ---------- form helpers ---------- */
function payFromOpts(sel,moneyOnly){const ms=moneyAccts();return ms.map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${esc(a.name)}</option>`).join('')+
  (moneyOnly?'':`<option value="AP" ${sel==='AP'?'selected':''}>On credit – pay later (supplier owed)</option>`)}
function partyCode(name){name=(name||'').trim();if(!name)return '';const lo=name.toLowerCase();
  for(const id in A.sup)if((A.sup[id].name||'').toLowerCase()===lo)return 's:'+id;for(const id in A.cust)if((A.cust[id].name||'').toLowerCase()===lo)return 'c:'+id;
  if(empList(true).some(e=>e.name.toLowerCase()===lo))return 'e:'+empList(true).find(e=>e.name.toLowerCase()===lo).name;
  for(const p of (A.posSet.platforms||[]))if(p.name.toLowerCase()===lo)return 'x:'+p.id;return 'n:'+name}
function payFromLine(v,amt,payee){return v==='AP'?{a:'2000',dr:0,cr:r2(amt),p:partyCode(payee)||'n:Supplier'}:{a:v,dr:0,cr:r2(amt)}}
function payeeList(){const n=new Set();Object.values(A.sup).forEach(s=>s&&s.name&&!s.del&&n.add(s.name));Object.values(A.cust).forEach(c=>c&&c.name&&!c.del&&n.add(c.name));empList(true).forEach(e=>n.add(e.name));(A.posSet.platforms||[]).forEach(p=>n.add(p.name));
  manualEntries().forEach(e=>e.lines.forEach(l=>{if(l.p&&l.p.startsWith('n:'))n.add(l.p.slice(2))}));return `<datalist id="dlPayees">${[...n].sort().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}
const acctOpts=(sel,f)=>coaList().filter(f||(()=>true)).map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${a.code} · ${esc(a.name)}</option>`).join('');
const rate=()=>+A.set.vatRate||5;
const dateGuard=d=>{if(!d){toast('Pick a date.');return false}if(isLocked(d)){toast(`${dstr(d)} is locked (up to ${dstr(A.set.lock)}).`);return false}return true};

function journalForm(e){e=e?clone(e):{src:'man',date:today(),memo:'',ref:'',lines:[{a:'',dr:0,cr:0},{a:'',dr:0,cr:0}]};const isNew=!e.id;
  const row=(l,i)=>`<tr data-ln="${i}"><td style="min-width:200px"><select data-k="a"><option value="">Choose account</option>${acctOpts(l.a)}</select></td><td><input data-k="p" list="dlPayees" value="${esc(l.p?partyName(l.p):'')}" placeholder="optional"></td>

    <td><input data-k="dr" type="number" step="0.01" value="${l.dr||''}" style="width:110px"></td><td><input data-k="cr" type="number" step="0.01" value="${l.cr||''}" style="width:110px"></td><td><button class="btn sm ghost" data-rm="${i}" aria-label="Remove line">✕</button></td></tr>`;
  openModal(`<div class="dlg-h"><h2>${isNew?'New journal entry':'Edit '+esc(e.no)}</h2><button class="btn ghost" data-close>Cancel</button></div><div class="dlg-b">
   <div class="fgrid"><label class="field"><span class="lbl">Date</span><input id="j_d" type="date" value="${esc(e.date)}"></label><label class="field" style="grid-column:span 2"><span class="lbl">Description</span><input id="j_m" value="${esc(e.memo)}" placeholder="What is this entry for?"></label><label class="field"><span class="lbl">Reference</span><input id="j_r" value="${esc(e.ref||'')}"></label></div>
   <div class="tbl-wrap"><table class="jl"><thead><tr><th>Account</th><th>Name</th><th>VAT</th><th>Debit</th><th>Credit</th><th></th></tr></thead><tbody id="jlb">${e.lines.map(row).join('')}</tbody></table></div>
   <div class="row" style="justify-content:space-between"><button class="btn sm" id="j_add">+ Line</button><span class="num" id="j_tot"></span></div>
   <label class="field"><span class="lbl">Link to document (optional)</span><input id="j_att" value="${esc(e.att||'')}" placeholder="Google Drive / Dropbox link to the invoice photo"></label>${payeeList()}</div>
   <div class="dlg-f"><button class="btn pri" id="j_go">Save entry</button></div>`,d=>{
   const read=()=>[...d.querySelectorAll('[data-ln]')].map(r=>({a:r.querySelector('[data-k=a]').value,p:partyCode(r.querySelector('[data-k=p]').value),vb:r.querySelector('[data-k=vb]').value,dr:r2(+r.querySelector('[data-k=dr]').value||0),cr:r2(+r.querySelector('[data-k=cr]').value||0)}));
   const tot=()=>{const c=checkLines(read());const el=d.querySelector('#j_tot');el.textContent=`Debit ${fmt(c.dr)} · Credit ${fmt(c.cr)}${c.ok?'':' · difference '+fmt(c.dr-c.cr)}`;el.className='num '+(c.ok?'ok':'bad')};
   const redraw=ls=>{d.querySelector('#jlb').innerHTML=ls.map(row).join('');tot()};
   d.addEventListener('input',tot);d.addEventListener('change',tot);tot();
   d.querySelector('#j_add').onclick=()=>{const ls=read().map(l=>Object.assign(l,{p:l.p}));const c=checkLines(ls);const diff=r2(c.dr-c.cr);ls.push({a:'',dr:diff<0?-diff:0,cr:diff>0?diff:0});redraw(ls)};
   d.querySelector('#jlb').onclick=ev=>{const b=ev.target.closest('[data-rm]');if(!b)return;const ls=read();ls.splice(+b.dataset.rm,1);redraw(ls.length?ls:[{a:'',dr:0,cr:0}])};
   d.querySelector('#j_go').onclick=async()=>{const ls=read().filter(l=>l.dr||l.cr);if(ls.some(l=>!l.a)){toast('Choose an account on every line.');return}const dt=d.querySelector('#j_d').value;if(!dateGuard(dt))return;

  const sum=()=>{const b=build();d.querySelector('#o_sum').innerHTML=`<span>Net ${fmt(b.net)} · VAT ${fmt(b.vat)}</span><span>${d.querySelector('#o_v').value==='R'?'VAT is self-charged and recovered in the same return':''}</span>`};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=ACT[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;UI[k]=e.target.value;const id=e.target.id,pos=e.target.selectionStart;
  if(e.target.tagName==='INPUT'&&['text','search',''].includes(e.target.type)){clearTimeout(window.__inT);window.__inT=setTimeout(()=>{paint();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},250);return}paint()});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.clr){try{await DB.doc('acc/rec').mergeSet({[UI.bankA]:{c:{[t.dataset.clr]:t.checked}}})}catch(x){fail(x)}}
  if(t.dataset.expmap&&canOwner()){try{await DB.doc('acc/set').mergeSet({expMap:{[t.dataset.expmap]:t.value}});toast('Saved. Tap Update from POS to re-post past days.')}catch(x){fail(x)}}
  if(t.dataset.setf&&canOwner()){try{await DB.doc('acc/set').mergeSet({[t.dataset.setf]:t.value});toast('Saved')}catch(x){fail(x)}}
  if(t.dataset.ctsbr){try{await DB.doc('acc/ct').mergeSet({[t.dataset.ctsbr]:{sbr:t.checked}})}catch(x){fail(x)}}});
document.addEventListener('submit',async e=>{if(e.target.dataset.f!=='setCo')return;e.preventDefault();if(!canOwner())return;const v=$('#s_vf').value;
  const s={legal:$('#s_legal').value.trim(),addr:$('#s_addr').value.trim(),licence:$('#s_lic').value.trim(),trn:$('#s_trn').value.trim(),ctTrn:$('#s_ctrn').value.trim(),emirate:$('#s_em').value,vatReg:$('#s_vreg').value==='1',vatFrom:$('#s_vfrom').value,fyStart:+$('#s_fy').value,vatFreq:v==='m'?'m':'q',vatStart:v==='m'?1:+v.slice(1),sbrPrev:$('#s_sbr').checked};
  if(s.trn&&!/^\d{15}$/.test(s.trn)){toast('A TRN has 15 digits.');return}if(s.vatReg&&!s.trn){toast('Add the TRN from the VAT certificate.');return}try{await DB.doc('acc/set').mergeSet(s);toast('Company details saved')}catch(x){fail(x)}});

/* ---------- data ---------- */
let autoSynced=false;
function subscribe(){const err=e=>{console.warn(e);if(e&&e.code==='permission-denied'){A.auth='denied';paint()}};
  const done=k=>{A.loaded[k]=1;if(!A.ready&&['set','j','pos'].every(x=>A.loaded[x])){A.ready=true;
      const ls=lsGet('wk_acc_sync',null);if(ls){A.sync.last=ls.last;A.sync.changedLocked=ls.changed||[]}}
    bump();schedule();if(A.ready&&!autoSynced&&A.set.start&&canWrite()){autoSynced=true;setTimeout(()=>syncPos(A.set.start>addDays(today(),-62)?A.set.start:addDays(today(),-62),today(),true),300)}};
  DB.doc('acc/set').onSnapshot(s=>{A.set=Object.assign(clone(SET_DEF),{trn:A.posSet.trn||''},s.data()||{});done('set')},err);
  ['coa','fa','emp','rec','vat','ct'].forEach(k=>DB.doc('acc/'+k).onSnapshot(s=>{A[k]=s.data()||{};done(k)},err));
  DB.collection('accj').onSnapshot(q=>{const m={};q.docs.forEach(d=>{const o=(d.data()||{}).o||{};for(const id in o)if(o[id]&&o[id].lines)m[id]=Object.assign({id},o[id])});A.jm=m;done('j')},err);
  DB.collection('accpos').onSnapshot(q=>{const m={};q.docs.forEach(d=>{const x=d.data();if(x&&x.date)m[x.date]=x});A.pos=m;done('pos')},err);
  DB.doc('cfg/settings').onSnapshot(s=>{A.posSet=s.data()||{};done('ps')},()=>{});
  DB.doc('cfg/sup').onSnapshot(s=>{A.sup=(s.data()||{}).items||{};done('sup')},()=>{});
  DB.doc('cfg/staff').onSnapshot(s=>{A.staff=(s.data()||{}).items||{};done('staff')},()=>{});
  DB.collection('cust').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());A.cust=m;done('cust')},()=>{});
  if(A.role==='owner'&&DB.fb)DB.collection('users').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());A.users=m;done('users')},()=>{});
  setTimeout(()=>{if(!A.ready){A.ready=true;paint()}},7000)}
let pp=false;function schedule(){if(pp)return;pp=true;requestAnimationFrame(()=>{pp=false;const a=document.activeElement;if($('#modal').innerHTML)return void paintRail();
  if(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&!a.dataset.in){return}paint()})}
function applyTheme(){const t=lsGet('wk_theme','');if(t)document.documentElement.dataset.theme=t}

async function boot(){applyTheme();const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))UI.view=h;
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/YOUR_|PASTE/i.test(cfg.apiKey)){DB=LocalDB();A.role='owner';A.auth='in';paint();subscribe();return}
  firebase.initializeApp(cfg);const fs=firebase.firestore();try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous){if(u)firebase.auth().signOut();A.auth='out';A.user=null;paint();return}
    A.user=u;const owners=(window.OWNER_EMAILS||[]).map(x=>String(x).toLowerCase());const isOwnerEmail=owners.includes((u.email||'').toLowerCase());
    let role='';try{const s=await fs.doc('users/'+u.uid).get();role=(s.data()||{}).role||''}catch(e){console.warn(e)}
    if(isOwnerEmail||role==='owner')A.role='owner';else if(role==='accountant')A.role='accountant';else{A.auth='denied';paint();return}
    A.auth='in';DB=FirebaseDB(fs);paint();subscribe()})}
boot();
})();
</script>
